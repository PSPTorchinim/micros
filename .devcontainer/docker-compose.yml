# DJ Beat Blaster - Development Infrastructure
# This Docker Compose file provides infrastructure services for local development.
#
# Port Forwarding: VS Code port forwarding works from within the devcontainer's network
# namespace, not from sibling containers. To enable proper port forwarding, all
# infrastructure services use network_mode: service:devcontainer to share the same
# network namespace. This makes services accessible via localhost from within the
# devcontainer and allows VS Code to forward ports to the host.
#
# For local development outside devcontainer, use 'localhost' instead - see LOCAL_DEVELOPMENT_SETUP.md
name: djpanel-devcontainer

services:
  # Development container
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Ports exposed by the devcontainer for VS Code port forwarding.
    # Infrastructure services share this network namespace via network_mode: service:devcontainer
    ports:
      - "1433:1433"       # SQL Server
      - "27017:27017"     # MongoDB
      - "5432:5432"       # PostgreSQL
      - "6379:6379"       # Redis
      - "5672:5672"       # RabbitMQ
      - "15672:15672"     # RabbitMQ Management
      - "1337:1337"       # Strapi CMS
      - "3001:3001"       # Grafana
      - "9090:9090"       # Prometheus
      - "3100:3100"       # Loki

  # SQL Server for .NET microservices
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    network_mode: service:devcontainer
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # -C flag bypasses certificate validation (acceptable for local development)
      test: /opt/mssql-tools18/bin/sqlcmd -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 15s
      retries: 10

  # MongoDB for DocumentsAPI and MailingAPI
  mongodb:
    image: mongo:8
    restart: unless-stopped
    network_mode: service:devcontainer
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: mongosh --username admin --password password --authenticationDatabase admin --eval "db.adminCommand('ping')" --quiet || exit 1
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5

  # PostgreSQL for Strapi CMS
  postgres:
    image: postgres:16
    restart: unless-stopped
    network_mode: service:devcontainer
    environment:
      POSTGRES_DB: strapi_db
      POSTGRES_USER: strapi_user
      POSTGRES_PASSWORD: strapi_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U strapi_user -d strapi_db || exit 1
      interval: 10s
      timeout: 15s
      retries: 10

  # Redis for caching
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    network_mode: service:devcontainer
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping | grep PONG
      interval: 10s
      timeout: 15s
      retries: 10

  # RabbitMQ for message queue
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    network_mode: service:devcontainer
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 15s
      retries: 10

  # ================================================
  # APPLICATION SERVICES
  # ================================================

  # Strapi CMS
  strapi:
    image: strapi/strapi:4.25-alpine
    restart: unless-stopped
    network_mode: service:devcontainer
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi_db
      DATABASE_USERNAME: strapi_user
      DATABASE_PASSWORD: strapi_password
      JWT_SECRET: local-dev-jwt-secret-123456789
      ADMIN_JWT_SECRET: local-dev-admin-jwt-secret-123456789
      APP_KEYS: local-dev-app-key-1,local-dev-app-key-2
      API_TOKEN_SALT: local-dev-api-token-salt
      TRANSFER_TOKEN_SALT: local-dev-transfer-token-salt
      NODE_ENV: development
    volumes:
      - strapi_data:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:1337/admin || exit 1
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 5

  # ================================================
  # LOGGING & MONITORING SERVICES
  # ================================================

  # Loki for log aggregation
  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    network_mode: service:devcontainer
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../Docker/init/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1
      interval: 15s
      timeout: 10s
      retries: 5

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    network_mode: service:devcontainer
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - ../Docker/init/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1
      interval: 15s
      timeout: 10s
      retries: 5

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    network_mode: service:devcontainer
    environment:
      GF_SERVER_HTTP_PORT: 3001
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../Docker/init/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../Docker/init/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  mssql_data:
  mongo_data:
  mongo_config:
  pg_data:
  redis_data:
  rabbitmq_data:
  strapi_data:
  loki_data:
  prometheus_data:
  grafana_data:
