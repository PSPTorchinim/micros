        API_GATEWAY: http://localhost:3000
        SECURE_KEY: LocalDevelopmentSecureKey123456789
        JWT_TOKEN: LocalDevelopmentJWTKey123456789012345678901234567890
        CMS_HOST: localhost
        CMS_PORT: "1337"
        CMS_PROTOCOL: http
        CMS_API_PATH: /api
    restart: unless-stopped
    network_mode: service:devcontainer
    environment:
      - PORT=3080
    depends_on:
      apigateway:
        condition: service_healthy
      strapi:
        condition: service_healthy

  storybook:
    build:
      context: ../
      dockerfile: Docker/frontends/storybook.Dockerfile
      args:
        MICROFRONTEND_NAME: dj-panel
    restart: unless-stopped
    network_mode: service:devcontainer

