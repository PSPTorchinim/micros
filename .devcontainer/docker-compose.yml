# DJ Beat Blaster - Devcontainer Overlay
# This file extends Docker/dj-panel-composer.yml with the devcontainer workspace.
# 
# The devcontainer.json references both compose files:
# 1. ../Docker/dj-panel-composer.yml - All production services
# 2. ./docker-compose.yml - Devcontainer workspace overlay
#
# All services start automatically when the codespace is created.

services:
  # Development container - workspace for coding
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    networks:
      - public
    depends_on:
      apigateway:
        condition: service_healthy
