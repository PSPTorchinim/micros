# DJ Beat Blaster - Development Environment
# This Docker Compose file provides all services for local development in a devcontainer.
#
# All services use network_mode: service:devcontainer to share the network namespace,
# making them accessible via localhost from within the devcontainer.
#
# Healthchecks are defined in the Dockerfiles - this file only overrides where needed.
#
# Port Forwarding: VS Code automatically forwards ports defined in devcontainer.json
name: djpanel-devcontainer

services:
  # Development container
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    privileged: true
    command: sleep infinity
    ports:
      # Infrastructure Services
      - "1433:1433"       # SQL Server
      - "27017:27017"     # MongoDB
      - "5432:5432"       # PostgreSQL
      - "6379:6379"       # Redis
      - "5672:5672"       # RabbitMQ
      - "15672:15672"     # RabbitMQ Management
      # Application Services (port 8080 internally, exposed on these ports)
      - "3000:3000"       # API Gateway
      - "5001:5001"       # Identity API
      - "5002:5002"       # Music API
      - "5003:5003"       # Equipment API
      - "5004:5004"       # Documents API
      - "5005:5005"       # Company API
      - "5006:5006"       # Party API
      - "5007:5007"       # Mailing API
      - "3080:3080"       # DJ Panel Frontend
      - "6006:6006"       # Storybook
      - "1337:1337"       # Strapi CMS
      # Monitoring Services
      - "3001:3001"       # Grafana
      - "9090:9090"       # Prometheus
      - "3100:3100"       # Loki

  # ================================================
  # INFRASTRUCTURE SERVICES
  # Healthchecks defined in Dockerfiles
  # ================================================

  # SQL Server for .NET microservices
  sqlserver:
    build:
      context: ../
      dockerfile: Docker/infra/sqlserver.Dockerfile
      args:
        DATABASE_PASSWORD_SQLSERVER: YourStrong@Passw0rd
    restart: unless-stopped
    network_mode: service:devcontainer
    volumes:
      - mssql_data:/var/opt/mssql

  # MongoDB for DocumentsAPI and MailingAPI
  mongodb:
    build:
      context: ../
      dockerfile: Docker/infra/mongodb.Dockerfile
      args:
        DATABASE_USER_MONGODB: admin
        DATABASE_PASSWORD_MONGODB: password
    restart: unless-stopped
    network_mode: service:devcontainer
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

  # PostgreSQL for Strapi CMS
  postgres:
    build:
      context: ../
      dockerfile: Docker/infra/postgres.Dockerfile
      args:
        DATABASE_NAME_POSTGRES: strapi_db
        DATABASE_USERNAME_POSTGRES: strapi_user
        DATABASE_PASSWORD_POSTGRES: strapi_password
    restart: unless-stopped
    network_mode: service:devcontainer
    volumes:
      - pg_data:/var/lib/postgresql/data

  # Redis for caching
  redis:
    build:
      context: ../
      dockerfile: Docker/infra/redis.Dockerfile
      args:
        REDIS_PASSWORD: ""
    restart: unless-stopped
    network_mode: service:devcontainer
    volumes:
      - redis_data:/data

  # RabbitMQ for message queue
  rabbitmq:
    build:
      context: ../
      dockerfile: Docker/infra/rabbitmq.Dockerfile
      args:
        RABBITMQ_USER: guest
        RABBITMQ_PASSWORD: guest
    restart: unless-stopped
    network_mode: service:devcontainer
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ================================================
  # BACKEND MICROSERVICES
  # Healthchecks defined in Docker/services/dotnet.Dockerfile
  # Override ASPNETCORE_URLS to use custom ports since all share localhost
  # ================================================

  identity_be:
    build:
      context: ../
      dockerfile: Docker/services/dotnet.Dockerfile
      args:
        MICROSERVICE_NAME: IdentityAPI
        DATABASE_HOST_SQLSERVER: localhost
        DATABASE_PORT_SQLSERVER: "1433"
        DATABASE_USER_SQLSERVER: sa
        DATABASE_PASSWORD_SQLSERVER: YourStrong@Passw0rd
        DATABASE_HOST_MONGODB: localhost
        DATABASE_PORT_MONGODB: "27017"
        DATABASE_USER_MONGODB: admin
        DATABASE_PASSWORD_MONGODB: password
        REDIS_HOST: localhost
        REDIS_PORT: "6379"
        REDIS_PASSWORD: ""
        RABBITMQ_HOST: localhost
        RABBITMQ_PORT: "5672"
        RABBITMQ_USER: guest
        RABBITMQ_PASSWORD: guest
        SECURE_KEY: LocalDevelopmentSecureKey123456789
        JWT_KEY: LocalDevelopmentJWTKey123456789012345678901234567890
        ENVIRONMENT: Development
        IDENTITY_BE_ADDRESS: http://localhost:5001
        MUSIC_BE_ADDRESS: http://localhost:5002
        GEAR_BE_ADDRESS: http://localhost:5003
        DOCUMENTS_BE_ADDRESS: http://localhost:5004
        BRAND_BE_ADDRESS: http://localhost:5005
        PARTY_BE_ADDRESS: http://localhost:5006
        MAILING_BE_ADDRESS: http://localhost:5007
        DATABASE_CATALOG: IdentityDB
        DJPANEL_USER_EMAIL: admin@djbeatblaster.com
        DJPANEL_USER_PASSWORD: Admin123!
    restart: unless-stopped
    network_mode: service:devcontainer
    environment:
      - ASPNETCORE_URLS=http://+:5001
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

