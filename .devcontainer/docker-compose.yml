    build:
      context: ../
      dockerfile: Docker/infra/strapi.Dockerfile
      args:
        CMS_DATABASE_CLIENT: postgres
        CMS_NODE_ENV: development
        CMS_DATABASE_HOST: localhost
        CMS_DATABASE_PORT: "5432"
        DATABASE_NAME_POSTGRES: strapi_db
        DATABASE_USERNAME_POSTGRES: strapi_user
        DATABASE_PASSWORD_POSTGRES: strapi_password
        CMS_JWT_SECRET: local-dev-jwt-secret-123456789
        CMS_ADMIN_JWT_SECRET: local-dev-admin-jwt-secret-123456789
        CMS_APP_KEYS: local-dev-app-key-1,local-dev-app-key-2
        CMS_API_TOKEN_SALT: local-dev-api-token-salt
        CMS_TRANSFER_TOKEN_SALT: local-dev-transfer-token-salt
        CMS_ENCRYPTION_KEY: local-dev-encryption-key-12345
    restart: unless-stopped
    network_mode: service:devcontainer
    volumes:
      - strapi_data:/srv/app
    depends_on:
      postgres:
        condition: service_healthy

  # ================================================
  # LOGGING & MONITORING SERVICES
  # Healthchecks defined in Dockerfiles
  # ================================================

  loki:
    build:
      context: ../
      dockerfile: Docker/infra/loki.Dockerfile
    restart: unless-stopped
    network_mode: service:devcontainer
    volumes:
      - loki_data:/loki

  prometheus:
    build:
      context: ../
      dockerfile: Docker/infra/prometheus.Dockerfile
    restart: unless-stopped
    network_mode: service:devcontainer
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    volumes:
      - prometheus_data:/prometheus

  grafana:
    build:
      context: ../
      dockerfile: Docker/infra/grafana.Dockerfile
      args:
        GRAFANA_ADMIN_USER: admin
        GRAFANA_ADMIN_PASSWORD: admin
        PROJECT_NAME: djpanel-devcontainer
        REPLICA_INDEX: "1"
    restart: unless-stopped
    network_mode: service:devcontainer
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

volumes:
