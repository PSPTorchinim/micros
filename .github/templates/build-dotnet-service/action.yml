name: Build .NET Service
description: Common build steps for .NET microservices
inputs:
  service:
    description: Service name
    required: true
runs:
  using: composite
  steps:
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "10"
        
    - name: Restore Dependencies
      run: dotnet restore "Services/${{ inputs.service }}"

    - name: Build Project
      run: dotnet build "Services/${{ inputs.service }}" -c Debug

    - name: Run Unit Tests (if present)
      run: dotnet test "Tests/${{ inputs.service }}.Tests" --collect:"XPlat Code Coverage"
