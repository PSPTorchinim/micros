name: Cloudflare DNS Sync (CNAMEs)
description: Ensure CNAMEs for env-scoped service FQDNs.
inputs:
  env_slug: { required: true }
  external_map_json: { required: true }
  cf_account_id: { required: true }
  cf_email: { required: true }
  cf_key: { required: true }
  tunnel_uuid: { required: true }
  base_domain: { required: false }
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        ROOT=.github/scripts
        chmod +x "$ROOT"/*.sh
        "$ROOT/cf-sync-dns.sh" \
          "${{ inputs.env_slug }}" \
          "${{ inputs.external_map_json }}" \
          "${{ inputs.cf_account_id }}" \
          "${{ inputs.cf_email }}" \
          "${{ inputs.cf_key }}" \
          "${{ inputs.tunnel_uuid }}" \
          "${{ inputs.base_domain }}"
