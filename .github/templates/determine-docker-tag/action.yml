name: Determine Docker Tag
description: Determine the Docker tag for the service using commit hash (dev-{commit} or prod-{commit}) and latest alias
outputs:
  docker_tag:
    description: The commit-based Docker tag (dev-{commit} or prod-{commit})
    value: ${{ steps.tag_set.outputs.docker_tag }}
  latest_tag:
    description: The latest tag alias for the Docker tag (dev-latest or prod-latest)
    value: ${{ steps.tag_set.outputs.latest_tag }}
  all_tags:
    description: All tags to push (commit-based and latest)
    value: ${{ steps.tag_set.outputs.all_tags }}
runs:
  using: composite
  steps:
    - name: Set docker tag based on branch and commit
      id: tag_set
      shell: bash
      run: |
        # Get short commit hash (7 characters)
        COMMIT_HASH=$(git rev-parse --short=7 HEAD)

        if [[ "${GITHUB_REF}" == *"/production" ]]; then
          echo "docker_tag=prod-${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=prod-latest" >> "$GITHUB_OUTPUT"
          echo "all_tags=prod-${COMMIT_HASH},prod-latest" >> "$GITHUB_OUTPUT"
        else
          echo "docker_tag=dev-${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=dev-latest" >> "$GITHUB_OUTPUT"
          echo "all_tags=dev-${COMMIT_HASH},dev-latest" >> "$GITHUB_OUTPUT"
        fi
