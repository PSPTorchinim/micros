name: GHCR Push Docker Image
description: Pushes a Docker image to GitHub Container Registry (GHCR) with optional multiple tags
inputs:
  tag:
    description: Docker image tag (single tag or comma-separated list)
    required: true
  dockerfile:
    description: Path to the Dockerfile
    required: true
  build-args:
    description: Docker build arguments
    required: false
  github-token:
    description: GitHub token for registry login
    required: true
  push:
    description: Whether to push the built image
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Convert tag to lowercase
      id: tag_lowercase
      run: |
        echo "tag=$(echo '${{ inputs.tag }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build & Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        build-args: ${{ inputs.build-args }}
        tags: ${{ steps.tag_lowercase.outputs.tag }}
        push: ${{ inputs.push }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
