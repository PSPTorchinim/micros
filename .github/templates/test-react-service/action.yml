name: Test React Service
description: Common test steps for React microfrontend
inputs:
  service:
    description: Working directory for the service
    required: true
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20.x"

    - name: Install NPM Dependencies
      working-directory: Frontends/${{ inputs.service }}
      shell: bash
      run: npm install --retry 5 --fetch-retries 5 --fetch-retry-mintimeout 20000

    - name: Run Jest Unit Tests
      working-directory: Frontends/${{ inputs.service }}
      shell: bash
      run: npm run test

    - name: Install Playwright Browsers
      working-directory: Frontends/${{ inputs.service }}
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Run Playwright E2E Tests
      working-directory: Frontends/${{ inputs.service }}
      shell: bash
      run: npm run test:e2e

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ inputs.service }}
        path: |
          Frontends/${{ inputs.service }}/playwright-report/
          Frontends/${{ inputs.service }}/test-results/
        retention-days: 30
