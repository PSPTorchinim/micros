name: Auto-Approve Deployment Protection Rules

# This workflow automatically approves pending deployment protection rules
# for pipeline runs that are waiting for environment approval gates.
#
# When GitHub environments (e.g. Development, Production) are configured with
# required reviewers, any workflow job that references those environments will
# pause until a reviewer manually approves the deployment.  This workflow
# listens for the "deployment_protection_rule" event and immediately approves
# the pending run so that CI/CD pipelines are not blocked by manual gates.
#
# Triggers:
#   - deployment_protection_rule: requested  (fired whenever a run is waiting)

on:
  deployment_protection_rule:

permissions:
  actions: write  # required to approve deployment protection rules

jobs:
  auto_approve:
    name: Auto-Approve Pipeline Run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve pending deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const callbackUrl = context.payload.deployment_callback_url;
            const environment = context.payload.environment;

            // Validate required payload fields are present
            if (!callbackUrl) {
              core.setFailed('deployment_callback_url is missing from the event payload.');
              return;
            }
            if (!environment) {
              core.setFailed('environment is missing from the event payload.');
              return;
            }

            // Validate the callback URL belongs to the GitHub API domain to prevent SSRF,
            // and extract the run_id so we can use the explicit Octokit endpoint format.
            const urlPattern = /^https:\/\/api\.github\.com\/repos\/[^/]+\/[^/]+\/actions\/runs\/(\d+)\/deployment_protection_rule$/;
            const match = callbackUrl.match(urlPattern);
            if (!match) {
              core.setFailed(`Unexpected callback URL format: ${callbackUrl}`);
              return;
            }
            const runId = parseInt(match[1], 10);

            core.info(`Approving deployment to environment: ${environment} (run ${runId})`);

            try {
              await github.request(
                'POST /repos/{owner}/{repo}/actions/runs/{run_id}/deployment_protection_rule',
                {
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  run_id: runId,
                  environment_name: environment,
                  state: 'approved',
                  comment: 'Auto-approved by pipeline automation',
                }
              );
              core.info(`✅ Deployment to "${environment}" approved automatically.`);
            } catch (err) {
              core.setFailed(`Failed to approve deployment to "${environment}": ${err.message}`);
            }
