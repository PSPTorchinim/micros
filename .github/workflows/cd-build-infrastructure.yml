name: Build TrueNAS Infrastructure

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Artifacts"]
    types: [completed]
    branches:
      - "releases/R*"
      - "production"

jobs:
  # ---------------------
  # Context (env/tag/slug)
  # ---------------------
  determine_environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      current_env: ${{ steps.set_env.outputs.current_env }}
      env_slug: ${{ steps.slug.outputs.env_slug }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - id: set_env
        uses: ./.github/templates/determine-environment
      - id: slug
        shell: bash
        run: |
          set -euo pipefail
          env_raw='${{ steps.set_env.outputs.current_env }}'
          env_slug=$(printf '%s' "$env_raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          echo "env_slug=$env_slug" >> "$GITHUB_OUTPUT"

  determine_docker_tag:
    name: Determine Docker Tag
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag_set.outputs.docker_tag }}
      latest_tag: ${{ steps.tag_set.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag_set
        uses: ./.github/templates/determine-docker-tag

  determine_compose_timestamp:
    name: Determine Compose Timestamp
    runs-on: ubuntu-latest
    needs: [determine_environment]
    outputs:
      compose_timestamp: ${{ steps.timestamp_set.outputs.compose_timestamp }}
      compose_file_name: ${{ steps.timestamp_set.outputs.compose_file_name }}
    steps:
      - uses: actions/checkout@v5
      - id: timestamp_set
        uses: ./.github/templates/determine-compose-timestamp
        with:
          env_slug: ${{ needs.determine_environment.outputs.env_slug }}

  # ----------------------------------
  # One-time dirs + backup (idempotent)
  # ----------------------------------
  setup_truenas_directories:
    name: Setup TrueNAS Directories
    runs-on: ubuntu-latest
    needs: [determine_environment]
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -euo pipefail
            ENV='${{ needs.determine_environment.outputs.current_env }}'
            BASE_DIR="/mnt/Files/Apps/DJPanel/${ENV}"
            mkdir -p "${BASE_DIR}/Images/backups"
            chmod 755 "${BASE_DIR}/Images" "${BASE_DIR}/Images/backups" 2>/dev/null || true

  backup_current_state:
    name: Backup Current State
    runs-on: ubuntu-latest
    needs: [determine_environment, setup_truenas_directories]
    outputs:
      backup_created: ${{ steps.backup.outputs.backup_created }}
    steps:
      - id: backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            set -euo pipefail
            base="/mnt/Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}/Images"
            agg="${base}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}.yml"
            backup_dir="${base}/backups"; mkdir -p "$backup_dir"
            ts=$(date +%Y%m%d_%H%M%S)
            if [ -f "$agg" ]; then
              cp "$agg" "$backup_dir/dj-panel-${{ needs.determine_environment.outputs.env_slug }}-backup-${ts}.yml"
              ls -1t "$backup_dir"/dj-panel-${{ needs.determine_environment.outputs.env_slug }}-backup-*.yml 2>/dev/null | tail -n +6 | xargs -r rm -f || true
              echo "BACKUP_CREATED=true"
            else
              echo "BACKUP_CREATED=false"
            fi

  # -------------
  # Host ports DRY
  # -------------
  get_truenas_ports:
    name: Get TrueNAS Ports
    runs-on: ubuntu-latest
    needs: [backup_current_state]
    outputs:
      ports: ${{ steps.net.outputs.stdout }}
    steps:
      - id: net
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            netstat -tuln 2>/dev/null | awk 'NR>2 {print $4}' | sed -E 's/.*:([0-9]+)$/\1/' | grep -E '^[0-9]+$' | sort -n | uniq

  calculate_unused_ports:
    name: Calculate Unused Ports
    runs-on: ubuntu-latest
    needs: [get_truenas_ports]
    outputs:
      external_ports: ${{ steps.external.outputs.unused_ports }}
      internal_ports: ${{ steps.internal.outputs.unused_ports }}
    steps:
      - uses: actions/checkout@v5
      - id: internal
        uses: ./.github/templates/calculate-unused-ports
        with:
          start_port: 40000
          end_port: 50000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ""
      - id: external
        uses: ./.github/templates/calculate-unused-ports
        with:
          start_port: 50000
          end_port: 60000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ""

  # --------------------------------------------
  # Compose generation + upload (unchanged flow)
  # --------------------------------------------
  generate_and_upload_truenas_compose_file:
    name: Generate and Upload TrueNAS Compose File
    runs-on: ubuntu-latest
    needs:
      - determine_environment
      - determine_docker_tag
      - determine_compose_timestamp
      - calculate_unused_ports
      - backup_current_state
    outputs:
      new_compose_abs: ${{ steps.parse.outputs.new_compose_abs }}
      external_map_json: ${{ steps.gen.outputs.external_ports_map }}
    steps:
      - uses: actions/checkout@v5
      - name: Install yq
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - id: gen
        name: Generate compose
        shell: bash
        env:
          LOG_LEVEL: DEBUG
        run: |
          set -euo pipefail
          chmod +x .github/scripts/generate-compose-file.sh
          output='${{ needs.determine_compose_timestamp.outputs.compose_file_name }}'
          map_json=$(.github/scripts/generate-compose-file.sh \
            '${{ needs.calculate_unused_ports.outputs.internal_ports }}' \
            '${{ needs.calculate_unused_ports.outputs.external_ports }}' \
            '${{ needs.determine_docker_tag.outputs.docker_tag }}' \
            '${{ github.repository_owner }}' \
            '${{ github.event.repository.name }}' \
            'Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}' \
            "$output")
          echo "compose_file=$output" >> "$GITHUB_OUTPUT"
          echo "external_ports_map=$map_json" >> "$GITHUB_OUTPUT"
      - id: pkg
        name: Base64 package
        run: |
          set -euo pipefail
          test -f '${{ steps.gen.outputs.compose_file }}'
          echo "compose_name=${{ steps.gen.outputs.compose_file }}" >> "$GITHUB_OUTPUT"
          echo "compose_b64=$(base64 -w0 '${{ steps.gen.outputs.compose_file }}')" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            set -euo pipefail
            POOL=Files
            ENV_DIR='${{ needs.determine_environment.outputs.current_env }}'
            NAME='${{ steps.pkg.outputs.compose_name }}'
            B64='${{ steps.pkg.outputs.compose_b64 }}'
            DST_DIR="/mnt/$POOL/Apps/DJPanel/${ENV_DIR}/Images"; mkdir -p "$DST_DIR"
            DST_NAME="${NAME##*/}"; DST_PATH="$DST_DIR/$DST_NAME"
            printf '%s' "$B64" | base64 -d > "$DST_PATH"
            chmod 664 "$DST_PATH" || true
            echo "COMPOSE_ABS=$DST_PATH"
      - id: parse
        run: |
          echo "new_compose_abs=$(echo '${{ steps.upload.outputs.stdout }}' | awk -F= '/^COMPOSE_ABS=/{print $2}' | tail -n1)" >> "$GITHUB_OUTPUT"

  # -------------------------
  # Cloudflare maintenance ON
  # -------------------------
  enable_maintenance_page:
    name: Enable Cloudflare Maintenance Page
    runs-on: ubuntu-latest
    needs: [generate_and_upload_truenas_compose_file, determine_environment]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/templates/cloudflare-maintenance
        with:
          mode: enable
          maintenance_html_path: .github/workflows/maintenance.html
          external_map_json: ${{ needs.generate_and_upload_truenas_compose_file.outputs.external_map_json }}
          env_slug: ${{ needs.determine_environment.outputs.env_slug }}
          cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf_email: ${{ secrets.CLOUDFLARE_EMAIL }}
          cf_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  # -----------------------------
  # TrueNAS rolling update (DRY)
  # -----------------------------
  rolling_update_deployment:
    name: Rolling Update Deployment
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        generate_and_upload_truenas_compose_file,
        backup_current_state,
        enable_maintenance_page,
      ]
    outputs:
      start_stdout: ${{ steps.run.outputs.stdout }}
    steps:
      - uses: actions/checkout@v5
      - name: Execute rolling update
        id: run
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            set -euo pipefail
            truenas_rolling_update() {
              local ENV="$1" SLUG="$2" NEW="$3"
              local base="/mnt/Files/Apps/DJPanel/${ENV}/Images"
              local agg="${base}/dj-panel-${SLUG}.yml"
              local app="dj-panel-${SLUG}"

              [ -f "$NEW" ] || { echo "ERROR: compose not found: $NEW"; return 1; }
              mkdir -p "$base"
              printf 'include:\n  - %s\n' "$NEW" > "$agg"
              ls -1 "${base}/dj-panel-${SLUG}-"*.yml 2>/dev/null | sort -r | awk 'NR>3' | xargs -r rm -f || true

              get_state() {
                j="$(midclt call app.query '[\[\"name\",\"=\",\"'"$app"'\"\]]' 2>/dev/null || echo '[]')"
                if command -v jq >/dev/null; then echo "$j" | jq -r '.[0] | (.state // .status // empty)' | head -n1; else echo "$j" | tr -d '\n' | awk '{s=$0;if (match(s, /"state" *: *"[^\"]*"/)){m=substr(s,RSTART,RLENGTH);gsub(/.*"state" *: *"/,"",m);gsub(/".*$/, "", m);print m}}' | head -n1; fi
              }

              current_state="$(get_state || echo NOT_FOUND)"; echo "Current: $current_state"
              if [ "$current_state" = NOT_FOUND ] || [ "$current_state" = STOPPED ]; then
                midclt call app.start "$app" 2>/dev/null || midclt call chart.release.scale "$app" '{"replica_count":1}' 2>/dev/null || { echo "ERROR: start failed"; return 1; }
              else
                midclt call app.restart "$app" 2>/dev/null || {
                  midclt call app.stop "$app" 2>/dev/null || true
                  for i in $(seq 1 90); do st="$(get_state || echo UNKNOWN)"; echo "stop check $i: $st"; [ "$st" = STOPPED ] || [ "$st" = NOT_FOUND ] && break; sleep 2; done
                  midclt call app.start "$app" 2>/dev/null || { echo "ERROR: could not restart"; return 1; }
                }
              fi

              is_good() { case "$1" in RUNNING|ACTIVE|DEPLOYED|STARTED|HEALTHY) return 0;; *) return 1;; esac }
              for i in $(seq 1 120); do st="$(get_state || echo UNKNOWN)"; echo "health $i: $st"; is_good "$st" && { echo "APP_STATE=$st"; return 0; }; sleep 5; done
              echo "APP_STATE=$st"; return 1
            }
            truenas_rolling_update \
              '${{ needs.determine_environment.outputs.current_env }}' \
              '${{ needs.determine_environment.outputs.env_slug }}' \
              '${{ needs.generate_and_upload_truenas_compose_file.outputs.new_compose_abs }}'

  verify_app_started:
    name: Verify App Started
    runs-on: ubuntu-latest
    needs: [rolling_update_deployment]
    steps:
      - name: Verify
        run: |
          set -euo pipefail
          out='${{ needs.rolling_update_deployment.outputs.start_stdout }}'
          st=$(echo "$out" | awk -F= '/^APP_STATE=/{print $2}' | tail -n1)
          case "$st" in
            RUNNING|ACTIVE|DEPLOYED|STARTED|HEALTHY) echo "OK: $st";;
            *) echo "Bad state: $st"; exit 1;;
          esac

  # --------------------------
  # Cloudflare maintenance OFF
  # --------------------------
  disable_maintenance_page:
    name: Disable Cloudflare Maintenance Page
    if: always()
    runs-on: ubuntu-latest
    needs: [determine_environment, verify_app_started, enable_maintenance_page]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/templates/cloudflare-maintenance
        with:
          mode: disable
          env_slug: ${{ needs.determine_environment.outputs.env_slug }}
          cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf_email: ${{ secrets.CLOUDFLARE_EMAIL }}
          cf_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

  update_cloudflare_tunnel:
    name: Update Cloudflare Tunnel
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        generate_and_upload_truenas_compose_file,
        verify_app_started,
        disable_maintenance_page,
      ]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/templates/cloudflare-tunnel-update
        with:
          env_slug: ${{ needs.determine_environment.outputs.env_slug }}
          external_map_json: ${{ needs.generate_and_upload_truenas_compose_file.outputs.external_map_json }}
          cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf_email: ${{ secrets.CLOUDFLARE_EMAIL }}
          cf_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          tunnel_uuid: ${{ secrets.CLOUDFLARE_TUNNEL_UUID }}
          base_domain: ${{ vars.BASE_DOMAIN }}
          truenas_lan_ip: ${{ vars.TRUENAS_LAN_IP }}

  update_cloudflare_dns_records:
    name: Update Cloudflare DNS Records
    runs-on: ubuntu-latest
    needs:
      [
        update_cloudflare_tunnel,
        determine_environment,
        generate_and_upload_truenas_compose_file,
      ]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/templates/cloudflare-dns-sync
        with:
          env_slug: ${{ needs.determine_environment.outputs.env_slug }}
          external_map_json: ${{ needs.generate_and_upload_truenas_compose_file.outputs.external_map_json }}
          cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cf_email: ${{ secrets.CLOUDFLARE_EMAIL }}
          cf_key: ${{ secrets.CLOUDFLARE_API_KEY }}
          tunnel_uuid: ${{ secrets.CLOUDFLARE_TUNNEL_UUID }}
          base_domain: ${{ vars.BASE_DOMAIN }}

  deployment_summary:
    name: Deployment Summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - determine_docker_tag
      - determine_compose_timestamp
      - determine_environment
      - rolling_update_deployment
      - verify_app_started
      - update_cloudflare_tunnel
      - update_cloudflare_dns_records
    steps:
      - run: |
          echo "==========================================";
          echo "🎉 Zero-Downtime Deployment Complete!";
          echo "==========================================";
          echo "Tag: ${{ needs.determine_docker_tag.outputs.docker_tag }} (latest: ${{ needs.determine_docker_tag.outputs.latest_tag }})";
          echo "Env: ${{ needs.determine_environment.outputs.current_env }} (slug: ${{ needs.determine_environment.outputs.env_slug }})";
          echo "Compose: ${{ needs.determine_compose_timestamp.outputs.compose_file_name }}";
