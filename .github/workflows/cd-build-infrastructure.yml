name: Build TrueNAS Infrastructure

on:
  workflow_dispatch:

jobs:
  determine_environment:
    runs-on: ubuntu-latest
    name: Determine Environment
    outputs:
      current_env: ${{ steps.set_env.outputs.current_env }}
      env_slug: ${{ steps.slug.outputs.env_slug }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set Environment
        id: set_env
        uses: ./.github/templates/determine-environment

      - name: Compute env slug
        id: slug
        run: |
          set -euo pipefail
          env_raw='${{ steps.set_env.outputs.current_env }}'
          env_slug=$(printf '%s' "$env_raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          echo "env_slug=$env_slug" >> "$GITHUB_OUTPUT"

  determine_docker_tag:
    name: Determine Docker Tag
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag_set.outputs.docker_tag }}
      latest_tag: ${{ steps.tag_set.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: tag_set
        uses: ./.github/templates/determine-docker-tag

  determine_compose_timestamp:
    name: Determine Compose File Timestamp
    needs: [determine_environment]
    runs-on: ubuntu-latest
    outputs:
      compose_timestamp: ${{ steps.timestamp_set.outputs.compose_timestamp }}
      compose_file_name: ${{ steps.timestamp_set.outputs.compose_file_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: timestamp_set
        uses: ./.github/templates/determine-compose-timestamp
        with:
          env_slug: ${{ needs.determine_environment.outputs.env_slug }}

  check_current_deployment:
    name: Check current deployment state (Blue/Green)
    runs-on: ubuntu-latest
    needs: [determine_environment]
    outputs:
      active_slot: ${{ steps.determine_slot.outputs.active_slot }}
      target_slot: ${{ steps.determine_slot.outputs.target_slot }}
      blue_state: ${{ steps.parse_state.outputs.blue_state }}
      green_state: ${{ steps.parse_state.outputs.green_state }}
    steps:
      - name: Check blue and green app states on TrueNAS
        id: check_state
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            APP_BLUE="dj-panel-${{ needs.determine_environment.outputs.env_slug }}-blue"
            APP_GREEN="dj-panel-${{ needs.determine_environment.outputs.env_slug }}-green"
            
            has_jq() { command -v jq >/dev/null 2>&1; }
            get_state() {
              local app="$1"
              j="$(midclt call app.query '[["name","=","'"$app"'"]]' 2>/dev/null || echo '[]')"
              if has_jq; then
                state=$(echo "$j" | jq -r '.[0] | (.state // .status // empty)' 2>/dev/null | head -n1)
              else
                state=$(echo "$j" | tr -d '\n' | awk '{
                  s=$0
                  if (match(s, /"state"[[:space:]]*:[[:space:]]*"[^"]*"/)) {
                    m=substr(s, RSTART, RLENGTH)
                    gsub(/.*"state"[[:space:]]*:[[:space:]]*"/, "", m)
                    gsub(/".*$/, "", m)
                    print m
                  }
                }' | head -n1)
              fi
              if [ -z "$state" ]; then
                echo "NOT_FOUND"
              else
                echo "$state"
              fi
            }
            
            blue_state="$(get_state "$APP_BLUE")"
            green_state="$(get_state "$APP_GREEN")"
            
            echo "Blue app state: $blue_state"
            echo "Green app state: $green_state"
            echo "BLUE_STATE=${blue_state}"
            echo "GREEN_STATE=${green_state}"
      
      - name: Parse deployment states
        id: parse_state
        run: |
          set -euo pipefail
          out='${{ steps.check_state.outputs.stdout }}'
          blue_state=$(echo "$out" | awk -F= '/^BLUE_STATE=/{print $2}' | tail -n1)
          green_state=$(echo "$out" | awk -F= '/^GREEN_STATE=/{print $2}' | tail -n1)
          
          echo "blue_state=${blue_state}" >> "$GITHUB_OUTPUT"
          echo "green_state=${green_state}" >> "$GITHUB_OUTPUT"
      
      - name: Determine active and target slots
        id: determine_slot
        run: |
          set -euo pipefail
          blue_state="${{ steps.parse_state.outputs.blue_state }}"
          green_state="${{ steps.parse_state.outputs.green_state }}"
          
          # Determine which slot is active
          blue_active=false
          green_active=false
          
          case "$blue_state" in
            RUNNING|ACTIVE|DEPLOYED|STARTED|HEALTHY) blue_active=true ;;
          esac
          
          case "$green_state" in
            RUNNING|ACTIVE|DEPLOYED|STARTED|HEALTHY) green_active=true ;;
          esac
          
          # Determine target slot for new deployment (opposite of active)
          if [ "$blue_active" = "true" ] && [ "$green_active" != "true" ]; then
            active_slot="blue"
            target_slot="green"
            echo "✅ Blue is active, deploying to GREEN (zero downtime)"
          elif [ "$green_active" = "true" ] && [ "$blue_active" != "true" ]; then
            active_slot="green"
            target_slot="blue"
            echo "✅ Green is active, deploying to BLUE (zero downtime)"
          elif [ "$blue_active" = "true" ] && [ "$green_active" = "true" ]; then
            # Both active - prefer deploying to green
            active_slot="blue"
            target_slot="green"
            echo "⚠️  Both slots active, deploying to GREEN"
          else
            # Neither active - first deployment
            active_slot="none"
            target_slot="blue"
            echo "🆕 First deployment, deploying to BLUE"
          fi
          
          echo "active_slot=${active_slot}" >> "$GITHUB_OUTPUT"
          echo "target_slot=${target_slot}" >> "$GITHUB_OUTPUT"

  get_truenas_ports:
    name: Get TrueNAS Ports
    runs-on: ubuntu-latest
    needs: [check_current_deployment]
    outputs:
      ports: ${{ steps.get_netstat_ports.outputs.stdout }}
    steps:
      - name: Get Netstat Listening Ports (TrueNAS host)
        id: get_netstat_ports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            netstat -tuln 2>/dev/null \
              | awk 'NR>2 {print $4}' \
              | sed -E 's/.*:([0-9]+)$/\1/' \
              | grep -E '^[0-9]+$' \
              | sort -n | uniq

  calculate_unused_ports:
    name: Calculate Unused External and Internal Ports
    runs-on: ubuntu-latest
    needs: [get_truenas_ports]
    outputs:
      external_ports: ${{ steps.calculate_external_ports.outputs.unused_ports }}
      internal_ports: ${{ steps.calculate_internal_ports.outputs.unused_ports }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Calculate unused internal ports (40000-49999)
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_internal_ports
        with:
          start_port: 40000
          end_port: 50000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ""

      - name: Calculate unused external ports (50000-59999)
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_external_ports
        with:
          start_port: 50000
          end_port: 60000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ""

  generate_and_upload_truenas_compose_file:
    name: Generate & Upload New Compose for Target Slot
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        determine_docker_tag,
        determine_compose_timestamp,
        calculate_unused_ports,
        check_current_deployment,
      ]
    outputs:
      new_compose_abs: ${{ steps.parse_upload.outputs.new_compose_abs }}
      external_map_json: ${{ steps.generate_compose_file.outputs.external_ports_map }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install yq on runner
        run: |
          set -euo pipefail
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Generate compose from template and free ports
        id: generate_compose_file
        shell: bash
        env:
          LOG_LEVEL: DEBUG
        run: |
          set -euo pipefail
          chmod +x .github/scripts/generate-compose-file.sh
          output_file="${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          external_map_json=$(.github/scripts/generate-compose-file.sh \
            "${{ needs.calculate_unused_ports.outputs.internal_ports }}" \
            "${{ needs.calculate_unused_ports.outputs.external_ports }}" \
            "${{ needs.determine_docker_tag.outputs.docker_tag }}" \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}" \
            "$output_file")
          {
            echo "compose_file=$output_file"
            echo "external_ports_map=$external_map_json"
          } >> "$GITHUB_OUTPUT"

      - name: Package compose for transfer (base64)
        id: package_compose
        run: |
          set -euo pipefail
          COMPOSE_FILE="${{ steps.generate_compose_file.outputs.compose_file }}"
          test -f "$COMPOSE_FILE" || { echo "Compose not found: $COMPOSE_FILE" >&2; exit 1; }
          B64=$(base64 -w0 "$COMPOSE_FILE")
          {
            echo "compose_name=$COMPOSE_FILE"
            echo "compose_b64=$B64"
          } >> "$GITHUB_OUTPUT"

      - name: Upload compose into TrueNAS dataset
        id: upload_compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: TRUENAS_POOL,CURRENT_ENV,COMPOSE_NAME,COMPOSE_B64
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            POOL="Files"
            ENV_DIR='${{ needs.determine_environment.outputs.current_env }}'
            COMPOSE_NAME='${{ steps.package_compose.outputs.compose_name }}'
            COMPOSE_B64='${{ steps.package_compose.outputs.compose_b64 }}'
            TARGET_REL="Apps/DJPanel/${ENV_DIR}/Images"
            DST_DIR="/mnt/$POOL/$TARGET_REL"
            mkdir -p "$DST_DIR"
            DST_NAME="${COMPOSE_NAME##*/}"
            DST_PATH="$DST_DIR/$DST_NAME"
            printf '%s' "$COMPOSE_B64" | base64 -d > "$DST_PATH"
            chmod 664 "$DST_PATH" || true
            echo "COMPOSE_ABS=$DST_PATH"

      - name: Parse upload path and expose as output
        id: parse_upload
        run: |
          set -euo pipefail
          out='${{ steps.upload_compose.outputs.stdout }}'
          abs=$(echo "$out" | awk -F= '/^COMPOSE_ABS=/{print $2}' | tail -n1)
          test -n "$abs" || { echo "No COMPOSE_ABS marker in SSH output"; exit 1; }
          echo "new_compose_abs=$abs" >> "$GITHUB_OUTPUT"

  deploy_to_target_slot:
    name: Deploy to target slot (Blue/Green - Zero Downtime)
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        check_current_deployment,
        generate_and_upload_truenas_compose_file,
      ]
    outputs:
      deployment_stdout: ${{ steps.deploy_slot.outputs.stdout }}
      deployed_slot: ${{ needs.check_current_deployment.outputs.target_slot }}
    steps:
      - name: Deploy to target slot and wait for healthy state
        id: deploy_slot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            target_slot="${{ needs.check_current_deployment.outputs.target_slot }}"
            active_slot="${{ needs.check_current_deployment.outputs.active_slot }}"
            base="/mnt/Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}/Images"
            new="${{ needs.generate_and_upload_truenas_compose_file.outputs.new_compose_abs }}"
            app="dj-panel-${{ needs.determine_environment.outputs.env_slug }}-${target_slot}"
            agg="${base}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}-${target_slot}.yml"

            echo "=========================================="
            echo "🔵🟢 Blue-Green Deployment (Zero Downtime)"
            echo "=========================================="
            echo "Active slot: ${active_slot}"
            echo "Target slot: ${target_slot}"
            echo "Deploying to: $app"
            echo "=========================================="

            test -n "$new" && test -f "$new" || { echo "ERROR: new compose $new not found"; exit 1; }
            mkdir -p "$base"
            printf 'include:\n  - %s\n' "$new" > "$agg"
            echo "✅ Updated aggregator -> $agg"

            # Keep only 3 newest generated compose files for this env per slot
            ls -1 "${base}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}-"*.yml 2>/dev/null \
              | grep -v -- "-blue.yml$" | grep -v -- "-green.yml$" \
              | sort -r | awk 'NR>3' | xargs -r rm -f || true

            echo "🚀 Starting app: $app"
            if midclt call app.start "$app" 2>/dev/null; then
              echo "✅ Started via app.start"
            else
              echo "ℹ️  app.start not available; trying chart.release.scale -> 1"
              if midclt call chart.release.scale "$app" '{"replica_count":1}' 2>/dev/null; then
                echo "✅ Scaled to 1 replica"
              else
                echo "❌ ERROR: could not start app '$app'"
                exit 1
              fi
            fi

            has_jq() { command -v jq >/dev/null 2>&1; }
            get_state() {
              j="$(midclt call app.query '[["name","=","'"$app"'"]]' 2>/dev/null || echo '[]')"
              if has_jq; then
                echo "$j" | jq -r '.[0] | (.state // .status // .health // .metadata.state // empty)' 2>/dev/null | head -n1
                return 0
              fi
              echo "$j" \
                | tr -d '\n' \
                | awk '{
                    s=$0
                    if (match(s, /"state"[[:space:]]*:[[:space:]]*"[^"]*"/)) {
                      m=substr(s, RSTART, RLENGTH)
                      gsub(/.*"state"[[:space:]]*:[[:space:]]*"/, "", m)
                      gsub(/".*$/, "", m)
                      print m
                    }
                  }' | head -n1
            }
            is_good_state() {
              case "$1" in
                RUNNING|ACTIVE|DEPLOYED|STARTED|HEALTHY) return 0 ;;
                *) return 1 ;;
              esac
            }

            echo "⏳ Waiting for ${target_slot} slot to become healthy..."
            i=0
            st=""
            while [ $i -lt 120 ]; do
              st="$(get_state || true)"
              [ -n "$st" ] || st="unknown"
              echo "  Poll #$((i+1))/120: state=$st"
              if is_good_state "$st"; then
                echo "✅ ${target_slot} slot is HEALTHY"
                break
              fi
              sleep 5
              i=$((i+1))
            done

            if ! is_good_state "$st"; then
              echo "❌ ERROR: ${target_slot} slot failed to reach healthy state (state=$st)"
              echo "⚠️  ${active_slot} slot continues serving traffic - NO DOWNTIME"
              exit 1
            fi

            echo "DEPLOYMENT_STATE=${st}"
            echo "DEPLOYED_SLOT=${target_slot}"
            echo "ACTIVE_SLOT=${active_slot}"

  verify_new_deployment:
    name: Verify new deployment is healthy
    runs-on: ubuntu-latest
    needs: [deploy_to_target_slot, check_current_deployment]
    steps:
      - name: Parse and verify deployment result
        run: |
          set -euo pipefail
          out='${{ needs.deploy_to_target_slot.outputs.deployment_stdout }}'
          echo "=========================================="
          echo "📊 Deployment Verification"
          echo "=========================================="
          printf '%s\n' "$out"
          echo "=========================================="
          st=$(echo "$out" | awk -F= '/^DEPLOYMENT_STATE=/{print $2}' | tail -n1)
          deployed_slot=$(echo "$out" | awk -F= '/^DEPLOYED_SLOT=/{print $2}' | tail -n1)
          active_slot=$(echo "$out" | awk -F= '/^ACTIVE_SLOT=/{print $2}' | tail -n1)
          
          case "$st" in
            RUNNING|ACTIVE|DEPLOYED|STARTED|HEALTHY)
              echo "✅ New deployment in ${deployed_slot} slot is HEALTHY"
              echo "✅ Old ${active_slot} slot still serving traffic - ZERO DOWNTIME maintained"
              echo ""
              echo "Ready for manual approval to switch traffic!"
              ;;
            *)
              echo "❌ New deployment in ${deployed_slot} slot failed (state=$st)"
              echo "✅ Old ${active_slot} slot continues serving traffic - NO DOWNTIME"
              exit 1
              ;;
          esac

  manual_approval_gate:
    name: Manual approval to switch traffic
    runs-on: ubuntu-latest
    needs: [verify_new_deployment, deploy_to_target_slot, check_current_deployment]
    environment:
      name: production-approval
    steps:
      - name: Wait for manual approval
        run: |
          echo "⚠️  MANUAL APPROVAL REQUIRED ⚠️"
          echo "=========================================="
          echo "New deployment verified in ${{ needs.deploy_to_target_slot.outputs.deployed_slot }} slot"
          echo "Current traffic still on ${{ needs.check_current_deployment.outputs.active_slot }} slot"
          echo ""
          echo "✅ New version is healthy and ready"
          echo "✅ Zero downtime maintained so far"
          echo ""
          echo "👉 Approve this step to switch traffic to new version"
          echo "❌ Reject to keep old version active"
          echo "=========================================="

  switch_traffic_to_new_deployment:
    name: Switch production traffic to new deployment
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        check_current_deployment,
        deploy_to_target_slot,
        manual_approval_gate,
      ]
    outputs:
      old_slot: ${{ needs.check_current_deployment.outputs.active_slot }}
      new_slot: ${{ needs.deploy_to_target_slot.outputs.deployed_slot }}
    steps:
      - name: Switch traffic to new deployment slot
        id: switch_traffic
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            new_slot="${{ needs.deploy_to_target_slot.outputs.deployed_slot }}"
            old_slot="${{ needs.check_current_deployment.outputs.active_slot }}"
            
            echo "=========================================="
            echo "🔄 Traffic Switch"
            echo "=========================================="
            echo "Switching from: ${old_slot} → ${new_slot}"
            
            base="/mnt/Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}/Images"
            primary_agg="${base}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}.yml"
            new_slot_agg="${base}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}-${new_slot}.yml"
            
            if [ -f "$new_slot_agg" ]; then
              cp "$new_slot_agg" "$primary_agg"
              echo "✅ Traffic switched to ${new_slot} slot"
              echo "✅ Primary aggregator now points to ${new_slot}"
            else
              echo "❌ ERROR: New slot aggregator not found: $new_slot_agg"
              exit 1
            fi
            
            echo "OLD_SLOT=${old_slot}"
            echo "NEW_SLOT=${new_slot}"
            echo "=========================================="
      
      - name: Verify traffic switch
        run: |
          out='${{ steps.switch_traffic.outputs.stdout }}'
          echo "$out"
          echo ""
          echo "✅ Traffic successfully switched!"
          echo "✅ Zero-downtime deployment complete!"

  stop_old_deployment:
    name: Stop old deployment slot
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        check_current_deployment,
        switch_traffic_to_new_deployment,
      ]
    steps:
      - name: Stop the old deployment slot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            old_slot="${{ needs.check_current_deployment.outputs.active_slot }}"
            
            # Skip if this is first deployment (no active slot)
            if [ "$old_slot" = "none" ]; then
              echo "ℹ️  First deployment - no old slot to stop"
              exit 0
            fi
            
            app="dj-panel-${{ needs.determine_environment.outputs.env_slug }}-${old_slot}"
            
            echo "=========================================="
            echo "🛑 Stopping Old Deployment"
            echo "=========================================="
            echo "Stopping: $app (${old_slot} slot)"
            
            if midclt call app.stop "$app" 2>/dev/null; then
              echo "✅ Stopped via app.stop"
            else
              echo "ℹ️  app.stop not available; trying chart.release.scale -> 0"
              if midclt call chart.release.scale "$app" '{"replica_count":0}' 2>/dev/null; then
                echo "✅ Scaled to 0 replicas"
              else
                echo "⚠️  Could not stop old app '$app' - it will remain running"
                echo "   (This is OK - can be used for quick rollback if needed)"
              fi
            fi
            
            echo "✅ Old deployment stopped"
            echo "   Available for quick rollback if needed"
            echo "=========================================="

  update_cloudflare_tunnel:
    name: Update Cloudflare Tunnel (service-based hostnames)
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        generate_and_upload_truenas_compose_file,
        switch_traffic_to_new_deployment,
      ]
    steps:
      - name: Build ingress JSON and PUT to Cloudflare (auto-calc BASE_DOMAIN; preserve other envs)
        id: cf_update
        run: |
          set -euo pipefail

          # --- Inputs / Secrets ---
          TUNNEL_UUID="${{ secrets.CLOUDFLARE_TUNNEL_UUID }}"
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CF_EMAIL="${{ secrets.CLOUDFLARE_EMAIL }}"
          CF_KEY="${{ secrets.CLOUDFLARE_API_KEY }}"
          ENV_SLUG='${{ needs.determine_environment.outputs.env_slug }}'

          HOST_LAN_IP="${{ vars.TRUENAS_LAN_IP }}"
          HOST_LAN_IP="${HOST_LAN_IP:-192.168.1.17}"

          BASE_DOMAIN="${{ vars.BASE_DOMAIN }}"
          BASE_DOMAIN="${BASE_DOMAIN:-}"

          # Derive BASE_DOMAIN if empty
          if [ -z "$BASE_DOMAIN" ]; then
            echo "BASE_DOMAIN not provided; deriving…"
            cfg="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_UUID}/configurations" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}")"
            BASE_DOMAIN="$(echo "$cfg" | jq -r '.result.config.ingress[]?.hostname // empty' \
              | awk -F. 'NF>=2 {print $(NF-1)"."$NF}' \
              | sort | uniq -c | sort -nr | awk 'NR==1{print $2}')"
            if [ -z "$BASE_DOMAIN" ]; then
              echo "ERROR: Could not derive BASE_DOMAIN"; exit 1
            fi
            echo "Derived BASE_DOMAIN from tunnel: $BASE_DOMAIN"
          else
            echo "Using provided BASE_DOMAIN: $BASE_DOMAIN"
          fi

          # External port -> "service:containerPort" from generator
          EXTERNAL_MAP='${{ needs.generate_and_upload_truenas_compose_file.outputs.external_map_json }}'
          if ! echo "$EXTERNAL_MAP" | jq -e . >/dev/null 2>&1; then
            echo "WARN: EXTERNAL_MAP invalid/empty; using {}"
            EXTERNAL_MAP="{}"
          fi
          echo "External map (normalized):"
          echo "$EXTERNAL_MAP" | jq .

          # Build env-scoped dynamic ingress
          DYN=$(echo "$EXTERNAL_MAP" | jq -c --arg env "$ENV_SLUG" --arg base "$BASE_DOMAIN" --arg ip "$HOST_LAN_IP" '
            to_entries
            | map({
                hostname: ("dj-panel-" + $env + "-" + (.value | split(":")[0]) + "." + $base),
                service: ("http://" + $ip + ":" + .key)
              })
          ')

          # Fetch current config to preserve non-env hostnames
          CURRENT="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_UUID}/configurations" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}")"
          KEEP=$(echo "$CURRENT" | jq -c --arg env "$ENV_SLUG" '
            .result.config.ingress
            | map(select(.hostname? != null))
            | map(select(.hostname | test("^dj-panel-" + $env + "-"; "i") | not))
          ')

          # Merge KEEP + DYN + 404
          INGRESS=$(jq -c --argjson keep "$KEEP" --argjson dyn "$DYN" -n '$keep + $dyn + [{"service":"http_status:404"}]')
          echo "Proposed ingress (service-based, preserving other envs):"
          echo "$INGRESS" | jq .

          BODY=$(jq -c --argjson ing "$INGRESS" -n '{config:{ingress:$ing, "warp-routing":{"enabled":true}}}')
          echo "$BODY" > body.json

          echo "PUT to Cloudflare Tunnel configuration…"
          resp=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_UUID}/configurations" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            --data-binary @body.json)

          echo "Cloudflare response body:"
          echo "$resp" | jq .

          ok=$(echo "$resp" | jq -r '.success')
          if [ "$ok" != "true" ]; then
            code=$(echo "$resp" | jq -r '.errors[0].code // empty')
            msg=$(echo "$resp" | jq -r '.errors[0].message // empty')
            echo "ERROR: Cloudflare update failed: code=${code:-?} message=${msg:-?}"
            exit 1
          fi
          echo "Cloudflare Tunnel configuration updated successfully."

  update_cloudflare_dns_records:
    name: Ensure Cloudflare DNS CNAMEs for tunnel hostnames
    runs-on: ubuntu-latest
    needs:
      [
        update_cloudflare_tunnel,
        determine_environment,
        generate_and_upload_truenas_compose_file,
      ]
    steps:
      - name: Create/Update DNS CNAMEs for service FQDNs (env-scoped)
        run: |
          set -euo pipefail

          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CF_EMAIL="${{ secrets.CLOUDFLARE_EMAIL }}"
          CF_KEY="${{ secrets.CLOUDFLARE_API_KEY }}"
          TUNNEL_UUID="${{ secrets.CLOUDFLARE_TUNNEL_UUID }}"
          ENV_SLUG='${{ needs.determine_environment.outputs.env_slug }}'

          HOST_LAN_IP="${{ vars.TRUENAS_LAN_IP }}"
          HOST_LAN_IP="${HOST_LAN_IP:-192.168.1.17}"

          BASE_DOMAIN="${{ vars.BASE_DOMAIN }}"
          BASE_DOMAIN="${BASE_DOMAIN:-}"

          # Derive BASE_DOMAIN if not provided
          if [ -z "$BASE_DOMAIN" ]; then
            echo "BASE_DOMAIN not provided; deriving…"
            cfg="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_UUID}/configurations" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}")"
            BASE_DOMAIN="$(echo "$cfg" | jq -r '.result.config.ingress[]?.hostname // empty' \
              | awk -F. 'NF>=2 {print $(NF-1)"."$NF}' \
              | sort | uniq -c | sort -nr | awk 'NR==1{print $2}')"
            if [ -z "$BASE_DOMAIN" ]; then
              echo "ERROR: Could not derive BASE_DOMAIN"; exit 1
            fi
            echo "Derived BASE_DOMAIN from tunnel: $BASE_DOMAIN"
          else
            echo "Using provided BASE_DOMAIN: $BASE_DOMAIN"
          fi

          # Zone id
          ZONE_ID="$(curl -sS -G "https://api.cloudflare.com/client/v4/zones" \
            --data-urlencode "name=${BASE_DOMAIN}" --data-urlencode "status=active" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" | jq -r '.result[0].id')"
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "ERROR: Zone not found for ${BASE_DOMAIN}"
            exit 1
          fi

          # External map from generator
          EXTERNAL_MAP='${{ needs.generate_and_upload_truenas_compose_file.outputs.external_map_json }}'
          if ! echo "$EXTERNAL_MAP" | jq -e . >/dev/null 2>&1; then
            echo "WARN: EXTERNAL_MAP invalid/empty; using {}"
            EXTERNAL_MAP="{}"
          fi

          # Build desired env-scoped FQDNs from EXTERNAL_MAP
          DYNAMIC_FQDNS=$(echo "$EXTERNAL_MAP" | jq -c --arg env "$ENV_SLUG" --arg base "$BASE_DOMAIN" '
            to_entries
            | map("dj-panel-" + $env + "-" + (.value | split(":")[0]) + "." + $base)
          ')
          echo "Desired env FQDNs:"
          echo "$DYNAMIC_FQDNS" | jq .

          # Convert to left-label names for DNS record "name" field
          ALL_LABELS=$(echo "$DYNAMIC_FQDNS" | jq -c --arg base "$BASE_DOMAIN" '
            map( sub("\\."+($base|gsub("\\."; "\\."))+"$"; "") )
          ')
          echo "DNS record names (left labels):"
          echo "$ALL_LABELS" | jq .

          TARGET="${TUNNEL_UUID}.cfargotunnel.com"

          create_or_update() {
            label="$1"
            rec="$(curl -sS -G "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              --data-urlencode "type=CNAME" \
              --data-urlencode "name=${label}.${BASE_DOMAIN}" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}")"
            rid="$(echo "$rec" | jq -r '.result[0].id // empty')"
            if [ -n "$rid" ]; then
              cur_content="$(echo "$rec" | jq -r '.result[0].content')"
              cur_proxied="$(echo "$rec" | jq -r '.result[0].proxied')"
              if [ "$cur_content" != "$TARGET" ] || [ "$cur_proxied" != "true" ]; then
                echo "Updating ${label} -> ${TARGET} (proxied=true)"
                if ! curl -sS -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${rid}" \
                  -H "Content-Type: application/json" \
                  -H "X-Auth-Email: ${CF_EMAIL}" \
                  -H "X-Auth-Key: ${CF_KEY}" \
                  --data-binary "$(jq -c --arg name "$label" --arg content "$TARGET" -n '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')" \
                  | jq -e '.success' >/dev/null; then
                  echo "ERROR: update failed for $label"; exit 1
                fi
              else
                echo "OK (unchanged): ${label}"
              fi
            else
              echo "Creating ${label} -> ${TARGET} (proxied=true)"
              if ! curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
                -H "Content-Type: application/json" \
                -H "X-Auth-Email: ${CF_EMAIL}" \
                -H "X-Auth-Key: ${CF_KEY}" \
                --data-binary "$(jq -c --arg name "$label" --arg content "$TARGET" -n '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')" \
                | jq -e '.success' >/dev/null; then
                echo "ERROR: create failed for $label"; exit 1
              fi
            fi
          }

          for label in $(echo "$ALL_LABELS" | jq -r '.[]'); do
            create_or_update "$label"
          done

          echo "DNS sync (env-scoped) complete."

  deployment_summary:
    name: Zero-Downtime Deployment Summary
    runs-on: ubuntu-latest
    needs:
      - determine_docker_tag
      - determine_compose_timestamp
      - determine_environment
      - check_current_deployment
      - deploy_to_target_slot
      - verify_new_deployment
      - switch_traffic_to_new_deployment
      - stop_old_deployment
      - update_cloudflare_tunnel
      - update_cloudflare_dns_records
    if: always()
    steps:
      - name: Summary
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "  🎉 Zero-Downtime Deployment Complete!"
          echo "=========================================="
          echo ""
          echo "📦 Docker Image:"
          echo "   Tag: ${{ needs.determine_docker_tag.outputs.docker_tag }}"
          echo "   Latest: ${{ needs.determine_docker_tag.outputs.latest_tag }}"
          echo ""
          echo "🌍 Environment:"
          echo "   Name: ${{ needs.determine_environment.outputs.current_env }}"
          echo "   Slug: ${{ needs.determine_environment.outputs.env_slug }}"
          echo ""
          echo "🔵🟢 Blue-Green Deployment:"
          echo "   Deployed to: ${{ needs.deploy_to_target_slot.outputs.deployed_slot }} slot"
          echo "   Previous: ${{ needs.check_current_deployment.outputs.active_slot }} slot (now stopped)"
          echo ""
          echo "✅ Status:"
          echo "   New Deployment: ${{ needs.verify_new_deployment.result }}"
          echo "   Traffic Switch: ${{ needs.switch_traffic_to_new_deployment.result }}"
          echo "   Old Deployment Stopped: ${{ needs.stop_old_deployment.result }}"
          echo "   Cloudflare Tunnel: ${{ needs.update_cloudflare_tunnel.result }}"
          echo "   DNS Records: ${{ needs.update_cloudflare_dns_records.result }}"
          echo ""
          echo "📄 Compose File: ${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          echo ""
          echo "=========================================="
          echo "✨ ZERO DOWNTIME ACHIEVED ✨"
          echo "=========================================="
