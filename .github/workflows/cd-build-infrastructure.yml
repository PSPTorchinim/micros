name: Build TrueNAS Infrastructure

on:
  workflow_dispatch:

jobs:
  get_truenas_ports:
    name: Get TrueNAS Ports
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.get_netstat_ports.outputs.stdout }}
    steps:
      - name: Get Netstat Listening Ports
        id: get_netstat_ports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            netstat -an | awk '{print $4}' | grep -Eo ':[0-9]+$' | cut -d: -f2 | sort -n | uniq

  get_cloudflare_tunnel_ports:
    name: Get Cloudflare Tunnel Ports
    runs-on: ubuntu-latest
    outputs:
      tunnel_ports: ${{ steps.format_output.outputs.ports }}
    steps:
      - name: Get Cloudflare DNS Records
        id: get_tunnel_ports
        run: |
          response=$(curl -s https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/cfd_tunnel/${{ secrets.CLOUDFLARE_TUNNEL_UUID }}/configurations \
            -H "X-Auth-Email: ${{ secrets.CLOUDFLARE_EMAIL }}" \
            -H "X-Auth-Key: ${{ secrets.CLOUDFLARE_API_KEY }}")
          echo $response
          echo "response=$response" >> $GITHUB_OUTPUT

      - name: Format Output
        id: format_output
        run: |
          ports=$(echo '${{ steps.get_tunnel_ports.outputs.response }}' | jq -r '.result.config.ingress[].service' | grep -E '^https?://' | grep -oE ':[0-9]+' | cut -d: -f2 | sort -n | uniq | tr '\n' ' ')
          echo $ports
          echo "ports=$ports" >> $GITHUB_OUTPUT

  calculate_unused_ports:
    name: Calculate Unused External and Internal Ports
    runs-on: ubuntu-latest
    needs: [get_truenas_ports, get_cloudflare_tunnel_ports]
    outputs:
      external_ports: ${{ steps.calculate_external_ports.outputs.ports }}
      internal_ports: ${{ steps.calculate_internal_ports.outputs.ports }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Calculate unused internal ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_internal_ports
        with:
          start_port: 40000
          end_port: 50000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ${{ needs.get_cloudflare_tunnel_ports.outputs.tunnel_ports }}

      - name: Calculate unused external ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_external_ports
        with:
          start_port: 50000
          end_port: 60000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ${{ needs.get_cloudflare_tunnel_ports.outputs.tunnel_ports }}

  determine_environment:
    runs-on: ubuntu-latest
    name: Determine Environment
    outputs:
      current_env: ${{ steps.set_env.outputs.current_env }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Set Environment
        id: set_env
        uses: ./.github/templates/determine-environment

  determine_target_branch:
    name: Determine Target Branch
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.branch_set.outputs.target_branch }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Determine target branch based on branch
        id: branch_set
        uses: ./.github/templates/determine-target-branch

  determine_docker_tag:
    name: Determine Docker Tag
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag_set.outputs.docker_tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Determine Docker tag based on branch
        id: tag_set
        uses: ./.github/templates/determine-docker-tag

  generate_and_upload_truenas_compose_file:
    name: Generate and Upload TrueNAS Docker Compose File
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        calculate_unused_ports,
        determine_target_branch,
        determine_docker_tag,
      ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Read Docker Compose File
        id: read_compose
        run: |
          compose_content=$(cat Docker/dj-panel-composer.yml)
          echo "compose_content<<EOF" >> $GITHUB_OUTPUT
          echo "$compose_content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate New Compose File with Unused Ports and GHCR Images
        id: generate_compose_file
        shell: bash
        run: |
          # Get unused ports arrays
          internal_ports=(${{ needs.calculate_unused_ports.outputs.internal_ports }})
          external_ports=(${{ needs.calculate_unused_ports.outputs.external_ports }})

          # Read the original compose file
          compose_file=$(cat Docker/dj-panel-composer.yml)

          # Initialize port counters
          internal_port_index=0
          external_port_index=0

          # Get Docker tag and repository info
          docker_tag="${{ needs.determine_docker_tag.outputs.docker_tag }}"
          repo_owner="${{ github.repository_owner }}"
          repo_name="${{ github.event.repository.name }}"

          # Create new compose file with updated ports
          new_compose_file="$compose_file"

          # Function to get GHCR image based on dockerfile and service type
          get_ghcr_image() {
            local dockerfile_path="$1"
            local microservice_name="$2"
            local microfrontend_name="$3"
            
            if [[ "$dockerfile_path" == *"infra/"* ]]; then
              # Infrastructure services (infra/mongodb.Dockerfile -> infra/mongodb)
              image_name=$(basename "$dockerfile_path" .Dockerfile)
              echo "ghcr.io/${repo_owner}/${repo_name}/infra/${image_name}:${docker_tag}"
            elif [[ "$dockerfile_path" == *"microservice.Dockerfile" ]]; then
              # Microservices -> services/{microservice_name}
              if [[ "$microservice_name" != "null" && "$microservice_name" != "" ]]; then
                # Convert microservice name to lowercase
                local service_name=$(echo "$microservice_name" | tr '[:upper:]' '[:lower:]')
                echo "ghcr.io/${repo_owner}/${repo_name}/services/${service_name}:${docker_tag}"
              else
                echo "ghcr.io/${repo_owner}/${repo_name}/services/unknown:${docker_tag}"
              fi
            elif [[ "$dockerfile_path" == *"microfrontend.Dockerfile" ]]; then
              # Frontends -> frontends/{microfrontend_name}
              if [[ "$microfrontend_name" != "null" && "$microfrontend_name" != "" ]]; then
                echo "ghcr.io/${repo_owner}/${repo_name}/frontends/${microfrontend_name}:${docker_tag}"
              else
                echo "ghcr.io/${repo_owner}/${repo_name}/frontends/unknown:${docker_tag}"
              fi
            else
              echo "ghcr.io/${repo_owner}/${repo_name}/unknown:${docker_tag}"
            fi
          }

          # Function to infer microservice name from service name
          infer_microservice_name() {
            local service_name="$1"
            
            # Remove common suffixes
            local base_name=$(echo "$service_name" | sed -E 's/_(be|api|service)$//')
            
            # Convert to API format (lowercase + api suffix)
            echo "${base_name}api"
          }

          # Function to infer microfrontend name from service name
          infer_microfrontend_name() {
            local service_name="$1"
            
            # Remove common suffixes
            local base_name=$(echo "$service_name" | sed -E 's/_(fe|frontend|ui)$//')
            
            # Special cases
            case "$service_name" in
              host_fe) echo "dj-panel" ;;
              admin_fe) echo "admin-panel" ;;
              *) echo "$base_name" ;;
            esac
          }

          # Function to determine dockerfile path based on service characteristics
          determine_dockerfile_path() {
            local service_name="$1"
            local service_config="$2"
            
            # Check if dockerfile is explicitly defined
            local dockerfile_path=$(echo "$service_config" | yq eval '.build.dockerfile' - 2>/dev/null || echo "null")
            if [[ "$dockerfile_path" != "null" ]]; then
              echo "$dockerfile_path"
              return
            fi
            
            # Check if there's any build context
            local build_context=$(echo "$service_config" | yq eval '.build.context' - 2>/dev/null || echo "null")
            if [[ "$build_context" != "null" ]]; then
              # Has build context, dynamically check for infra dockerfiles
              
              # Check if any infra dockerfile exists that could match this service
              for infra_file in Docker/infra/*.Dockerfile; do
                if [[ -f "$infra_file" ]]; then
                  local infra_name=$(basename "$infra_file" .Dockerfile)
                  
                  # Simple substring matching - if service name contains infra name or vice versa
                  if [[ "$service_name" == *"$infra_name"* ]] || [[ "$infra_name" == *"$service_name"* ]]; then
                    echo "$infra_file"
                    return
                  fi
                  
                  # Also check with common separators removed
                  local clean_service=$(echo "$service_name" | tr '_-' '')
                  local clean_infra=$(echo "$infra_name" | tr '_-' '')
                  
                  if [[ "$clean_service" == *"$clean_infra"* ]] || [[ "$clean_infra" == *"$clean_service"* ]]; then
                    echo "$infra_file"
                    return
                  fi
                fi
              done
              
              # If no infra match found, determine by service type patterns
              case "$service_name" in
                *_be|*_api|*_service|apigateway) echo "Docker/microservice.Dockerfile" ;;
                *_fe|*_frontend|*_ui|host_fe) echo "Docker/microfrontend.Dockerfile" ;;
                *) echo "Docker/microservice.Dockerfile" ;; # Default to microservice
              esac
            else
              echo "null"
            fi
          }

          # Updated process_services function with better build detection
          process_services() {
            local category="$1"  # internal, external, backend, or root level
            local use_external_ports="$2"  # true/false
            
            local services_path
            if [[ "$category" == "root" ]]; then
              services_path=".services"
            else
              services_path=".services.${category}"
            fi
            
            # ALWAYS use original compose_file for reading service structure and config  
            local services=$(echo "$compose_file" | yq eval "$services_path | keys | .[]" - 2>/dev/null || echo "")
            
            for service in $services; do
              if [[ -z "$service" ]]; then continue; fi
              
              # Read service config from ORIGINAL compose file
              local service_config=$(echo "$compose_file" | yq eval "${services_path}.\"$service\"" -)
              
              # Check if service has ANY build configuration (build section OR build context)
              local has_build_section=$(echo "$service_config" | yq eval '.build' - 2>/dev/null | grep -v '^null$' | grep -q '\S' && echo "true" || echo "false")
              local has_build_context=$(echo "$service_config" | yq eval '.build.context' - 2>/dev/null | grep -v '^null$' | grep -q '\S' && echo "true" || echo "false")
              
              if [[ "$has_build_section" != "true" && "$has_build_context" != "true" ]]; then
                echo "  Skipping $service (no build config)"
                continue
              fi
              
              echo "Processing $category service: $service"
              
              # Determine dockerfile path
              local dockerfile_path=$(determine_dockerfile_path "$service" "$service_config")
              
              if [[ "$dockerfile_path" == "null" ]]; then
                echo "  Warning: Could not determine dockerfile for $service, skipping"
                continue
              fi
              
              # Get service names from build args or infer them
              local microservice_name=$(echo "$service_config" | yq eval '.build.args.MICROSERVICE_NAME' - 2>/dev/null || echo "null")
              local microfrontend_name=$(echo "$service_config" | yq eval '.build.args.MICROFRONTEND_NAME' - 2>/dev/null || echo "null")
              
              # Infer names if not provided
              if [[ "$microservice_name" == "null" || "$microservice_name" == "" ]]; then
                if [[ "$dockerfile_path" == *"microservice.Dockerfile" ]]; then
                  microservice_name=$(infer_microservice_name "$service")
                fi
              fi
              
              if [[ "$microfrontend_name" == "null" || "$microfrontend_name" == "" ]]; then
                if [[ "$dockerfile_path" == *"microfrontend.Dockerfile" ]]; then
                  microfrontend_name=$(infer_microfrontend_name "$service")
                fi
              fi
              
              # Generate GHCR image URL
              local ghcr_image=$(get_ghcr_image "$dockerfile_path" "$microservice_name" "$microfrontend_name")
              
              # Replace build with image in the WORKING COPY (new_compose_file)
              if [[ "$category" == "root" ]]; then
                new_compose_file=$(echo "$new_compose_file" | yq eval "del(.services.\"$service\".build)" -)
                new_compose_file=$(echo "$new_compose_file" | yq eval ".services.\"$service\".image = \"$ghcr_image\"" -)
              else
                new_compose_file=$(echo "$new_compose_file" | yq eval "del(${services_path}.\"$service\".build)" -)
                new_compose_file=$(echo "$new_compose_file" | yq eval "${services_path}.\"$service\".image = \"$ghcr_image\"" -)
              fi
              
              echo "  -> $ghcr_image"
              
              # Handle port mappings (only for services that have ports defined)
              if echo "$service_config" | yq eval '.ports' - | grep -q '\-' 2>/dev/null; then
                local port_count=$(echo "$service_config" | yq eval '.ports | length' -)
                
                for ((i=0; i<port_count; i++)); do
                  local current_mapping=$(echo "$service_config" | yq eval ".ports[$i]" -)
                  local internal_container_port=$(echo "$current_mapping" | cut -d':' -f2)
                  
                  local new_port
                  
                  if [[ "$use_external_ports" == "true" ]]; then
                    if [ $external_port_index -lt ${#external_ports[@]} ]; then
                      new_port="${external_ports[$external_port_index]}"
                      external_port_index=$((external_port_index + 1))
                    else
                      echo "  Warning: Not enough external ports available for service $service port $i"
                      break
                    fi
                  else
                    if [ $internal_port_index -lt ${#internal_ports[@]} ]; then
                      new_port="${internal_ports[$internal_port_index]}"
                      internal_port_index=$((internal_port_index + 1))
                    else
                      echo "  Warning: Not enough internal ports available for service $service port $i"
                      break
                    fi
                  fi
                  
                  local new_mapping="${new_port}:${internal_container_port}"
                  
                  # Update the compose file
                  if [[ "$category" == "root" ]]; then
                    new_compose_file=$(echo "$new_compose_file" | yq eval ".services.\"$service\".ports[$i] = \"$new_mapping\"" -)
                  else
                    new_compose_file=$(echo "$new_compose_file" | yq eval "${services_path}.\"$service\".ports[$i] = \"$new_mapping\"" -)
                  fi
                  
                  echo "  Port mapping: $current_mapping -> $new_mapping"
                done
              fi
            done
          }

          # Process all service categories dynamically with explicit checks
          echo "=== Processing Internal Services ==="
          if echo "$compose_file" | yq eval '.services.internal' - | grep -q '\S' 2>/dev/null; then
            process_services "internal" "false"
          else
            echo "No internal services found"
          fi

          echo "=== Processing External Services ==="
          if echo "$compose_file" | yq eval '.services.external' - | grep -q '\S' 2>/dev/null; then
            process_services "external" "true"
          else
            echo "No external services found"
          fi

          echo "=== Processing Backend Services ==="
          if echo "$compose_file" | yq eval '.services.backend' - | grep -q '\S' 2>/dev/null; then
            process_services "backend" "false"
          else
            echo "No backend services found"
          fi

          # Check if we have nested structure and flatten it
          if echo "$new_compose_file" | yq eval '.services | has("internal") or has("external") or has("backend")' - | grep -q true; then
            echo "=== Flattening Services Structure ==="
            # Flatten the structure back to standard Docker Compose format
            flattened_compose=$(echo "$new_compose_file" | yq eval '
              .services = (.services.internal // {}) + (.services.external // {}) + (.services.backend // {}) + (
                .services | 
                to_entries | 
                map(select(.key != "internal" and .key != "external" and .key != "backend")) | 
                from_entries
              ) |
              del(.services.internal) |
              del(.services.external) |
              del(.services.backend)
            ' -)
            new_compose_file="$flattened_compose"
          fi

          # Generate filename with tag
          filename="dj-panel-composer-${docker_tag}.yml"

          # Save the new compose file
          echo "$new_compose_file" > "$filename"

          echo "compose_file=$filename" >> $GITHUB_OUTPUT
          echo "Generated compose file: $filename"
          echo "=== Final Compose File ==="
          cat "$filename"
