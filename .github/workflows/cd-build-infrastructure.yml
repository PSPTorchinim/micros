name: Build TrueNAS Infrastructure

# This workflow deploys the application stack to TrueNAS with zero-downtime:
# 1. Determines environment (Development/Production) and generates unique tags
# 2. Calculates available ports on TrueNAS for service allocation
# 3. Generates and uploads Docker Compose file with service configurations
# 4. Enables Cloudflare maintenance page to prevent user disruption
# 5. Performs rolling update of services while keeping databases running
# 6. Updates Cloudflare tunnel and DNS for service routing
# 7. Disables maintenance page after successful deployment
# 8. Includes automatic rollback on failure

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Artifacts"]
    types:
      - completed
    branches:
      - "releases/R*"
      - "production"

jobs:
  determine_environment:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    name: Determine Environment
    outputs:
      current_env: ${{ steps.set_env.outputs.current_env }}
      env_slug: ${{ steps.compute_slug.outputs.env_slug }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set Environment
        id: set_env
        uses: ./.github/templates/determine-environment

      - name: Compute env slug
        id: compute_slug
        uses: ./.github/templates/compute-env-slug
        with:
          environment: ${{ steps.set_env.outputs.current_env }}

  determine_docker_tag:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Determine Docker Tag
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag_set.outputs.docker_tag }}
      latest_tag: ${{ steps.tag_set.outputs.latest_tag }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Determine Docker tag
        id: tag_set
        uses: ./.github/templates/determine-docker-tag

  determine_compose_timestamp:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Determine Compose File Timestamp
    needs: [determine_environment]
    runs-on: ubuntu-latest
    outputs:
      compose_timestamp: ${{ steps.timestamp_set.outputs.compose_timestamp }}
      compose_file_name: ${{ steps.timestamp_set.outputs.compose_file_name }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Determine compose timestamp
        id: timestamp_set
        uses: ./.github/templates/determine-compose-timestamp
        with:
          env_slug: ${{ needs.determine_environment.outputs.env_slug }}

  setup_truenas_directories:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Setup TrueNAS directory structure (first-time)
    runs-on: ubuntu-latest
    needs: [determine_environment]
    steps:
      - name: Create directory structure on TrueNAS
        id: create_dirs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail

            echo "=========================================="
            echo "🔧 TrueNAS Directory Setup"
            echo "=========================================="

            ENV="${{ needs.determine_environment.outputs.current_env }}"
            BASE_DIR="/mnt/Files/Apps/DJPanel/${ENV}"

            echo "Setting up base directories for environment: ${ENV}"

            # Create main directories (mkdir -p is idempotent)
            mkdir -p "${BASE_DIR}/Images"
            mkdir -p "${BASE_DIR}/Images/backups"
            mkdir -p "${BASE_DIR}/data"

            echo "✅ Created: ${BASE_DIR}/Images"
            echo "✅ Created: ${BASE_DIR}/Images/backups"
            echo "✅ Created: ${BASE_DIR}/data"

            # Set permissions on newly created directories (non-fatal)
            chmod -R 755 "${BASE_DIR}/Images" 2>/dev/null || echo "⚠️  Could not set permissions on ${BASE_DIR}/Images (may already exist with correct permissions)"
            chmod -R 755 "${BASE_DIR}/data" 2>/dev/null || echo "⚠️  Could not set permissions on ${BASE_DIR}/data (may already exist with correct permissions)"

            echo "ℹ️  Volume subdirectories will be created after compose file generation"

            echo "✅ Directory setup verified"
            echo "=========================================="
            echo "✅ TrueNAS directory setup complete!"
            echo "=========================================="

  backup_current_state:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Backup current deployment for rollback
    runs-on: ubuntu-latest
    needs: [determine_environment, setup_truenas_directories]
    outputs:
      backup_created: ${{ steps.backup.outputs.backup_created }}
    steps:
      - name: Backup current compose file and app state
        id: backup
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            base="/mnt/Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}/Images"
            agg="${base}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}.yml"
            backup_dir="${base}/backups"
            timestamp=$(date +%Y%m%d_%H%M%S)

            mkdir -p "$backup_dir"

            if [ -f "$agg" ]; then
              backup_file="${backup_dir}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}-backup-${timestamp}.yml"
              cp "$agg" "$backup_file"
              echo "✅ Backup created: $backup_file"
              
              # Keep only last 5 backups
              ls -1t "$backup_dir"/dj-panel-${{ needs.determine_environment.outputs.env_slug }}-backup-*.yml 2>/dev/null \
                | tail -n +6 | xargs -r rm -f || true
              
              echo "BACKUP_CREATED=true"
              echo "BACKUP_FILE=$backup_file"
            else
              echo "ℹ️  No existing deployment to backup (first deployment)"
              echo "BACKUP_CREATED=false"
            fi

  get_truenas_ports:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Get TrueNAS Ports
    runs-on: ubuntu-latest
    needs: [backup_current_state]
    outputs:
      ports: ${{ steps.get_netstat_ports.outputs.stdout }}
    steps:
      - name: Get Netstat Listening Ports (TrueNAS host)
        id: get_netstat_ports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            netstat -tuln 2>/dev/null \
              | awk 'NR>2 {print $4}' \
              | sed -E 's/.*:([0-9]+)$/\1/' \
              | grep -E '^[0-9]+$' \
              | sort -n | uniq

  calculate_unused_ports:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Calculate Unused External and Internal Ports
    runs-on: ubuntu-latest
    needs: [get_truenas_ports]
    outputs:
      external_ports: ${{ steps.calculate_external_ports.outputs.unused_ports }}
      internal_ports: ${{ steps.calculate_internal_ports.outputs.unused_ports }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Calculate unused internal ports (40000-49999)
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_internal_ports
        with:
          start_port: 40000
          end_port: 50000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ""

      - name: Calculate unused external ports (50000-59999)
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_external_ports
        with:
          start_port: 50000
          end_port: 60000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ""

  generate_and_upload_truenas_compose_file:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Generate & Upload New Compose
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        determine_docker_tag,
        determine_compose_timestamp,
        calculate_unused_ports,
        backup_current_state,
      ]
    outputs:
      new_compose_abs: ${{ steps.parse_upload.outputs.new_compose_abs }}
      external_map_json: ${{ steps.generate_compose_file.outputs.external_ports_map }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install yq on runner
        run: |
          set -euo pipefail
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Generate compose from template and free ports
        id: generate_compose_file
        shell: bash
        env:
          LOG_LEVEL: DEBUG
        run: |
          set -euo pipefail
          
          echo "🔧 Generating Docker Compose file..."
          chmod +x .github/scripts/generate-compose-file.sh
          
          output_file="${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          echo "Output file: $output_file"
          
          # Extract repo name from "owner/repo" format
          repo_name="${{ github.repository }}"
          repo_name="${repo_name##*/}"
          echo "Repository: $repo_name"
          
          echo "Running compose generator script..."
          external_map_json=$(.github/scripts/generate-compose-file.sh \
            "${{ needs.calculate_unused_ports.outputs.internal_ports }}" \
            "${{ needs.calculate_unused_ports.outputs.external_ports }}" \
            "${{ needs.determine_docker_tag.outputs.docker_tag }}" \
            "${{ github.repository_owner }}" \
            "$repo_name" \
            "Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}" \
            "$output_file")
          
          echo "✅ Compose file generated successfully"
          {
            echo "compose_file=$output_file"
            echo "external_ports_map=$external_map_json"
          } >> "$GITHUB_OUTPUT"

      - name: Package compose for transfer (base64)
        id: package_compose
        run: |
          set -euo pipefail
          
          echo "📦 Packaging compose file for transfer..."
          COMPOSE_FILE="${{ steps.generate_compose_file.outputs.compose_file }}"
          test -f "$COMPOSE_FILE" || { echo "❌ Compose not found: $COMPOSE_FILE" >&2; exit 1; }
          
          echo "Encoding file: $COMPOSE_FILE"
          B64=$(base64 -w0 "$COMPOSE_FILE")
          echo "✅ File encoded successfully"
          
          {
            echo "compose_name=$COMPOSE_FILE"
            echo "compose_b64=$B64"
          } >> "$GITHUB_OUTPUT"

      - name: Upload compose into TrueNAS dataset
        id: upload_compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: TRUENAS_POOL,CURRENT_ENV,COMPOSE_NAME,COMPOSE_B64
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            POOL="Files"
            ENV_DIR='${{ needs.determine_environment.outputs.current_env }}'
            COMPOSE_NAME='${{ steps.package_compose.outputs.compose_name }}'
            COMPOSE_B64='${{ steps.package_compose.outputs.compose_b64 }}'
            TARGET_REL="Apps/DJPanel/${ENV_DIR}/Images"
            DST_DIR="/mnt/$POOL/$TARGET_REL"
            mkdir -p "$DST_DIR"
            DST_NAME="${COMPOSE_NAME##*/}"
            DST_PATH="$DST_DIR/$DST_NAME"
            printf '%s' "$COMPOSE_B64" | base64 -d > "$DST_PATH"
            chmod 664 "$DST_PATH" || true
            echo "COMPOSE_ABS=$DST_PATH"

      - name: Parse upload path and expose as output
        id: parse_upload
        run: |
          set -euo pipefail
          
          echo "🔍 Parsing upload output..."
          out='${{ steps.upload_compose.outputs.stdout }}'
          abs=$(echo "$out" | awk -F= '/^COMPOSE_ABS=/{print $2}' | tail -n1)
          
          test -n "$abs" || { echo "❌ No COMPOSE_ABS marker in SSH output"; exit 1; }
          
          echo "✅ Compose uploaded to: $abs"
          echo "new_compose_abs=$abs" >> "$GITHUB_OUTPUT"

      - name: Create volume directories from generated compose
        id: create_volume_dirs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            
            echo "=========================================="
            echo "🔧 Creating Volume Directories"
            echo "=========================================="
            
            ENV="${{ needs.determine_environment.outputs.current_env }}"
            BASE_DIR="/mnt/Files/Apps/DJPanel/${ENV}"
            COMPOSE_FILE="${{ steps.parse_upload.outputs.new_compose_abs }}"
            
            echo "Extracting volume paths from: ${COMPOSE_FILE}"
            
            # Extract unique volume paths from service bind mounts
            # Pattern: /mnt/Files/Apps/DJPanel/{ENV}/data/{service}/{volume}:/container/path
            if command -v yq >/dev/null 2>&1; then
              echo "Using yq to extract volume paths from service bind mounts"
              # Get all volume entries from all services
              volume_paths=$(yq eval '.services.*.volumes[]? | select(. == "*/mnt/Files*")' "$COMPOSE_FILE" 2>/dev/null | \
                grep -o '/mnt/Files/Apps/DJPanel/[^:]*' | sort -u || echo "")
            else
              echo "Using grep to extract volume paths (yq not available)"
              # Extract paths that start with /mnt/Files and end before :
              volume_paths=$(grep -E '^\s+-\s+/mnt/Files/Apps/DJPanel/' "$COMPOSE_FILE" | \
                sed -E 's/.*-\s+([^:]+):.*/\1/' | sort -u || echo "")
            fi
            
            if [ -z "$volume_paths" ]; then
              echo "⚠️  No TrueNAS volume paths found in compose file"
              echo "ℹ️  This might be expected if no services use TrueNAS volumes"
              exit 0
            fi
            
            echo "Found volume paths:"
            echo "$volume_paths"
            echo ""
            
            # Create directories for each unique path
            volume_count=0
            for vol_path in $volume_paths; do
              # Create directory if it doesn't exist
              if [ ! -d "$vol_path" ]; then
                mkdir -p "$vol_path"
                echo "📁 Created: $vol_path"
              else
                echo "ℹ️  Exists: $vol_path"
              fi
              
              # Set permissions to allow container users to write
              # Containers may run as non-root users (e.g., mssql UID 10001, loki, etc.)
              # Using 777 to ensure any container user can read/write
              chmod -R 777 "$vol_path" 2>/dev/null || {
                echo "⚠️  Could not set permissions on $vol_path, trying without -R"
                chmod 777 "$vol_path" 2>/dev/null || echo "❌ Failed to set permissions on $vol_path"
              }
              
              # Verify permissions
              actual_perms=$(stat -c '%a' "$vol_path" 2>/dev/null || stat -f '%Lp' "$vol_path" 2>/dev/null || echo "unknown")
              if [ "$actual_perms" = "777" ]; then
                echo "✅ Permissions: $vol_path (777)"
              else
                echo "⚠️  Permissions: $vol_path ($actual_perms) - expected 777"
              fi
              
              volume_count=$((volume_count + 1))
            done
            
            # Ensure parent directories have execute permissions for traversal
            chmod 755 "${BASE_DIR}/data" 2>/dev/null || echo "⚠️  Could not set permissions on ${BASE_DIR}/data"
            chmod 755 "${BASE_DIR}" 2>/dev/null || echo "⚠️  Could not set permissions on ${BASE_DIR}"
            
            echo ""
            echo "=========================================="
            echo "✅ Created ${volume_count} volume directories"
            echo "=========================================="

  enable_maintenance_page:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Enable Cloudflare Maintenance Page
    runs-on: ubuntu-latest
    needs: [generate_and_upload_truenas_compose_file, determine_environment]
    steps:
      - name: Checkout repository for maintenance page
        uses: actions/checkout@v4

      - name: Enable Cloudflare maintenance mode for all external service hostnames
        run: |
          echo "🔧 Enabling maintenance page on Cloudflare..."

          MAINTENANCE_HTML=$(jq -Rs . < .github/workflows/maintenance.html)
          cat > /tmp/worker-script.js <<EOF
          addEventListener('fetch', event => {
            event.respondWith(handleRequest(event.request))
          })

          async function handleRequest(request) {
            const maintenanceHTML = ${MAINTENANCE_HTML}
            return new Response(maintenanceHTML, {
              status: 503,
              headers: {
                'Content-Type': 'text/html;charset=UTF-8',
                'Cache-Control': 'no-store, no-cache, must-revalidate, proxy-revalidate',
                'Retry-After': '120'
              }
            })
          }
          EOF

          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CF_EMAIL="${{ secrets.CLOUDFLARE_EMAIL }}"
          CF_KEY="${{ secrets.CLOUDFLARE_API_KEY }}"
          ZONE_ID="${{ secrets.CLOUDFLARE_ZONE_ID }}"
          ENV_SLUG="${{ needs.determine_environment.outputs.env_slug }}"
          EXTERNAL_MAP='${{ needs.generate_and_upload_truenas_compose_file.outputs.external_map_json }}'

          # Deploy worker to Cloudflare
          WORKER_NAME="maintenance-page-${ENV_SLUG}"
          echo "📤 Uploading worker script: ${WORKER_NAME}"
          
          response=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/javascript" \
            --data-binary @/tmp/worker-script.js)
          
          if echo "$response" | jq -e '.success' > /dev/null; then
            echo "✅ Worker script uploaded successfully"
          else
            echo "⚠️  Worker upload response: $response"
          fi

          # For each external service, create a route for dj-panel-{env_slug}-{service}.djbeatblaster.com/*
          echo "🔗 Creating maintenance routes..."
          for entry in $(echo "$EXTERNAL_MAP" | jq -r '.[]'); do
            for pair in $(echo "$entry" | tr ',' '\n'); do
              svc=$(echo "$pair" | cut -d: -f1)
              PATTERN="dj-panel-${ENV_SLUG}-${svc}.djbeatblaster.com/*"
              ROUTE_DATA=$(jq -n --arg pattern "$PATTERN" --arg script "$WORKER_NAME" '{pattern: $pattern, script: $script}')
              echo "  - Creating route for: $PATTERN"
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
                -H "X-Auth-Email: ${CF_EMAIL}" \
                -H "X-Auth-Key: ${CF_KEY}" \
                -H "Content-Type: application/json" \
                --data "${ROUTE_DATA}" > /dev/null
            done
          done

          echo "✅ Maintenance page enabled for all external service hostnames."
          echo "WORKER_NAME=${WORKER_NAME}" >> "$GITHUB_ENV"

  rolling_update_deployment:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Rolling update with zero downtime
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        generate_and_upload_truenas_compose_file,
        backup_current_state,
        enable_maintenance_page,
      ]
    outputs:
      start_stdout: ${{ steps.rolling_update.outputs.stdout }}
    steps:
      - name: Perform rolling update (databases stay up, services update)
        id: rolling_update
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail

            echo "=========================================="
            echo "🔄 Rolling Update Deployment (Zero Downtime)"
            echo "=========================================="

            base="/mnt/Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}/Images"
            agg="${base}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}.yml"
            new="${{ needs.generate_and_upload_truenas_compose_file.outputs.new_compose_abs }}"
            app="dj-panel-${{ needs.determine_environment.outputs.env_slug }}"

            test -n "$new" && test -f "$new" || { echo "ERROR: new compose $new not found"; exit 1; }

            # Update aggregator to point to new compose
            mkdir -p "$base"
            printf 'include:\n  - %s\n' "$new" > "$agg"
            echo "✅ Updated aggregator -> $agg includes $new"

            # Keep only 3 newest generated compose files for this env
            ls -1 "${base}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}-"*.yml 2>/dev/null \
              | sort -r | awk 'NR>3' | xargs -r rm -f || true

            # Check if app exists and is running
            has_jq() { command -v jq >/dev/null 2>&1; }
            get_state() {
              j="$(midclt call app.query '[["name","=","'"$app"'"]]' 2>/dev/null || echo '[]')"
              if has_jq; then
                echo "$j" | jq -r '.[0] | (.state // .status // empty)' 2>/dev/null | head -n1
              else
                echo "$j" | tr -d '\n' | awk '{
                  s=$0
                  if (match(s, /"state"[[:space:]]*:[[:space:]]*"[^"]*"/)) {
                    m=substr(s, RSTART, RLENGTH)
                    gsub(/.*"state"[[:space:]]*:[[:space:]]*"/, "", m)
                    gsub(/".*$/, "", m)
                    print m
                  }
                }' | head -n1
              fi
            }

            current_state="$(get_state || echo 'NOT_FOUND')"
            echo "Current app state: $current_state"

            if [ "$current_state" = "NOT_FOUND" ] || [ "$current_state" = "STOPPED" ]; then
              echo "📦 First deployment or app stopped - starting app normally"
              if midclt call app.start "$app" 2>/dev/null; then
                echo "✅ Started via app.start"
                # Give TrueNAS time to process the start command
                echo "⏳ Waiting for TrueNAS to begin startup process..."
                sleep 10
              else
                if midclt call chart.release.scale "$app" '{"replica_count":1}' 2>/dev/null; then
                  echo "✅ Scaled to 1 replica"
                  # Give TrueNAS time to process the scale command
                  echo "⏳ Waiting for TrueNAS to begin startup process..."
                  sleep 10
                else
                  echo "❌ ERROR: could not start app '$app'"
                  exit 1
                fi
              fi
            else
              echo "🔄 App is running - performing rolling update"
              echo "ℹ️  TrueNAS will restart containers with new images"
              echo "ℹ️  Databases will remain running throughout"
              
              # Restart app to apply new compose
              if midclt call app.restart "$app" 2>/dev/null; then
                echo "✅ Restarted via app.restart"
                # Give TrueNAS time to process the restart command
                echo "⏳ Waiting for TrueNAS to begin startup process..."
                sleep 10
              else
                echo "ℹ️  Restart not available, using stop/start"
                midclt call app.stop "$app" 2>/dev/null || true
                
                # Wait for STOPPED state (3 minutes timeout)
                echo "⏳ Waiting for app to stop..."
                stop_wait=0
                stop_state="UNKNOWN"
                max_stop_iterations=90
                while [ $stop_wait -lt $max_stop_iterations ]; do
                  stop_state="$(get_state || echo 'UNKNOWN')"
                  [ -z "$stop_state" ] && stop_state="UNKNOWN"
                  echo "  Stop check $((stop_wait+1))/$max_stop_iterations: state=$stop_state"
                  if [ "$stop_state" = "STOPPED" ] || [ "$stop_state" = "NOT_FOUND" ]; then
                    echo "✅ App stopped successfully"
                    break
                  fi
                  sleep 2
                  stop_wait=$((stop_wait+1))
                done
                
                if [ "$stop_state" != "STOPPED" ] && [ "$stop_state" != "NOT_FOUND" ]; then
                  echo "❌ ERROR: App failed to stop after 180 seconds (state=$stop_state)"
                  echo "Cannot proceed with deployment - manual intervention required"
                  exit 1
                fi
                
                if midclt call app.start "$app" 2>/dev/null; then
                  echo "✅ Started via app.start"
                  # Give TrueNAS time to process the start command
                  echo "⏳ Waiting for TrueNAS to begin startup process..."
                  sleep 10
                else
                  echo "❌ ERROR: could not restart app"
                  exit 1
                fi
              fi
            fi

            # Wait for healthy state (10 minutes timeout)
            echo "⏳ Waiting for app to become healthy..."
            is_good_state() {
              case "$1" in
                RUNNING|ACTIVE|DEPLOYED|STARTED|HEALTHY) return 0 ;;
                *) return 1 ;;
              esac
            }

            health_check=0
            max_health_checks=200
            app_state="UNKNOWN"
            while [ $health_check -lt $max_health_checks ]; do
              app_state="$(get_state || echo 'UNKNOWN')"
              [ -z "$app_state" ] && app_state="UNKNOWN"
              echo "  Health check $((health_check+1))/$max_health_checks: state=$app_state"
              if is_good_state "$app_state"; then
                echo "✅ App is healthy and running"
                break
              fi
              sleep 5
              health_check=$((health_check+1))
            done

            if ! is_good_state "$app_state"; then
              echo "❌ ERROR: App failed to reach healthy state after 10 minutes (final state=$app_state)"
              echo "⚠️  Rollback recommended - backup is available in backups directory"
              exit 1
            fi

            echo "=========================================="
            echo "✅ Rolling update completed successfully!"
            echo "✅ Zero downtime maintained"
            echo "=========================================="
            echo "APP_STATE=${app_state}"

  automatic_rollback_on_failure:
    if: ${{ always() && needs.rolling_update_deployment.result == 'failure' }}
    name: Automatic Rollback on Deployment Failure
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        backup_current_state,
        rolling_update_deployment,
      ]
    steps:
      - name: Perform automatic rollback to previous version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            
            echo "=========================================="
            echo "🔄 AUTOMATIC ROLLBACK - Deployment Failed"
            echo "=========================================="
            
            base="/mnt/Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}/Images"
            agg="${base}/dj-panel-${{ needs.determine_environment.outputs.env_slug }}.yml"
            backup_dir="${base}/backups"
            app="dj-panel-${{ needs.determine_environment.outputs.env_slug }}"
            
            # Find most recent backup
            latest_backup=$(ls -1t "$backup_dir"/dj-panel-${{ needs.determine_environment.outputs.env_slug }}-backup-*.yml 2>/dev/null | head -n1)
            
            if [ -z "$latest_backup" ]; then
              echo "❌ ERROR: No backup found for rollback"
              exit 1
            fi
            
            echo "ℹ️  Rolling back to: $latest_backup"
            
            # Restore backup
            cp "$latest_backup" "$agg"
            echo "✅ Restored backup to aggregator"
            
            # Helper function to get app state
            has_jq() { command -v jq >/dev/null 2>&1; }
            get_state() {
              j="$(midclt call app.query '[["name","=","'"$app"'"]]' 2>/dev/null || echo '[]')"
              if has_jq; then
                echo "$j" | jq -r '.[0] | (.state // .status // empty)' 2>/dev/null | head -n1
              else
                echo "$j" | tr -d '\n' | awk '{
                  s=$0
                  if (match(s, /"state"[[:space:]]*:[[:space:]]*"[^"]*"/)) {
                    m=substr(s, RSTART, RLENGTH)
                    gsub(/.*"state"[[:space:]]*:[[:space:]]*"/, "", m)
                    gsub(/".*$/, "", m)
                    print m
                  }
                }' | head -n1
              fi
            }
            
            # Restart app to apply rollback
            echo ""
            echo "🔄 Restarting application to apply rollback..."
            if midclt call app.restart "$app" 2>/dev/null; then
              echo "✅ Restarted via app.restart"
              # Give TrueNAS time to process the restart command
              echo "⏳ Waiting for TrueNAS to begin startup process..."
              sleep 10
            else
              echo "ℹ️  Restart not available, using stop/start"
              midclt call app.stop "$app" 2>/dev/null || true
              sleep 5
              if midclt call app.start "$app" 2>/dev/null; then
                echo "✅ Started via app.start"
                # Give TrueNAS time to process the start command
                echo "⏳ Waiting for TrueNAS to begin startup process..."
                sleep 10
              else
                echo "❌ ERROR: Failed to start app after rollback"
                exit 1
              fi
            fi
            
            # Wait for healthy state (5 minutes timeout for rollback)
            echo ""
            echo "⏳ Verifying rollback health (timeout: 5 minutes)..."
            is_good_state() {
              case "$1" in
                RUNNING|ACTIVE|DEPLOYED|STARTED|HEALTHY) return 0 ;;
                *) return 1 ;;
              esac
            }
            
            health_check=0
            max_health_checks=60
            app_state="UNKNOWN"
            while [ $health_check -lt $max_health_checks ]; do
              app_state="$(get_state || echo 'UNKNOWN')"
              [ -z "$app_state" ] && app_state="UNKNOWN"
              echo "  Health check $((health_check+1))/$max_health_checks: state=$app_state"
              if is_good_state "$app_state"; then
                echo ""
                echo "✅ Rollback successful - app is healthy"
                break
              fi
              sleep 5
              health_check=$((health_check+1))
            done
            
            if ! is_good_state "$app_state"; then
              echo ""
              echo "❌ ERROR: Rollback health check failed (final state=$app_state)"
              echo "⚠️  Manual intervention required"
              exit 1
            fi
            
            echo ""
            echo "=========================================="
            echo "✅ Automatic rollback completed successfully"
            echo "✅ Application restored to previous version"
            echo "=========================================="

  update_cloudflare_tunnel:
    if: ${{ always() && (needs.rolling_update_deployment.result == 'success' || needs.automatic_rollback_on_failure.result == 'success') }}
    name: Update Cloudflare Tunnel (service-based hostnames)
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        generate_and_upload_truenas_compose_file,
        rolling_update_deployment,
        automatic_rollback_on_failure
      ]
    steps:
      - name: Build ingress JSON and PUT to Cloudflare (auto-calc BASE_DOMAIN; preserve other envs)
        id: cf_update
        run: |
          set -euo pipefail

          # --- Inputs / Secrets ---
          TUNNEL_UUID="${{ secrets.CLOUDFLARE_TUNNEL_UUID }}"
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CF_EMAIL="${{ secrets.CLOUDFLARE_EMAIL }}"
          CF_KEY="${{ secrets.CLOUDFLARE_API_KEY }}"
          ENV_SLUG='${{ needs.determine_environment.outputs.env_slug }}'

          HOST_LAN_IP="${{ vars.TRUENAS_LAN_IP }}"
          HOST_LAN_IP="${HOST_LAN_IP:-192.168.1.17}"

          BASE_DOMAIN="${{ vars.BASE_DOMAIN }}"
          BASE_DOMAIN="${BASE_DOMAIN:-}"

          # Derive BASE_DOMAIN if empty
          if [ -z "$BASE_DOMAIN" ]; then
            echo "BASE_DOMAIN not provided; deriving…"
            cfg="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_UUID}/configurations" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}")"
            BASE_DOMAIN="$(echo "$cfg" | jq -r '.result.config.ingress[]?.hostname // empty' \
              | awk -F. 'NF>=2 {print $(NF-1)"."$NF}' \
              | sort | uniq -c | sort -nr | awk 'NR==1{print $2}')"
            if [ -z "$BASE_DOMAIN" ]; then
              echo "ERROR: Could not derive BASE_DOMAIN"; exit 1
            fi
            echo "Derived BASE_DOMAIN from tunnel: $BASE_DOMAIN"
          else
            echo "Using provided BASE_DOMAIN: $BASE_DOMAIN"
          fi

          # External port -> "service:containerPort" from generator
          EXTERNAL_MAP='${{ needs.generate_and_upload_truenas_compose_file.outputs.external_map_json }}'
          if ! echo "$EXTERNAL_MAP" | jq -e . >/dev/null 2>&1; then
            echo "WARN: EXTERNAL_MAP invalid/empty; using {}"
            EXTERNAL_MAP="{}"
          fi
          echo "External map (normalized):"
          echo "$EXTERNAL_MAP" | jq .

          # Build env-scoped dynamic ingress
          DYN=$(echo "$EXTERNAL_MAP" | jq -c --arg env "$ENV_SLUG" --arg base "$BASE_DOMAIN" --arg ip "$HOST_LAN_IP" '
            to_entries
            | map({
                hostname: ("dj-panel-" + $env + "-" + (.value | split(":")[0]) + "." + $base),
                service: ("http://" + $ip + ":" + .key)
              })
          ')

          # Fetch current config to preserve non-env hostnames
          CURRENT="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_UUID}/configurations" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}")"
          KEEP=$(echo "$CURRENT" | jq -c --arg env "$ENV_SLUG" '
            .result.config.ingress
            | map(select(.hostname? != null))
            | map(select(.hostname | test("^dj-panel-" + $env + "-"; "i") | not))
          ')

          # Merge KEEP + DYN + 404
          INGRESS=$(jq -c --argjson keep "$KEEP" --argjson dyn "$DYN" -n '$keep + $dyn + [{"service":"http_status:404"}]')
          echo "Proposed ingress (service-based, preserving other envs):"
          echo "$INGRESS" | jq .

          BODY=$(jq -c --argjson ing "$INGRESS" -n '{config:{ingress:$ing, "warp-routing":{"enabled":true}}}')
          echo "$BODY" > body.json

          echo "PUT to Cloudflare Tunnel configuration…"
          resp=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_UUID}/configurations" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            --data-binary @body.json)

          echo "Cloudflare response body:"
          echo "$resp" | jq .

          ok=$(echo "$resp" | jq -r '.success')
          if [ "$ok" != "true" ]; then
            code=$(echo "$resp" | jq -r '.errors[0].code // empty')
            msg=$(echo "$resp" | jq -r '.errors[0].message // empty')
            echo "ERROR: Cloudflare update failed: code=${code:-?} message=${msg:-?}"
            exit 1
          fi
          echo "Cloudflare Tunnel configuration updated successfully."

  disable_maintenance_page:
    if: ${{ always() && (needs.rolling_update_deployment.result == 'success' || needs.automatic_rollback_on_failure.result == 'success') }}
    name: Disable Cloudflare Maintenance Page
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        enable_maintenance_page,
        rolling_update_deployment,
        automatic_rollback_on_failure,
        update_cloudflare_tunnel,
        generate_and_upload_truenas_compose_file,
      ]
    steps:
      - name: Disable Cloudflare maintenance mode for all external service hostnames
        run: |
          echo "🔧 Disabling maintenance page on Cloudflare..."

          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CF_EMAIL="${{ secrets.CLOUDFLARE_EMAIL }}"
          CF_KEY="${{ secrets.CLOUDFLARE_API_KEY }}"
          ZONE_ID="${{ secrets.CLOUDFLARE_ZONE_ID }}"
          ENV_SLUG="${{ needs.determine_environment.outputs.env_slug }}"
          EXTERNAL_MAP='${{ needs.generate_and_upload_truenas_compose_file.outputs.external_map_json }}'

          # Get routes
          echo "🔍 Fetching existing routes..."
          ROUTES=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json")

          # For each external service, delete the route for dj-panel-{env_slug}-{service}.djbeatblaster.com/*
          echo "🗑️  Deleting maintenance routes..."
          for entry in $(echo "$EXTERNAL_MAP" | jq -r '.[]'); do
            for pair in $(echo "$entry" | tr ',' '\n'); do
              svc=$(echo "$pair" | cut -d: -f1)
              PATTERN="dj-panel-${ENV_SLUG}-${svc}.djbeatblaster.com/*"
              ROUTE_ID=$(echo "$ROUTES" | jq -r ".result[] | select(.pattern == \"$PATTERN\") | .id")
              if [ -n "$ROUTE_ID" ] && [ "$ROUTE_ID" != "null" ]; then
                echo "  - Deleting route: $ROUTE_ID ($PATTERN)"
                curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${ROUTE_ID}" \
                  -H "X-Auth-Email: ${CF_EMAIL}" \
                  -H "X-Auth-Key: ${CF_KEY}" \
                  -H "Content-Type: application/json" > /dev/null
                echo "    ✅ Deleted"
              else
                echo "  ℹ️  No maintenance route found for $PATTERN"
              fi
            done
          done

          # Optional: Delete the worker script itself
          echo "🗑️  Deleting worker script..."
          WORKER_NAME="maintenance-page-${ENV_SLUG}"
          response=$(curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json")
          
          if echo "$response" | jq -e '.success' > /dev/null 2>&1; then
            echo "✅ Worker script deleted"
          else
            echo "ℹ️  Worker already deleted or not found"
          fi
          
          echo "✅ Maintenance page fully disabled"

  update_cloudflare_dns_records:
    if: ${{ always() && (needs.rolling_update_deployment.result == 'success' || needs.automatic_rollback_on_failure.result == 'success') }}
    name: Ensure Cloudflare DNS CNAMEs for tunnel hostnames
    runs-on: ubuntu-latest
    needs:
      [
        update_cloudflare_tunnel,
        determine_environment,
        generate_and_upload_truenas_compose_file,
        rolling_update_deployment,
        automatic_rollback_on_failure,
      ]
    steps:
      - name: Create/Update DNS CNAMEs for service FQDNs (env-scoped)
        run: |
          set -euo pipefail

          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CF_EMAIL="${{ secrets.CLOUDFLARE_EMAIL }}"
          CF_KEY="${{ secrets.CLOUDFLARE_API_KEY }}"
          TUNNEL_UUID="${{ secrets.CLOUDFLARE_TUNNEL_UUID }}"
          ENV_SLUG='${{ needs.determine_environment.outputs.env_slug }}'

          HOST_LAN_IP="${{ vars.TRUENAS_LAN_IP }}"
          HOST_LAN_IP="${HOST_LAN_IP:-192.168.1.17}"

          BASE_DOMAIN="${{ vars.BASE_DOMAIN }}"
          BASE_DOMAIN="${BASE_DOMAIN:-}"

          # Derive BASE_DOMAIN if not provided
          if [ -z "$BASE_DOMAIN" ]; then
            echo "BASE_DOMAIN not provided; deriving…"
            cfg="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_UUID}/configurations" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}")"
            BASE_DOMAIN="$(echo "$cfg" | jq -r '.result.config.ingress[]?.hostname // empty' \
              | awk -F. 'NF>=2 {print $(NF-1)"."$NF}' \
              | sort | uniq -c | sort -nr | awk 'NR==1{print $2}')"
            if [ -z "$BASE_DOMAIN" ]; then
              echo "ERROR: Could not derive BASE_DOMAIN"; exit 1
            fi
            echo "Derived BASE_DOMAIN from tunnel: $BASE_DOMAIN"
          else
            echo "Using provided BASE_DOMAIN: $BASE_DOMAIN"
          fi

          # Zone id
          ZONE_ID="$(curl -sS -G "https://api.cloudflare.com/client/v4/zones" \
            --data-urlencode "name=${BASE_DOMAIN}" --data-urlencode "status=active" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" | jq -r '.result[0].id')"
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "null" ]; then
            echo "ERROR: Zone not found for ${BASE_DOMAIN}"
            exit 1
          fi

          # External map from generator
          EXTERNAL_MAP='${{ needs.generate_and_upload_truenas_compose_file.outputs.external_map_json }}'
          if ! echo "$EXTERNAL_MAP" | jq -e . >/dev/null 2>&1; then
            echo "WARN: EXTERNAL_MAP invalid/empty; using {}"
            EXTERNAL_MAP="{}"
          fi

          # Build desired env-scoped FQDNs from EXTERNAL_MAP
          DYNAMIC_FQDNS=$(echo "$EXTERNAL_MAP" | jq -c --arg env "$ENV_SLUG" --arg base "$BASE_DOMAIN" '
            to_entries
            | map("dj-panel-" + $env + "-" + (.value | split(":")[0]) + "." + $base)
          ')
          echo "Desired env FQDNs:"
          echo "$DYNAMIC_FQDNS" | jq .

          # Convert to left-label names for DNS record "name" field
          ALL_LABELS=$(echo "$DYNAMIC_FQDNS" | jq -c --arg base "$BASE_DOMAIN" '
            map( sub("\\."+($base|gsub("\\."; "\\."))+"$"; "") )
          ')
          echo "DNS record names (left labels):"
          echo "$ALL_LABELS" | jq .

          TARGET="${TUNNEL_UUID}.cfargotunnel.com"

          create_or_update() {
            label="$1"
            rec="$(curl -sS -G "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              --data-urlencode "type=CNAME" \
              --data-urlencode "name=${label}.${BASE_DOMAIN}" \
              -H "X-Auth-Email: ${CF_EMAIL}" \
              -H "X-Auth-Key: ${CF_KEY}")"
            rid="$(echo "$rec" | jq -r '.result[0].id // empty')"
            if [ -n "$rid" ]; then
              cur_content="$(echo "$rec" | jq -r '.result[0].content')"
              cur_proxied="$(echo "$rec" | jq -r '.result[0].proxied')"
              if [ "$cur_content" != "$TARGET" ] || [ "$cur_proxied" != "true" ]; then
                echo "Updating ${label} -> ${TARGET} (proxied=true)"
                if ! curl -sS -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${rid}" \
                  -H "Content-Type: application/json" \
                  -H "X-Auth-Email: ${CF_EMAIL}" \
                  -H "X-Auth-Key: ${CF_KEY}" \
                  --data-binary "$(jq -c --arg name "$label" --arg content "$TARGET" -n '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')" \
                  | jq -e '.success' >/dev/null; then
                  echo "ERROR: update failed for $label"; exit 1
                fi
              else
                echo "OK (unchanged): ${label}"
              fi
            else
              echo "Creating ${label} -> ${TARGET} (proxied=true)"
              if ! curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
                -H "Content-Type: application/json" \
                -H "X-Auth-Email: ${CF_EMAIL}" \
                -H "X-Auth-Key: ${CF_KEY}" \
                --data-binary "$(jq -c --arg name "$label" --arg content "$TARGET" -n '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')" \
                | jq -e '.success' >/dev/null; then
                echo "ERROR: create failed for $label"; exit 1
              fi
            fi
          }

          for label in $(echo "$ALL_LABELS" | jq -r '.[]'); do
            create_or_update "$label"
          done

          echo "DNS sync (env-scoped) complete."

  deployment_summary:
    if: ${{ always() }}
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs:
      - determine_docker_tag
      - determine_compose_timestamp
      - determine_environment
      - rolling_update_deployment
      - automatic_rollback_on_failure
      - update_cloudflare_tunnel
      - update_cloudflare_dns_records
    steps:
      - name: Summary
        run: |
          set -euo pipefail
          echo "=========================================="
          if [ "${{ needs.rolling_update_deployment.result }}" = "success" ]; then
            echo "  🎉 Zero-Downtime Deployment Complete!"
          elif [ "${{ needs.automatic_rollback_on_failure.result }}" = "success" ]; then
            echo "  🔄 Deployment Failed - Automatic Rollback Successful"
          else
            echo "  ❌ Deployment Failed"
          fi
          echo "=========================================="
          echo ""
          echo "📦 Docker Image:"
          echo "   Tag: ${{ needs.determine_docker_tag.outputs.docker_tag }}"
          echo "   Latest: ${{ needs.determine_docker_tag.outputs.latest_tag }}"
          echo ""
          echo "🌍 Environment:"
          echo "   Name: ${{ needs.determine_environment.outputs.current_env }}"
          echo "   Slug: ${{ needs.determine_environment.outputs.env_slug }}"
          echo ""
          echo "🔄 Deployment Strategy: Rolling Update"
          echo "   Databases: Remained running (shared)"
          echo "   Services: Updated with health checks"
          echo ""
          echo "✅ Status:"
          echo "   Rolling Update: ${{ needs.rolling_update_deployment.result }}"
          echo "   Automatic Rollback: ${{ needs.automatic_rollback_on_failure.result }}"
          echo "   Cloudflare Tunnel: ${{ needs.update_cloudflare_tunnel.result }}"
          echo "   DNS Records: ${{ needs.update_cloudflare_dns_records.result }}"
          echo ""
          echo "📄 Compose File: ${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          echo ""
          echo "=========================================="
          if [ "${{ needs.rolling_update_deployment.result }}" = "success" ]; then
            echo "✨ ZERO DOWNTIME ACHIEVED ✨"
          elif [ "${{ needs.automatic_rollback_on_failure.result }}" = "success" ]; then
            echo "⚠️  DEPLOYMENT ROLLED BACK - INVESTIGATE FAILURE"
          else
            echo "❌ DEPLOYMENT FAILED - MANUAL INTERVENTION REQUIRED"
          fi
          echo "=========================================="
