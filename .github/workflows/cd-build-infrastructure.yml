name: Build TrueNAS Infrastructure

on:
  workflow_dispatch:

jobs:
  determine_environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      current_env: ${{ steps.set_env.outputs.current_env }}
      env_slug: ${{ steps.slug.outputs.env_slug }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set Environment
        id: set_env
        uses: ./.github/templates/determine-environment

      - name: Compute env slug
        id: slug
        run: |
          set -euo pipefail
          env_raw='${{ steps.set_env.outputs.current_env }}'
          env_slug=$(printf '%s' "$env_raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          echo "env_slug=$env_slug" >> "$GITHUB_OUTPUT"

  stop_app:
    name: Stop app on TrueNAS
    runs-on: ubuntu-latest
    needs: [determine_environment]
    outputs:
      app_name: ${{ steps.mark.outputs.app_name }}
    steps:
      - name: Stop app and wait until not ACTIVE/DEPLOYING
        id: stop
        uses: appleboy/ssh-action@v1
        env:
          APP_NAME: dj-panel-${{ needs.determine_environment.outputs.env_slug }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: APP_NAME
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            name="${APP_NAME}"
            echo "Stopping app: $name"
            if midclt call app.stop "$name" 2>/dev/null; then
              echo "Stopped via app.stop"
            else
              echo "app.stop not available; trying chart.release.scale -> 0"
              midclt call chart.release.scale "$name" '{"replica_count":0}' 2>/dev/null || true
            fi

            # Wait using grep/sed (no jq dependency on TrueNAS host)
            i=0; max=60
            while [ $i -lt $max ]; do
              state="$(midclt call app.query '[["name","=","'"$name"'"]]' 2>/dev/null \
                | tr -d '\n' \
                | sed -n 's/.*"state"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
              printf "state=%s (t=%ss)\n" "${state:-unknown}" "$i"
              case "${state:-}" in
                ACTIVE|DEPLOYING) sleep 3 ;;
                *) break ;;
              esac
              i=$((i+3))
            done
            echo "STATE_AFTER_STOP=${state:-unknown}"

      - name: Mark app name
        id: mark
        run: echo "app_name=dj-panel-${{ needs.determine_environment.outputs.env_slug }}" >> "$GITHUB_OUTPUT"

  get_truenas_ports:
    name: Get TrueNAS Ports (after stop)
    runs-on: ubuntu-latest
    needs: [stop_app]
    outputs:
      ports: ${{ steps.get_netstat_ports.outputs.stdout }}
    steps:
      - name: Get Netstat Listening Ports
        id: get_netstat_ports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            netstat -tuln 2>/dev/null \
              | awk 'NR>2 {print $4}' \
              | sed -E 's/.*:([0-9]+)$/\1/' \
              | grep -E '^[0-9]+$' \
              | sort -n | uniq

  calculate_unused_ports:
    name: Calculate Unused External and Internal Ports (TrueNAS only)
    runs-on: ubuntu-latest
    needs: [get_truenas_ports]
    outputs:
      external_ports: ${{ steps.calculate_external_ports.outputs.unused_ports }}
      internal_ports: ${{ steps.calculate_internal_ports.outputs.unused_ports }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Calculate unused internal ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_internal_ports
        with:
          start_port: 40000
          end_port: 50000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: "" # ignore Cloudflare

      - name: Calculate unused external ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_external_ports
        with:
          start_port: 50000
          end_port: 60000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: "" # ignore Cloudflare

  determine_docker_tag:
    name: Determine Docker Tag
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag_set.outputs.docker_tag }}
      latest_tag: ${{ steps.tag_set.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: tag_set
        uses: ./.github/templates/determine-docker-tag

  determine_compose_timestamp:
    name: Determine Compose File Timestamp
    runs-on: ubuntu-latest
    outputs:
      compose_timestamp: ${{ steps.timestamp_set.outputs.compose_timestamp }}
      compose_file_name: ${{ steps.timestamp_set.outputs.compose_file_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: timestamp_set
        uses: ./.github/templates/determine-compose-timestamp

  generate_and_upload_compose:
    name: Generate & Upload Compose, point aggregator
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        calculate_unused_ports,
        determine_docker_tag,
        determine_compose_timestamp,
      ]
    outputs:
      new_compose_abs: ${{ steps.parse_upload.outputs.new_compose_abs }}
      external_ports_map: ${{ steps.gen.outputs.external_ports_map }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install yq (runner)
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Generate New Compose File
        id: gen
        env:
          LOG_LEVEL: DEBUG
        run: |
          set -euo pipefail
          chmod +x .github/scripts/generate-compose-file.sh
          output_file="${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          external_map_json=$(.github/scripts/generate-compose-file.sh \
            "${{ needs.calculate_unused_ports.outputs.internal_ports }}" \
            "${{ needs.calculate_unused_ports.outputs.external_ports }}" \
            "${{ needs.determine_docker_tag.outputs.docker_tag }}" \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}" \
            "$output_file")

          # multiline-safe output
          delim="EOF_$RANDOM"
          {
            echo "external_ports_map<<$delim"
            printf '%s\n' "$external_map_json"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "compose_file=$output_file" >> "$GITHUB_OUTPUT"

      - name: Package compose file (base64)
        id: package
        run: |
          set -euo pipefail
          COMPOSE_FILE='${{ steps.gen.outputs.compose_file }}'
          test -f "$COMPOSE_FILE" || { echo "Compose not found: $COMPOSE_FILE" >&2; exit 1; }
          B64=$(base64 -w0 "$COMPOSE_FILE")
          echo "compose_name=$COMPOSE_FILE" >> "$GITHUB_OUTPUT"
          echo "compose_b64=$B64" >> "$GITHUB_OUTPUT"

      - name: Upload compose to TrueNAS Images dataset
        id: upload
        uses: appleboy/ssh-action@v1
        env:
          TRUENAS_POOL: Files
          CURRENT_ENV: ${{ needs.determine_environment.outputs.current_env }}
          COMPOSE_NAME: ${{ steps.package.outputs.compose_name }}
          COMPOSE_B64: ${{ steps.package.outputs.compose_b64 }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: TRUENAS_POOL,CURRENT_ENV,COMPOSE_NAME,COMPOSE_B64
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            runroot() { if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ]; then sudo "$@"; else "$@"; fi; }
            POOL="${TRUENAS_POOL:-Files}"
            ENV_DIR="${CURRENT_ENV:-Development}"
            DST_DIR="/mnt/$POOL/Apps/DJPanel/${ENV_DIR}/Images"
            runroot mkdir -p "$DST_DIR"
            DST_NAME="${COMPOSE_NAME##*/}"
            DST_PATH="$DST_DIR/$DST_NAME"
            printf '%s' "$COMPOSE_B64" | base64 -d > "$DST_PATH"
            chmod 664 "$DST_PATH" || true
            echo "COMPOSE_ABS=$DST_PATH"

      - name: Parse upload path
        id: parse_upload
        run: |
          set -euo pipefail
          abs=$(echo '${{ steps.upload.outputs.stdout }}' | awk -F= '/^COMPOSE_ABS=/{print $2}' | tail -n1)
          test -n "$abs" || { echo "No COMPOSE_ABS marker found"; exit 1; }
          echo "new_compose_abs=$abs" >> "$GITHUB_OUTPUT"

      - name: Point aggregator compose to newest only
        uses: appleboy/ssh-action@v1
        env:
          TRUENAS_POOL: Files
          CURRENT_ENV: ${{ needs.determine_environment.outputs.current_env }}
          ENV_SLUG: ${{ needs.determine_environment.outputs.env_slug }}
          NEW_COMPOSE_ABS: ${{ steps.parse_upload.outputs.new_compose_abs }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: TRUENAS_POOL,CURRENT_ENV,ENV_SLUG,NEW_COMPOSE_ABS
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            name="dj-panel-${ENV_SLUG}"
            base="/mnt/${TRUENAS_POOL}/Apps/DJPanel/${CURRENT_ENV}/Images"
            agg="${base}/${name}.yml"
            mkdir -p "$base"
            printf 'include:\n  - %s\n' "$NEW_COMPOSE_ABS" > "$agg"
            echo "Updated $agg to include $NEW_COMPOSE_ABS"

  start_app:
    name: Start app on TrueNAS
    runs-on: ubuntu-latest
    needs: [determine_environment, generate_and_upload_compose]
    steps:
      - name: Start app and wait until ACTIVE
        uses: appleboy/ssh-action@v1
        env:
          APP_NAME: dj-panel-${{ needs.determine_environment.outputs.env_slug }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: APP_NAME
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            name="${APP_NAME}"
            echo "Starting app: $name"
            if midclt call app.start "$name" 2>/dev/null; then
              echo "Started via app.start"
            else
              echo "app.start not available; trying chart.release.scale -> 1"
              midclt call chart.release.scale "$name" '{"replica_count":1}' 2>/dev/null || true
            fi

            # Wait until ACTIVE (no jq; grep/sed)
            i=0; max=120
            while [ $i -lt $max ]; do
              state="$(midclt call app.query '[["name","=","'"$name"'"]]' 2>/dev/null \
                | tr -d '\n' \
                | sed -n 's/.*"state"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
              printf "state=%s (t=%ss)\n" "${state:-unknown}" "$i"
              [ "${state:-}" = "ACTIVE" ] && break
              sleep 3
              i=$((i+3))
            done
            echo "STATE_AFTER_START=${state:-unknown}"

  update_cloudflare_tunnel:
    name: Update Cloudflare Tunnel (service-based hostnames)
    runs-on: ubuntu-latest
    needs: [determine_environment, generate_and_upload_compose]
    steps:
      - name: Build ingress JSON and PUT to Cloudflare
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_UUID }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          EXTERNAL_MAP: ${{ needs.generate_and_upload_compose.outputs.external_ports_map }}
          ENV_SLUG: ${{ needs.determine_environment.outputs.env_slug }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          TRUENAS_IP: ${{ vars.TRUENAS_IP }}
        run: |
          set -euo pipefail

          : "${BASE_DOMAIN:=djbeatblaster.com}"
          : "${TRUENAS_IP:=192.168.1.17}"
          : "${ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID}"
          : "${TUNNEL_ID:?Missing CLOUDFLARE_TUNNEL_UUID}"
          : "${CF_EMAIL:?Missing CLOUDFLARE_EMAIL}"
          : "${CF_KEY:?Missing CLOUDFLARE_API_KEY}"

          # Expand (no single quotes!), default to {}
          ext="${EXTERNAL_MAP:-{}}"
          # Trim leading/trailing whitespace
          ext="$(printf '%s' "$ext" | awk 'BEGIN{ORS="";} {print} END{print ""}')"
          if [ -z "$ext" ] || ! echo "$ext" | jq -e . >/dev/null 2>&1; then
            echo "WARN: EXTERNAL_MAP is empty/invalid, using {}"
            ext="{}"
          fi

          echo "External map (normalized):"
          echo "$ext" | jq .

          static_ingress=$(cat <<JSON
          [
            {"hostname":"truenas.${BASE_DOMAIN}","service":"http://${TRUENAS_IP}"},
            {"hostname":"cas.${BASE_DOMAIN}","service":"http://${TRUENAS_IP}:50000"},
            {"hostname":"home.${BASE_DOMAIN}","service":"http://${TRUENAS_IP}:50001"},
            {"hostname":"nextcloud.${BASE_DOMAIN}","service":"http://${TRUENAS_IP}:50002"},
            {"hostname":"grocy.${BASE_DOMAIN}","service":"http://${TRUENAS_IP}:50003"},
            {"hostname":"mqtt.${BASE_DOMAIN}","service":"http://${TRUENAS_IP}:50004"},
            {"hostname":"mealie.${BASE_DOMAIN}","service":"http://${TRUENAS_IP}:50005"},
            {"hostname":"esp.${BASE_DOMAIN}","service":"http://${TRUENAS_IP}:50006"},
            {"hostname":"n8n.${BASE_DOMAIN}","service":"http://${TRUENAS_IP}:50007"}
          ]
          JSON
          )

          dj_ingress=$(jq -c --arg ip "$TRUENAS_IP" --arg env "$ENV_SLUG" --arg dom "$BASE_DOMAIN" '
            (try (.) catch {}) as $m
            | ($m|type=="object") as $ok
            | if $ok then
                ($m | to_entries
                | map({
                    hostname: ("dj-panel-\($env)-" + (.value | split(":")[0]) + "." + $dom),
                    service: ("http://\($ip):" + .key)
                  }))
              else [] end
          ' <<< "$ext")

          combined=$(jq -c --argjson s "$static_ingress" --argjson d "${dj_ingress:-[]}" '
            ($s + $d + [{"service":"http_status:404"}])
          ' <<<'{}')

          echo "Proposed ingress (service-based hostnames):"
          echo "$combined" | jq .

          body=$(jq -c --argjson ing "$combined" '{config: {ingress: $ing}}' <<<'{}')
          echo "$body" > body.json
          test -s body.json || { echo "ERROR: body.json is empty."; exit 1; }

          resp=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_ID}/configurations" \
            -H "Content-Type: application/json" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            --data @body.json)

          echo "Cloudflare response body:"
          echo "$resp" | jq .

          ok=$(echo "$resp" | jq -r '.success')
          if [ "$ok" != "true" ]; then
            code=$(echo "$resp" | jq -r '.errors[0].code // empty')
            msg=$(echo "$resp" | jq -r '.errors[0].message // "Unknown error"')
            echo "Cloudflare error: code=${code} message=${msg}" >&2
            exit 1
          fi
          echo "Cloudflare Tunnel configuration updated successfully."

  deployment_summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs:
      [
        determine_docker_tag,
        determine_compose_timestamp,
        determine_environment,
        stop_app,
        get_truenas_ports,
        calculate_unused_ports,
        generate_and_upload_compose,
        start_app,
        update_cloudflare_tunnel,
      ]
    steps:
      - name: Summary
        run: |
          echo "=== TrueNAS DJ Panel Deployment Summary ==="
          echo "Docker Tag: ${{ needs.determine_docker_tag.outputs.docker_tag }}"
          echo "Latest Tag: ${{ needs.determine_docker_tag.outputs.latest_tag }}"
          echo "Compose File: ${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          echo "Environment: ${{ needs.determine_environment.outputs.current_env }}"
          echo "Env Slug: ${{ needs.determine_environment.outputs.env_slug }}"
          echo "App: dj-panel-${{ needs.determine_environment.outputs.env_slug }}"
          echo "New compose absolute: ${{ needs.generate_and_upload_compose.outputs.new_compose_abs }}"
          echo "External map: ${{ needs.generate_and_upload_compose.outputs.external_ports_map }}"
