name: Build TrueNAS Infrastructure

on:
  workflow_dispatch:

jobs:
  determine_environment:
    runs-on: ubuntu-latest
    outputs:
      current_env: ${{ steps.set_env.outputs.current_env }}
      env_slug: ${{ steps.slug.outputs.env_slug }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: set_env
        uses: ./.github/templates/determine-environment
      - id: slug
        run: |
          set -euo pipefail
          env_raw='${{ steps.set_env.outputs.current_env }}'
          env_slug=$(printf '%s' "$env_raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          echo "env_slug=$env_slug" >> "$GITHUB_OUTPUT"

  stop_app:
    name: Stop TrueNAS app (and wait)
    runs-on: ubuntu-latest
    needs: [determine_environment]
    outputs:
      app_name: ${{ steps.parse_app.outputs.app_name }}
    steps:
      - name: Stop & wait for stop (remote)
        id: stop_remote
        uses: appleboy/ssh-action@v1
        env:
          APP_NAME: dj-panel-${{ needs.determine_environment.outputs.env_slug }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: APP_NAME
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            name="${APP_NAME}"

            echo "Stopping app: $name"
            if midclt call app.stop "$name" 2>/dev/null; then
              echo "Stopped via app.stop"
            else
              echo "app.stop not available; trying chart.release.scale -> 0"
              if midclt call chart.release.scale "$name" '{"replica_count":0}' 2>/dev/null; then
                echo "Scaled to 0 replicas"
              else
                echo "WARN: could not stop app '$name' with known methods."
              fi
            fi

            get_state() {
              midclt call app.query '[["name","=","'"$name"'"]]' 2>/dev/null \
                | tr -d '\n' \
                | sed -n 's/.*"state"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
            }

            i=0
            st=""
            while [ $i -lt 60 ]; do
              st="$(get_state || true)"
              [ "$st" = "STOPPED" ] && break
              sleep 5
              i=$((i+1))
            done
            echo "App state after stop: ${st:-unknown}"

            # Emit a marker for the runner to parse:
            echo "APP_NAME=$name"

      - name: Parse remote output
        id: parse_app
        run: |
          set -euo pipefail
          out='${{ steps.stop_remote.outputs.stdout }}'
          echo "---- stop_remote stdout ----"
          printf '%s\n' "$out"
          app=$(echo "$out" | awk -F= '/^APP_NAME=/{print $2}' | tail -n1)
          test -n "$app" || { echo "Failed to detect APP_NAME marker in SSH output"; exit 1; }
          echo "app_name=$app" >> "$GITHUB_OUTPUT"

  get_truenas_ports_after_stop:
    name: Get TrueNAS Ports (post-stop)
    runs-on: ubuntu-latest
    needs: [stop_app]
    outputs:
      ports: ${{ steps.get_netstat_ports.outputs.stdout }}
    steps:
      - name: Get Netstat Listening Ports
        id: get_netstat_ports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            netstat -tuln 2>/dev/null \
              | awk 'NR>2 {print $4}' \
              | sed -E 's/.*:([0-9]+)$/\1/' \
              | grep -E '^[0-9]+$' \
              | sort -n | uniq

  determine_target_branch:
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.branch_set.outputs.target_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: branch_set
        uses: ./.github/templates/determine-target-branch

  determine_docker_tag:
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag_set.outputs.docker_tag }}
      latest_tag: ${{ steps.tag_set.outputs.latest_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: tag_set
        uses: ./.github/templates/determine-docker-tag

  determine_compose_timestamp:
    runs-on: ubuntu-latest
    outputs:
      compose_timestamp: ${{ steps.timestamp_set.outputs.compose_timestamp }}
      compose_file_name: ${{ steps.timestamp_set.outputs.compose_file_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: timestamp_set
        uses: ./.github/templates/determine-compose-timestamp

  calculate_unused_ports:
    name: Calculate Unused External and Internal Ports (TrueNAS only)
    runs-on: ubuntu-latest
    needs: [get_truenas_ports_after_stop]
    outputs:
      external_ports: ${{ steps.calculate_external_ports.outputs.unused_ports }}
      internal_ports: ${{ steps.calculate_internal_ports.outputs.unused_ports }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Calculate unused internal ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_internal_ports
        with:
          start_port: 40000
          end_port: 50000
          truenas_ports: ${{ needs.get_truenas_ports_after_stop.outputs.ports }}
          tunnel_ports: ""
      - name: Calculate unused external ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_external_ports
        with:
          start_port: 50000
          end_port: 60000
          truenas_ports: ${{ needs.get_truenas_ports_after_stop.outputs.ports }}
          tunnel_ports: ""

  generate_and_upload_truenas_compose_file:
    name: Generate and Upload Compose Fragment
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        determine_docker_tag,
        determine_compose_timestamp,
        calculate_unused_ports,
      ]
    outputs:
      new_compose_abs: ${{ steps.parse_upload.outputs.new_compose_abs }}
      new_compose_abs_std: ${{ steps.parse_upload.outputs.new_compose_abs_std }}
      external_ports_map: ${{ steps.generate_compose_file.outputs.external_ports_map }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install yq (runner)
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Generate New Compose File
        id: generate_compose_file
        shell: bash
        env:
          LOG_LEVEL: DEBUG
        run: |
          set -euxo pipefail
          chmod +x .github/scripts/generate-compose-file.sh

          output_file="${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          external_map_json=$(.github/scripts/generate-compose-file.sh \
            "${{ needs.calculate_unused_ports.outputs.internal_ports }}" \
            "${{ needs.calculate_unused_ports.outputs.external_ports }}" \
            "${{ needs.determine_docker_tag.outputs.docker_tag }}" \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}" \
            "$output_file")

          echo "external_ports_map=$external_map_json" >> "$GITHUB_OUTPUT"
          echo "compose_file=$output_file" >> "$GITHUB_OUTPUT"

      - name: Package compose file for transfer (base64)
        id: package_compose
        run: |
          set -euo pipefail
          COMPOSE_FILE="${{ steps.generate_compose_file.outputs.compose_file }}"
          test -f "$COMPOSE_FILE" || { echo "Compose file not found: $COMPOSE_FILE" >&2; exit 1; }
          B64=$(base64 -w0 "$COMPOSE_FILE")
          echo "compose_name=$COMPOSE_FILE" >> "$GITHUB_OUTPUT"
          echo "compose_b64=$B64" >> "$GITHUB_OUTPUT"

      - name: Upload compose fragment to TrueNAS (and make std-named copy)
        id: upload_compose
        uses: appleboy/ssh-action@v1
        env:
          TRUENAS_POOL: Files
          CURRENT_ENV: ${{ needs.determine_environment.outputs.current_env }}
          ENV_SLUG: ${{ needs.determine_environment.outputs.env_slug }}
          COMPOSE_NAME: ${{ steps.package_compose.outputs.compose_name }}
          COMPOSE_B64: ${{ steps.package_compose.outputs.compose_b64 }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: TRUENAS_POOL,CURRENT_ENV,ENV_SLUG,COMPOSE_NAME,COMPOSE_B64
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            POOL="${TRUENAS_POOL}"
            ENV_DIR="${CURRENT_ENV}"
            DST_DIR="/mnt/${POOL}/Apps/DJPanel/${ENV_DIR}/Images"
            DST_NAME="${COMPOSE_NAME##*/}"
            DST_PATH="${DST_DIR}/${DST_NAME}"
            mkdir -p "$DST_DIR"
            printf '%s' "$COMPOSE_B64" | base64 -d > "$DST_PATH"
            chmod 664 "$DST_PATH" || true

            # Derive timestamp from source filename (works for ...composer-YYYYMMDD-HHMMSS.yml)
            TS=$(echo "$DST_NAME" | sed -n 's/.*-\([0-9]\{8\}-[0-9]\{6\}\)\.yml$/\1/p')
            if [ -z "$TS" ]; then
              # Fallback to current time if pattern unexpected
              TS=$(date +%Y%m%d-%H%M%S)
            fi
            STD_NAME="dj-panel-${ENV_SLUG}-${TS}.yml"
            STD_PATH="${DST_DIR}/${STD_NAME}"
            cp -f "$DST_PATH" "$STD_PATH"

            echo "COMPOSE_ABS=$DST_PATH"
            echo "COMPOSE_ABS_STD=$STD_PATH"

      - name: Parse upload paths (output)
        id: parse_upload
        run: |
          set -euo pipefail
          out='${{ steps.upload_compose.outputs.stdout }}'
          abs=$(echo "$out" | awk -F= '/^COMPOSE_ABS=/{print $2}' | tail -n1)
          abs_std=$(echo "$out" | awk -F= '/^COMPOSE_ABS_STD=/{print $2}' | tail -n1)
          test -n "$abs" && echo "new_compose_abs=$abs" >> "$GITHUB_OUTPUT"
          test -n "$abs_std" && echo "new_compose_abs_std=$abs_std" >> "$GITHUB_OUTPUT"

  update_aggregator_include:
    name: Update aggregator include (standardized file)
    runs-on: ubuntu-latest
    needs: [determine_environment, generate_and_upload_truenas_compose_file]
    outputs:
      updated_app: ${{ steps.parse.outputs.updated_app }}
    steps:
      - name: Update aggregator with newest only
        id: update
        uses: appleboy/ssh-action@v1
        env:
          TRUENAS_POOL: Files
          CURRENT_ENV: ${{ needs.determine_environment.outputs.current_env }}
          ENV_SLUG: ${{ needs.determine_environment.outputs.env_slug }}
          NEW_COMPOSE_ABS_STD: ${{ needs.generate_and_upload_truenas_compose_file.outputs.new_compose_abs_std }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: TRUENAS_POOL,CURRENT_ENV,ENV_SLUG,NEW_COMPOSE_ABS_STD
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            BASE="/mnt/${TRUENAS_POOL}/Apps/DJPanel/${CURRENT_ENV}/Images"
            AGG="${BASE}/dj-panel-${ENV_SLUG}.yml"
            NEW="${NEW_COMPOSE_ABS_STD}"

            test -n "$NEW" || { echo "ERROR: NEW_COMPOSE_ABS_STD empty"; exit 1; }
            mkdir -p "$BASE"

            {
              echo "include:"
              echo "  - ${NEW}"
            } > "$AGG"

            echo "UPDATED_APP=dj-panel-${ENV_SLUG}"

      - id: parse
        run: |
          set -euo pipefail
          out='${{ steps.update.outputs.stdout }}'
          updated=$(echo "$out" | awk -F= '/^UPDATED_APP=/{print $2}' | tail -n1)
          test -n "$updated" || { echo "No UPDATED_APP marker found"; exit 1; }
          echo "updated_app=$updated" >> "$GITHUB_OUTPUT"

  start_app:
    name: Start TrueNAS app (and wait)
    runs-on: ubuntu-latest
    needs: [update_aggregator_include]
    if: ${{ needs.update_aggregator_include.outputs.updated_app != '' }}
    steps:
      - name: Start & wait for running
        uses: appleboy/ssh-action@v1
        env:
          APP_NAME: ${{ needs.update_aggregator_include.outputs.updated_app }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: APP_NAME
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            name="${APP_NAME}"

            echo "Starting app: $name"
            if midclt call app.start "$name" 2>/dev/null; then
              echo "Started via app.start"
            else
              echo "app.start not available; trying chart.release.scale -> 1"
              if midclt call chart.release.scale "$name" '{"replica_count":1}' 2>/dev/null; then
                echo "Scaled to 1"
              else
                echo "ERROR: could not start app '$name' with known methods."
                exit 1
              fi
            fi

            get_state() {
              midclt call app.query '[["name","=","'"$name"'"]]' 2>/dev/null \
                | tr -d '\n' \
                | sed -n 's/.*"state"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
            }

            i=0
            st=""
            while [ $i -lt 60 ]; do
              st="$(get_state || true)"
              [ "$st" = "RUNNING" ] && break
              sleep 5
              i=$((i+1))
            done
            echo "App state after start: ${st:-unknown}"

  update_cloudflare_tunnel:
    name: Update Cloudflare Tunnel (service hostnames)
    runs-on: ubuntu-latest
    needs:
      - determine_environment
      - generate_and_upload_truenas_compose_file
      - start_app
    steps:
      - name: Build ingress & PUT
        env:
          BASE_DOMAIN: djbeatblaster.com
          LAN_IP: 192.168.1.17
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_UUID }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          EXTERNAL_MAP_JSON: ${{ needs.generate_and_upload_truenas_compose_file.outputs.external_ports_map }}
          ENV_SLUG: ${{ needs.determine_environment.outputs.env_slug }}
        run: |
          set -euo pipefail
          which jq >/dev/null 2>&1 || { sudo apt-get update -y && sudo apt-get install -y jq; }

          RAW="${EXTERNAL_MAP_JSON:-}"
          if [ -z "$RAW" ] || ! printf '%s' "$RAW" | jq -e . >/dev/null 2>&1; then
            echo "WARN: EXTERNAL_MAP is empty/invalid, using {}"
            RAW="{}"
          fi

          GEN_ITEMS="$(printf '%s' "$RAW" | jq -c --arg env "$ENV_SLUG" --arg dom "$BASE_DOMAIN" --arg ip "$LAN_IP" '
            to_entries
            | map({
                hostname: ("dj-panel-" + $env + "-" + ((.value | split(":")[0]) | gsub("_"; "-")) + "." + $dom),
                service:  ("http://" + $ip + ":" + .key)
              })
          ')"

          STATIC='[
            {"hostname":"truenas.'$BASE_DOMAIN'","service":"http://'$LAN_IP'"},
            {"hostname":"cas.'$BASE_DOMAIN'","service":"http://'$LAN_IP':50000"},
            {"hostname":"home.'$BASE_DOMAIN'","service":"http://'$LAN_IP':50001"},
            {"hostname":"nextcloud.'$BASE_DOMAIN'","service":"http://'$LAN_IP':50002"},
            {"hostname":"grocy.'$BASE_DOMAIN'","service":"http://'$LAN_IP':50003"},
            {"hostname":"mqtt.'$BASE_DOMAIN'","service":"http://'$LAN_IP':50004"},
            {"hostname":"mealie.'$BASE_DOMAIN'","service":"http://'$LAN_IP':50005"},
            {"hostname":"esp.'$BASE_DOMAIN'","service":"http://'$LAN_IP':50006"},
            {"hostname":"n8n.'$BASE_DOMAIN'","service":"http://'$LAN_IP':50007"}
          ]'

          INGRESS="$(jq -c --argjson static "$STATIC" --argjson gen "$GEN_ITEMS" \
            -n '$static + $gen + [ { "service":"http_status:404" } ]')"

          echo "Proposed ingress (service-based hostnames):"
          echo "$INGRESS" | jq .

          BODY="$(jq -c --argjson ing "$INGRESS" -n '{config:{ingress:$ing, "warp-routing":{"enabled":true}}}')"
          echo "$BODY" > body.json
          test -s body.json || { echo "ERROR: body.json is empty."; exit 1; }

          RESP=$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/cfd_tunnel/${TUNNEL_ID}/configurations" \
            -H "X-Auth-Email: ${CF_EMAIL}" \
            -H "X-Auth-Key: ${CF_KEY}" \
            -H "Content-Type: application/json" \
            --data @body.json)

          echo "Cloudflare response body:"; echo "$RESP" | jq .
          ok=$(echo "$RESP" | jq -r '.success // false')
          if [ "$ok" != "true" ]; then
            code=$(echo "$RESP" | jq -r '.errors[0].code // "unknown"')
            msg=$(echo "$RESP" | jq -r '.errors[0].message // "unknown error"')
            echo "ERROR: Cloudflare API returned error. code=$code message=$msg" >&2
            exit 1
          fi
          echo "Cloudflare Tunnel configuration updated successfully."

  cleanup_old_fragments:
    name: Keep only 3 newest env-tagged fragments
    runs-on: ubuntu-latest
    needs:
      - determine_environment
      - start_app
      - update_cloudflare_tunnel
      - generate_and_upload_truenas_compose_file
    steps:
      - name: Prune old dj-panel-{env}-{timestamp}.yml (keep 3)
        uses: appleboy/ssh-action@v1
        env:
          TRUENAS_POOL: Files
          CURRENT_ENV: ${{ needs.determine_environment.outputs.current_env }}
          ENV_SLUG: ${{ needs.determine_environment.outputs.env_slug }}
          LAST_STD: ${{ needs.generate_and_upload_truenas_compose_file.outputs.new_compose_abs_std }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: TRUENAS_POOL,CURRENT_ENV,ENV_SLUG,LAST_STD
          capture_stdout: true
          script: |
            #!/bin/sh
            set -euo pipefail
            BASE="/mnt/${TRUENAS_POOL}/Apps/DJPanel/${CURRENT_ENV}/Images"
            PATTERN="dj-panel-${ENV_SLUG}-*.yml"

            # Show current set
            echo "All matching fragments (before prune):"
            ls -1 "${BASE}/${PATTERN}" 2>/dev/null || true

            # Sort lexicographically (timestamps in name -> OK), keep top 3
            # shellcheck disable=SC2010
            NEWEST=$(ls -1 "${BASE}/${PATTERN}" 2>/dev/null | sort -r | head -n 3)
            # Build a keep list
            KEEP_TMP="$(mktemp)"
            echo "$NEWEST" | sed '/^$/d' > "$KEEP_TMP"

            # Delete any others
            for f in "${BASE}"/${PATTERN}; do
              [ -e "$f" ] || continue
              if grep -Fxq "$f" "$KEEP_TMP"; then
                echo "KEEP $f"
              else
                # Never delete the one we just included if names ever diverge
                if [ -n "${LAST_STD:-}" ] && [ "$f" = "$LAST_STD" ]; then
                  echo "KEEP (latest included) $f"
                  continue
                fi
                echo "DELETE $f"
                rm -f -- "$f" || true
              fi
            done
            rm -f "$KEEP_TMP"

            echo "Remaining fragments (after prune):"
            ls -1 "${BASE}/${PATTERN}" 2>/dev/null || true

  deployment_summary:
    runs-on: ubuntu-latest
    needs:
      - determine_environment
      - determine_docker_tag
      - determine_compose_timestamp
      - generate_and_upload_truenas_compose_file
      - update_aggregator_include
      - start_app
      - update_cloudflare_tunnel
      - cleanup_old_fragments
    steps:
      - name: Summary
        run: |
          echo "=== TrueNAS DJ Panel Deployment Summary ==="
          echo "Environment: ${{ needs.determine_environment.outputs.current_env }}"
          echo "Env Slug :  ${{ needs.determine_environment.outputs.env_slug }}"
          echo "Docker Tag: ${{ needs.determine_docker_tag.outputs.docker_tag }}"
          echo "Compose   : ${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          echo "Uploaded  : ${{ needs.generate_and_upload_truenas_compose_file.outputs.new_compose_abs }}"
          echo "Std path  : ${{ needs.generate_and_upload_truenas_compose_file.outputs.new_compose_abs_std }}"
          echo "Updated App: ${{ needs.update_aggregator_include.outputs.updated_app }}"
          echo "Cloudflare tunnel updated."
          echo "Old fragments pruned (kept last 3)."
