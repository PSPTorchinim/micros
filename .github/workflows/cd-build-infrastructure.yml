name: Build TrueNAS Infrastructure

on:
  workflow_dispatch:

jobs:
  get_truenas_ports:
    name: Get TrueNAS Ports
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.get_netstat_ports.outputs.stdout }}
    steps:
      - name: Get Netstat Listening Ports
        id: get_netstat_ports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true # <-- IMPORTANT
          script: |
            # TCP + UDP listening ports, print only the port number (one per line), sorted & unique
            netstat -tuln 2>/dev/null \
              | awk 'NR>2 {print $4}' \
              | sed -E 's/.*:([0-9]+)$/\1/' \
              | grep -E '^[0-9]+$' \
              | sort -n | uniq

  get_cloudflare_tunnel_ports:
    name: Get Cloudflare Tunnel Ports
    runs-on: ubuntu-latest
    outputs:
      tunnel_ports: ${{ steps.format_output.outputs.ports }}
    steps:
      - name: Get Cloudflare DNS Records
        id: get_tunnel_ports
        run: |
          response=$(curl -s https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/cfd_tunnel/${{ secrets.CLOUDFLARE_TUNNEL_UUID }}/configurations \
            -H "X-Auth-Email: ${{ secrets.CLOUDFLARE_EMAIL }}" \
            -H "X-Auth-Key: ${{ secrets.CLOUDFLARE_API_KEY }}")
          echo "$response"
          echo "response=$response" >> "$GITHUB_OUTPUT"

      - name: Format Output
        id: format_output
        run: |
          ports=$(echo '${{ steps.get_tunnel_ports.outputs.response }}' | jq -r '.result.config.ingress[].service' | grep -E '^https?://' | grep -oE ':[0-9]+' | cut -d: -f2 | sort -n | uniq | tr '\n' ' ')
          echo "$ports"
          echo "ports=$ports" >> "$GITHUB_OUTPUT"

  calculate_unused_ports:
    name: Calculate Unused External and Internal Ports
    runs-on: ubuntu-latest
    needs: [get_truenas_ports, get_cloudflare_tunnel_ports]
    outputs:
      external_ports: ${{ steps.calculate_external_ports.outputs.unused_ports }}
      internal_ports: ${{ steps.calculate_internal_ports.outputs.unused_ports }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Calculate unused internal ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_internal_ports
        with:
          start_port: 40000
          end_port: 50000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ${{ needs.get_cloudflare_tunnel_ports.outputs.tunnel_ports }}

      - name: Calculate unused external ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_external_ports
        with:
          start_port: 50000
          end_port: 60000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ${{ needs.get_cloudflare_tunnel_ports.outputs.tunnel_ports }}

  determine_environment:
    runs-on: ubuntu-latest
    name: Determine Environment
    outputs:
      current_env: ${{ steps.set_env.outputs.current_env }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Set Environment
        id: set_env
        uses: ./.github/templates/determine-environment

  determine_target_branch:
    name: Determine Target Branch
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.branch_set.outputs.target_branch }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Determine target branch based on branch
        id: branch_set
        uses: ./.github/templates/determine-target-branch

  determine_docker_tag:
    name: Determine Docker Tag
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag_set.outputs.docker_tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Determine Docker tag based on branch
        id: tag_set
        uses: ./.github/templates/determine-docker-tag

  generate_and_upload_truenas_compose_file:
    name: Generate and Upload TrueNAS Docker Compose File
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        calculate_unused_ports,
        determine_target_branch,
        determine_docker_tag,
      ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install yq (optional — script can self-install)
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Generate New Compose File with Unused Ports and GHCR Images
        id: generate_compose_file
        shell: bash
        env:
          LOG_LEVEL: DEBUG
        run: |
          chmod +x .github/scripts/generate-compose-file.sh
          external_map_json=$(.github/scripts/generate-compose-file.sh \
            "${{ needs.calculate_unused_ports.outputs.internal_ports }}" \
            "${{ needs.calculate_unused_ports.outputs.external_ports }}" \
            "${{ needs.determine_docker_tag.outputs.docker_tag }}" \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}")
          echo "external_ports_map=$external_map_json" >> "$GITHUB_OUTPUT"

      - name: Ensure TrueNAS has proper catalogs for data and images for each service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            zfs list -H -o name Files/Apps/DJPanel >/dev/null 2>&1 || zfs create -p Files/Apps/DJPanel
            zfs list -H -o name Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }} >/dev/null 2>&1 || zfs create -p Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}
