name: Build TrueNAS Infrastructure

on:
  workflow_dispatch:

jobs:
  get_truenas_ports:
    name: Get TrueNAS Ports
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.get_netstat_ports.outputs.stdout }}
    steps:
      - name: Get Netstat Listening Ports
        id: get_netstat_ports
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          capture_stdout: true
          script: |
            netstat -tuln 2>/dev/null \
              | awk 'NR>2 {print $4}' \
              | sed -E 's/.*:([0-9]+)$/\1/' \
              | grep -E '^[0-9]+$' \
              | sort -n | uniq

  get_cloudflare_tunnel_ports:
    name: Get Cloudflare Tunnel Ports
    runs-on: ubuntu-latest
    outputs:
      tunnel_ports: ${{ steps.format_output.outputs.ports }}
    steps:
      - name: Get Cloudflare DNS Records
        id: get_tunnel_ports
        run: |
          response=$(curl -s https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/cfd_tunnel/${{ secrets.CLOUDFLARE_TUNNEL_UUID }}/configurations \
            -H "X-Auth-Email: ${{ secrets.CLOUDFLARE_EMAIL }}" \
            -H "X-Auth-Key: ${{ secrets.CLOUDFLARE_API_KEY }}")
          echo "$response"
          echo "response=$response" >> "$GITHUB_OUTPUT"

      - name: Format Output
        id: format_output
        run: |
          ports=$(echo '${{ steps.get_tunnel_ports.outputs.response }}' \
            | jq -r '.result.config.ingress[].service' \
            | grep -E '^https?://' | grep -oE ':[0-9]+' \
            | cut -d: -f2 | sort -n | uniq | tr '\n' ' ')
          echo "$ports"
          echo "ports=$ports" >> "$GITHUB_OUTPUT"

  calculate_unused_ports:
    name: Calculate Unused External and Internal Ports
    runs-on: ubuntu-latest
    needs: [get_truenas_ports, get_cloudflare_tunnel_ports]
    outputs:
      external_ports: ${{ steps.calculate_external_ports.outputs.unused_ports }}
      internal_ports: ${{ steps.calculate_internal_ports.outputs.unused_ports }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Calculate unused internal ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_internal_ports
        with:
          start_port: 40000
          end_port: 50000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ${{ needs.get_cloudflare_tunnel_ports.outputs.tunnel_ports }}

      - name: Calculate unused external ports
        uses: ./.github/templates/calculate-unused-ports
        id: calculate_external_ports
        with:
          start_port: 50000
          end_port: 60000
          truenas_ports: ${{ needs.get_truenas_ports.outputs.ports }}
          tunnel_ports: ${{ needs.get_cloudflare_tunnel_ports.outputs.tunnel_ports }}

  determine_environment:
    runs-on: ubuntu-latest
    name: Determine Environment
    outputs:
      current_env: ${{ steps.set_env.outputs.current_env }}
      env_slug: ${{ steps.slug.outputs.env_slug }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Set Environment
        id: set_env
        uses: ./.github/templates/determine-environment
      - name: Compute env slug
        id: slug
        run: |
          env_raw='${{ steps.set_env.outputs.current_env }}'
          env_slug=$(printf '%s' "$env_raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          echo "env_slug=$env_slug" >> "$GITHUB_OUTPUT"

  determine_target_branch:
    name: Determine Target Branch
    runs-on: ubuntu-latest
    outputs:
      target_branch: ${{ steps.branch_set.outputs.target_branch }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Determine target branch based on branch
        id: branch_set
        uses: ./.github/templates/determine-target-branch

  determine_docker_tag:
    name: Determine Docker Tag
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag_set.outputs.docker_tag }}
      latest_tag: ${{ steps.tag_set.outputs.latest_tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Determine Docker tag based on branch
        id: tag_set
        uses: ./.github/templates/determine-docker-tag

  determine_compose_timestamp:
    name: Determine Compose File Timestamp
    runs-on: ubuntu-latest
    outputs:
      compose_timestamp: ${{ steps.timestamp_set.outputs.compose_timestamp }}
      compose_file_name: ${{ steps.timestamp_set.outputs.compose_file_name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Generate compose file timestamp
        id: timestamp_set
        uses: ./.github/templates/determine-compose-timestamp

  check_existing_instances:
    name: Check Existing TrueNAS Instances (via midclt)
    runs-on: ubuntu-latest
    needs: [determine_environment]
    outputs:
      existing_instances: ${{ steps.determine_target.outputs.existing_instances }}
      deployment_target: ${{ steps.determine_target.outputs.deployment_target }}
      update_target: ${{ steps.determine_target.outputs.update_target }}
      instance_name_1: ${{ steps.determine_target.outputs.instance_name_1 }}
      instance_name_2: ${{ steps.determine_target.outputs.instance_name_2 }}
    steps:
      - name: Query TrueNAS apps with midclt
        id: midclt_query
        uses: appleboy/ssh-action@v1
        env:
          ENV_SLUG: ${{ needs.determine_environment.outputs.env_slug }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: ENV_SLUG
          capture_stdout: true
          script: |
            #!/bin/bash
            set -eu
            app1="dj-panel-${ENV_SLUG}-1"
            app2="dj-panel-${ENV_SLUG}-2"
            if ! command -v midclt >/dev/null 2>&1; then
              echo "ERROR: midclt not available on target host"
              echo "app1_name=$app1"
              echo "app2_name=$app2"
              echo "app1_exists=0"
              echo "app2_exists=0"
              exit 0
            fi
            all_names=$(midclt call app.query | jq -r '.[].name')
            exists1=$(printf '%s\n' "$all_names" | grep -x "$app1" >/dev/null 2>&1 && echo 1 || echo 0)
            exists2=$(printf '%s\n' "$all_names" | grep -x "$app2" >/dev/null 2>&1 && echo 1 || echo 0)
            echo "app1_name=$app1"
            echo "app1_exists=$exists1"
            echo "app2_name=$app2"
            echo "app2_exists=$exists2"

      - name: Determine deployment and update targets
        id: determine_target
        run: |
          set -euo pipefail
          out='${{ steps.midclt_query.outputs.stdout }}'
          app1=$(echo "$out" | awk -F= '/^app1_name=/{print $2}')
          app2=$(echo "$out" | awk -F= '/^app2_name=/{print $2}')
          e1=$(echo "$out" | awk -F= '/^app1_exists=/{print $2}')
          e2=$(echo "$out" | awk -F= '/^app2_exists=/{print $2}')
          existing_json="[]"
          if [ "$e1" = "1" ]; then existing_json=$(echo "$existing_json" | jq --arg n "$app1" '. + [$n]'); fi
          if [ "$e2" = "1" ]; then existing_json=$(echo "$existing_json" | jq --arg n "$app2" '. + [$n]'); fi
          echo "existing_instances=$existing_json" >> "$GITHUB_OUTPUT"
          echo "instance_name_1=$app1" >> "$GITHUB_OUTPUT"
          echo "instance_name_2=$app2" >> "$GITHUB_OUTPUT"
          count=$(echo "$existing_json" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "deployment_target=$app1" >> "$GITHUB_OUTPUT"
            echo "update_target=" >> "$GITHUB_OUTPUT"
          elif [ "$count" -eq 1 ]; then
            if [ "$e1" = "1" ]; then echo "deployment_target=$app2" >> "$GITHUB_OUTPUT"; else echo "deployment_target=$app1" >> "$GITHUB_OUTPUT"; fi
            echo "update_target=" >> "$GITHUB_OUTPUT"
          else
            echo "deployment_target=oldest" >> "$GITHUB_OUTPUT"
            echo "update_target=" >> "$GITHUB_OUTPUT"
          fi

  generate_and_upload_truenas_compose_file:
    name: Generate and Upload TrueNAS Docker Compose File
    runs-on: ubuntu-latest
    needs:
      [
        determine_environment,
        calculate_unused_ports,
        determine_target_branch,
        determine_docker_tag,
        determine_compose_timestamp,
        check_existing_instances,
      ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Install yq (optional — script can self-install)
        run: |
          sudo wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Generate New Compose File with Unused Ports and GHCR Images
        id: generate_compose_file
        shell: bash
        env:
          LOG_LEVEL: DEBUG
        run: |
          set -euxo pipefail
          chmod +x .github/scripts/generate-compose-file.sh

          deployment_target="${{ needs.check_existing_instances.outputs.deployment_target }}"
          if [[ "$deployment_target" == "oldest" ]]; then
            instance_name="dj-panel-${{ needs.determine_environment.outputs.env_slug }}-replacement"
          else
            instance_name="$deployment_target"
          fi

          output_file="${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          echo "DEBUG: output_file: $output_file"
          echo "DEBUG: instance_name: $instance_name"
          echo "DEBUG: deployment_target: $deployment_target"
          echo "DEBUG: docker_tag: ${{ needs.determine_docker_tag.outputs.docker_tag }}"

          external_map_json=$(.github/scripts/generate-compose-file.sh \
            "${{ needs.calculate_unused_ports.outputs.internal_ports }}" \
            "${{ needs.calculate_unused_ports.outputs.external_ports }}" \
            "${{ needs.determine_docker_tag.outputs.docker_tag }}" \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}" \
            "$output_file")

          echo "external_ports_map=$external_map_json" >> "$GITHUB_OUTPUT"
          echo "compose_file=$output_file" >> "$GITHUB_OUTPUT"
          echo "instance_name=$instance_name" >> "$GITHUB_OUTPUT"

      - name: Package compose file for transfer (base64)
        id: package_compose
        run: |
          set -euo pipefail
          COMPOSE_FILE="${{ steps.generate_compose_file.outputs.compose_file }}"
          test -f "$COMPOSE_FILE" || { echo "Compose file not found: $COMPOSE_FILE" >&2; exit 1; }
          B64=$(base64 -w0 "$COMPOSE_FILE")
          echo "compose_name=$COMPOSE_FILE" >> "$GITHUB_OUTPUT"
          echo "compose_b64=$B64" >> "$GITHUB_OUTPUT"

      - name: Ensure Images dataset & upload compose file (with mountpoint fixer)
        id: upload_compose
        uses: appleboy/ssh-action@v1
        env:
          TRUENAS_POOL: Files
          CURRENT_ENV: ${{ needs.determine_environment.outputs.current_env }}
          COMPOSE_NAME: ${{ steps.package_compose.outputs.compose_name }}
          COMPOSE_B64: ${{ steps.package_compose.outputs.compose_b64 }}
          DEPLOYMENT_TARGET: ${{ needs.check_existing_instances.outputs.deployment_target }}
          INSTANCE_NAME: ${{ steps.generate_compose_file.outputs.instance_name }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: TRUENAS_POOL,CURRENT_ENV,COMPOSE_NAME,COMPOSE_B64,DEPLOYMENT_TARGET,INSTANCE_NAME
          capture_stdout: true
          script: |
            #!/bin/sh
            set -eu
            findbin() { command -v "$1" 2>/dev/null && return 0; for d in /sbin /usr/sbin /usr/local/sbin; do [ -x "$d/$1" ] && { echo "$d/$1"; return 0; }; done; return 1; }
            ZFS_BIN="$(findbin zfs || true)"; ZPOOL_BIN="$(findbin zpool || true)"
            if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ]; then runroot() { sudo "$@"; }; else runroot() { "$@"; }; fi
            POOL="${TRUENAS_POOL:-}"; [ -z "$POOL" ] && [ -n "${ZPOOL_BIN:-}" ] && POOL="$($ZPOOL_BIN list -H -o name | head -n1 || true)"
            [ -n "$POOL" ] || { echo "ERROR: set TRUENAS_POOL."; exit 1; }
            if [ -n "${ZPOOL_BIN:-}" ] && ! $ZPOOL_BIN list -H -o name | grep -x "$POOL" >/dev/null 2>&1; then
              echo "ERROR: pool '$POOL' not found. Available: $($ZPOOL_BIN list -H -o name | tr '\n' ' ')"; exit 1; fi
            ENV_DIR="${CURRENT_ENV:-Development}"
            TARGET_REL="Apps/DJPanel/${ENV_DIR}/Images"

            ensure_dataset_recursive() {
              rel="$1"; [ -n "$rel" ] || return 0; unset current_rel
              echo "$rel" | awk -F/ '{for(i=1;i<=NF;i++) print $i}' | while IFS= read -r part; do
                [ -n "$part" ] || continue
                if [ -z "${current_rel:-}" ]; then current_rel="$part"; else current_rel="$current_rel/$part"; fi
                ds="$POOL/$current_rel"; mp="/mnt/$POOL/$current_rel"; mp="$(printf '%s' "$mp" | sed -E 's#/+#/#g')"
                if runroot "$ZFS_BIN" list -H "$ds" >/dev/null 2>&1; then
                  curmp="$(runroot "$ZFS_BIN" get -H -o value mountpoint "$ds" 2>/dev/null || echo -n)"
                  if [ "$curmp" != "$mp" ] && [ "$curmp" != "legacy" ]; then runroot "$ZFS_BIN" set mountpoint="$mp" "$ds" 2>/dev/null || echo "SKIP: could not set mountpoint $ds"
                  else echo "OK  : $ds exists"; fi
                else
                  echo "MAKE: $ds (mountpoint=$mp)"
                  runroot "$ZFS_BIN" create -p -o mountpoint="$mp" "$ds" && runroot mkdir -p "$mp" && runroot "$ZFS_BIN" mount "$ds" 2>/dev/null || true
                fi
              done
            }
            ensure_dataset_recursive "$TARGET_REL"

            DST_DIR="/mnt/$POOL/$TARGET_REL"
            DST_DIR="$(printf '%s' "$DST_DIR" | sed -E 's#/+#/#g')"
            DST_NAME="${COMPOSE_NAME##*/}"
            DST_PATH="$DST_DIR/$DST_NAME"
            runroot mkdir -p "$DST_DIR"
            printf '%s' "$COMPOSE_B64" | base64 -d > "$DST_PATH"
            chmod 664 "$DST_PATH" || true

            echo "compose_abs_path=$DST_PATH"

      # NEW: find each target app's compose file and include the newly uploaded one
      - name: Update target app compose (include new file)
        uses: appleboy/ssh-action@v1
        env:
          TRUENAS_POOL: Files
          CURRENT_ENV: ${{ needs.determine_environment.outputs.current_env }}
          ENV_SLUG: ${{ needs.determine_environment.outputs.env_slug }}
          DEPLOYMENT_TARGET: ${{ needs.check_existing_instances.outputs.deployment_target }}
          NEW_COMPOSE_NAME: ${{ needs.determine_compose_timestamp.outputs.compose_file_name }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: TRUENAS_POOL,CURRENT_ENV,ENV_SLUG,DEPLOYMENT_TARGET,NEW_COMPOSE_NAME
          capture_stdout: true
          script: |
            #!/bin/bash
            set -euo pipefail

            # Resolve which app(s) to touch
            app1="dj-panel-${ENV_SLUG}-1"
            app2="dj-panel-${ENV_SLUG}-2"
            if [[ "$DEPLOYMENT_TARGET" == "oldest" ]]; then
              apps=("$app1" "$app2")
            else
              apps=("$DEPLOYMENT_TARGET")
            fi

            # Absolute path of the newly uploaded compose file
            NEW_COMPOSE_ABS="/mnt/${TRUENAS_POOL}/Apps/DJPanel/${CURRENT_ENV}/Images/${NEW_COMPOSE_NAME}"
            echo "New compose file to include: $NEW_COMPOSE_ABS"

            # Ensure yq on TrueNAS (SCALE). If missing, drop a local copy for this session.
            yqbin="$(command -v yq || true)"
            if [[ -z "$yqbin" ]]; then
              echo "yq not found on TrueNAS; attempting to fetch a local copy..."
              tmpyq="/tmp/yq"
              curl -fsSL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o "$tmpyq"
              chmod +x "$tmpyq"
              yqbin="$tmpyq"
            fi

            for app in "${apps[@]}"; do
              echo "Processing app: $app"

              # Pull the app object and try to discover its compose YAML path.
              # We scan for any absolute YAML path in the object (robust across SCALE versions).
              app_json="$(midclt call app.query | jq -r --arg n "$app" '.[] | select(.name==$n)')"
              if [[ -z "$app_json" || "$app_json" == "null" ]]; then
                echo "WARN: app $app not found by midclt. Skipping."
                continue
              fi

              compose_path="$(echo "$app_json" \
                | jq -r '.. | strings | select(test("^/mnt/.+\\.(ya?ml)$"))' \
                | head -n1)"

              if [[ -z "$compose_path" || "$compose_path" == "null" ]]; then
                # Fallback: keep a per-app aggregator next to Images/ as a stable entrypoint
                compose_path="/mnt/${TRUENAS_POOL}/Apps/DJPanel/${CURRENT_ENV}/Images/${app}.yml"
                echo "No compose path found in app metadata; using fallback aggregator: $compose_path"
                if [[ ! -f "$compose_path" ]]; then
                  echo "# Autogenerated aggregator for $app" > "$compose_path"
                fi
              fi

              echo "App compose YAML path: $compose_path"

              # Create file if missing (harmless if it already exists)
              if [[ ! -f "$compose_path" ]]; then
                echo "Creating new compose aggregator at $compose_path"
                mkdir -p "$(dirname "$compose_path")"
                printf 'include: []\n' > "$compose_path"
              fi

              # Ensure the include list exists; append our new file; de-duplicate
              "$yqbin" -i '
                (.include //= []) |
                .include += ["'"$NEW_COMPOSE_ABS"'"] |
                .include |= (unique)
              ' "$compose_path"

              echo "Updated $compose_path to include $NEW_COMPOSE_ABS"
            done

      - name: Decide if restart is required
        id: restart_flag
        run: |
          instances='${{ needs.check_existing_instances.outputs.existing_instances }}'
          count=$(echo "$instances" | jq 'length')
          if [ "$count" -ge 2 ] || [ "${{ needs.check_existing_instances.outputs.deployment_target }}" = "oldest" ]; then
            echo "restart=true" >> "$GITHUB_OUTPUT"
          else
            echo "restart=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restart TrueNAS App if updating existing instance
        if: ${{ steps.restart_flag.outputs.restart == 'true' }}
        uses: appleboy/ssh-action@v1
        env:
          ENV_SLUG: ${{ needs.determine_environment.outputs.env_slug }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: ENV_SLUG
          capture_stdout: true
          script: |
            #!/bin/bash
            set -eu
            app1="dj-panel-${ENV_SLUG}-1"
            app2="dj-panel-${ENV_SLUG}-2"

            echo "Restarting TrueNAS apps for env: ${ENV_SLUG}"
            if command -v midclt >/dev/null 2>&1; then
              for app_name in "$app1" "$app2"; do
                app_exists=$(midclt call app.query | jq -r --arg name "$app_name" '.[] | select(.name == $name) | .name' | wc -l)
                if [ "$app_exists" -gt 0 ]; then
                  echo "Restarting app: $app_name"
                  midclt call app.restart "$app_name" || echo "Failed to restart $app_name"
                else
                  echo "App $app_name not found, skipping"
                fi
              done
            else
              echo "midclt not available; manual restart may be required."
            fi

      - name: Deployment Summary
        run: |
          echo "=== TrueNAS DJ Panel Deployment Summary ==="
          echo "Docker Tag: ${{ needs.determine_docker_tag.outputs.docker_tag }}"
          echo "Latest Tag: ${{ needs.determine_docker_tag.outputs.latest_tag }}"
          echo "Compose File: ${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
          echo "Environment: ${{ needs.determine_environment.outputs.current_env }}"
          echo "Env Slug: ${{ needs.determine_environment.outputs.env_slug }}"
          echo "Deployment Target: ${{ needs.check_existing_instances.outputs.deployment_target }}"
          echo "Chosen Instance Name: ${{ steps.generate_compose_file.outputs.instance_name }}"
          echo ""
          echo "The app compose(s) were updated to include the new file and then restarted if both instances exist."
          echo ""
          echo "Compose dir: /mnt/Files/Apps/DJPanel/${{ needs.determine_environment.outputs.current_env }}/Images/"
          echo "File name : ${{ needs.determine_compose_timestamp.outputs.compose_file_name }}"
