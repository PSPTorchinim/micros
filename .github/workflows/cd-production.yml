name: CD - Production Deployment

# Triggered automatically when a stable semantic-version tag is pushed manually
# (e.g. v1.0.0 — no hyphen, follows the v<major>.<minor>.<patch> convention).
# Tags that contain a hyphen (pre-release CalVer, e.g. v2026.04.15-42) are
# handled by cd-development.yml and skipped here via the job-level condition.
#
# Calls the shared cd-build-infrastructure.yml reusable workflow, which:
#   - Determines environment = Production (from the tag pattern)
#   - Builds and pushes all Docker images to GHCR
#   - Deploys the full stack to TrueNAS with zero-downtime rolling update

on:
  push:
    tags:
      - 'v*'  # Catches all v* tags; the job below skips pre-release tags

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Permissions required by the called workflow's jobs (build images + deploy)
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy to Production
    # Only run for stable tags that do NOT contain a hyphen (e.g. v1.0.0, not v2026.04.15-42)
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/cd-build-infrastructure.yml
    secrets: inherit
