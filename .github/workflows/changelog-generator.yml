---
name: Generate Changelogs

'on':
  push:
    branches:
      - production
      - releases/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      service:
        description: >-
          Specific service to generate changelog for (leave empty for all)
        required: false
        type: choice
        options:
          - ''
          - CompanyAPI
          - DJHostGateway
          - DocumentsAPI
          - EquipmentAPI
          - IdentityAPI
          - MailingAPI
          - MusicAPI
          - PartyAPI

jobs:
  generate-changelog:
    name: Generate Service Changelogs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GIT_CLIFF_VERSION: "2.6.1"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Install git-cliff
        run: |
          BASE_URL="https://github.com/orhun/git-cliff/releases/download"
          VERSION="v${{ env.GIT_CLIFF_VERSION }}"
          TARBALL="git-cliff-${{ env.GIT_CLIFF_VERSION }}"
          TARBALL="${TARBALL}-x86_64-unknown-linux-gnu.tar.gz"
          wget "${BASE_URL}/${VERSION}/${TARBALL}"
          tar -xzf "${TARBALL}"
          sudo mv "git-cliff-${{ env.GIT_CLIFF_VERSION }}/git-cliff" \
            /usr/local/bin/
          chmod +x /usr/local/bin/git-cliff
          git-cliff --version

      - name: Determine Services to Update
        id: services
        run: |
          if [ -n "${{ github.event.inputs.service }}" ]; then
            echo "services=${{ github.event.inputs.service }}" \
              >> "$GITHUB_OUTPUT"
          else
            SERVICES="CompanyAPI DJHostGateway DocumentsAPI "
            SERVICES+="EquipmentAPI IdentityAPI MailingAPI "
            SERVICES+="MusicAPI PartyAPI"
            echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Changelogs for Services
        run: |
          SERVICES="${{ steps.services.outputs.services }}"

          for SERVICE in $SERVICES; do
            echo "Generating changelog for $SERVICE..."
            SERVICE_PATH="Services/$SERVICE"
            CHANGELOG_FILE="$SERVICE_PATH/CHANGELOG.md"

            if [ -d "$SERVICE_PATH" ]; then
              # Generate changelog for commits affecting this service
              if git-cliff --config .github/cliff.toml \
                --include-path "$SERVICE_PATH/**" \
                --output "$CHANGELOG_FILE" \
                --tag-pattern "v.*" \
                --prepend; then
                echo "✅ Updated changelog for $SERVICE"
              else
                echo "⚠️ Warning: Failed to generate changelog for $SERVICE"
                echo "   Check if there are commits affecting $SERVICE_PATH"
                echo "   or review the git-cliff configuration"
              fi
            else
              echo "❌ Error: Service directory not found: $SERVICE_PATH"
            fi
          done

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push Changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add Services/*/CHANGELOG.md
          git commit -m "chore: update service changelogs [skip ci]"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "✅ Changelogs updated successfully"
          else
            echo "ℹ️ No changes to commit"
          fi
