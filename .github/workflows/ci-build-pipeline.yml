name: Build Artifacts

on:
  schedule:
    - cron: "0 2 * * *" # Nightly: build develop
    - cron: "0 4 1 * *" # Monthly: build production
  workflow_dispatch:

jobs:
  validate_schedule:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.validate.outputs.result }}
    steps:
      - name: Validate schedule and branch
        id: validate
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "${GITHUB_REF#refs/heads/}" == "production" && "${{ github.event.schedule }}" == "0 4 1 * *" ]]; then
              echo "Scheduled monthly build on production branch: OK"
              echo "result=success" >> "$GITHUB_OUTPUT"
            elif [[ "${GITHUB_REF#refs/heads/}" =~ ^releases/.*$ && "${{ github.event.schedule }}" == "0 2 * * *" ]]; then
              echo "Scheduled daily build on releases/* branch: OK"
              echo "result=success" >> "$GITHUB_OUTPUT"
            else
              echo "This scheduled workflow is not allowed to run on this branch."
              echo "result=failure" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "Not a scheduled event, always allow."
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi

  get_repo_owner:
    name: Get Repository Owner (lowercase)
    runs-on: ubuntu-latest
    needs: [validate_schedule]
    if: needs.validate_schedule.outputs.result == 'success'
    outputs:
      owner: ${{ steps.owner_lower.outputs.owner }}
    steps:
      - name: Convert repository owner to lowercase
        id: owner_lower
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  determine_environment:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    needs: [validate_schedule]
    if: needs.validate_schedule.outputs.result == 'success'
    outputs:
      environment: ${{ steps.env_set.outputs.environment }}
    steps:
      - name: Set default environment to Development
        run: echo "ENVIRONMENT_NAME=Development" >> "$GITHUB_ENV"
      - name: Override to Production if on production branch
        if: endsWith(github.ref, '/production')
        run: echo "ENVIRONMENT_NAME=Production" >> "$GITHUB_ENV"
      - name: Override to Development if on releases/*
        if: startsWith(github.ref, 'refs/heads/releases/')
        run: echo "ENVIRONMENT_NAME=Development" >> "$GITHUB_ENV"
      - name: Output environment name
        id: env_set
        run: echo "environment=${{ env.ENVIRONMENT_NAME }}" >> "$GITHUB_OUTPUT"

  determine_target_branch:
    name: Determine Target Branch
    runs-on: ubuntu-latest
    needs: [validate_schedule] # Only needs validate_schedule
    if: needs.validate_schedule.outputs.result == 'success'
    outputs:
      target_branch: ${{ steps.branch_set.outputs.target_branch }}
    steps:
      - name: Set default target branch to develop
        run: echo "TARGET_BRANCH=develop" >> "$GITHUB_ENV"
      - name: Override to production if on production branch
        if: endsWith(github.ref, '/production')
        run: echo "TARGET_BRANCH=production" >> "$GITHUB_ENV"
      - name: Override to develop if on releases/*
        if: startsWith(github.ref, 'refs/heads/releases/')
        run: echo "TARGET_BRANCH=develop" >> "$GITHUB_ENV"
      - name: Output target branch
        id: branch_set
        run: echo "target_branch=${{ env.TARGET_BRANCH }}" >> "$GITHUB_OUTPUT"

  determine_docker_tag:
    name: Determine Docker Tag
    runs-on: ubuntu-latest
    needs: [validate_schedule] # Only needs validate_schedule
    if: needs.validate_schedule.outputs.result == 'success'
    outputs:
      docker_tag: ${{ steps.tag_set.outputs.docker_tag }}
    steps:
      - name: Set docker tag based on branch
        id: tag_set
        run: |
          if [[ "${GITHUB_REF}" == *"/production" ]]; then
            echo "docker_tag=production" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/releases/* ]]; then
            echo "docker_tag=develop" >> "$GITHUB_OUTPUT"
          else
            echo "docker_tag=develop" >> "$GITHUB_OUTPUT"
          fi

  build_dotnet_services:
    environment: ${{ needs.determine_environment.outputs.environment }}
    name: Build & Push .NET Services
    needs:
      - validate_schedule
      - get_repo_owner
      - determine_environment
      - determine_target_branch
      - determine_docker_tag
    if: needs.validate_schedule.outputs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service:
          [
            "CompanyAPI",
            "DJHostGateway",
            "DocumentsAPI",
            "EquipmentAPI",
            "IdentityAPI",
            "MailingAPI",
            "MusicAPI",
            "PartyAPI",
          ]
    env:
      DATABASE_HOST_SQLSERVER: ${{ vars.DATABASE_HOST_SQLSERVER }}
      DATABASE_PORT_SQLSERVER: ${{ vars.DATABASE_PORT_SQLSERVER }}
      DATABASE_USER_SQLSERVER: ${{ vars.DATABASE_USER_SQLSERVER }}
      DATABASE_PASSWORD_SQLSERVER: ${{ secrets.DATABASE_PASSWORD_SQLSERVER }}
      DATABASE_HOST_MONGODB: ${{ vars.DATABASE_HOST_MONGODB }}
      DATABASE_PORT_MONGODB: ${{ vars.DATABASE_PORT_MONGODB }}
      DATABASE_USER_MONGODB: ${{ vars.DATABASE_USER_MONGODB }}
      DATABASE_PASSWORD_MONGODB: ${{ secrets.DATABASE_PASSWORD_MONGODB }}
      REDIS_HOST: ${{ vars.REDIS_HOST }}
      REDIS_PORT: ${{ vars.REDIS_PORT }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      RABBITMQ_HOST: ${{ vars.RABBITMQ_HOST }}
      RABBITMQ_PORT: ${{ vars.RABBITMQ_PORT }}
      RABBITMQ_USER: ${{ vars.RABBITMQ_USER }}
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
      SECURE_KEY: ${{ secrets.SECURE_KEY }}
      JWT_KEY: ${{ secrets.JWT_KEY }}
      ASPNETCORE_ENVIRONMENT: ${{ vars.ASPNETCORE_ENVIRONMENT }}
      ASPNETCORE_IDENTITY_BE_ADDRESS: ${{ vars.ASPNETCORE_IDENTITY_BE_ADDRESS }}
      ASPNETCORE_MUSIC_BE_ADDRESS: ${{ vars.ASPNETCORE_MUSIC_BE_ADDRESS }}
      ASPNETCORE_GEAR_BE_ADDRESS: ${{ vars.ASPNETCORE_GEAR_BE_ADDRESS }}
      ASPNETCORE_DOCUMENTS_BE_ADDRESS: ${{ vars.ASPNETCORE_DOCUMENTS_BE_ADDRESS }}
      ASPNETCORE_BRAND_BE_ADDRESS: ${{ vars.ASPNETCORE_BRAND_BE_ADDRESS }}
      ASPNETCORE_PARTY_BE_ADDRESS: ${{ vars.ASPNETCORE_PARTY_BE_ADDRESS }}
      ASPNETCORE_MAILING_BE_ADDRESS: ${{ vars.ASPNETCORE_MAILING_BE_ADDRESS }}
      DATABASE_CATALOG: ${{ matrix.service }}
      DJPANEL_USER_EMAIL: ${{ vars.DJPANEL_USER_EMAIL }}
      DJPANEL_USER_PASSWORD: ${{ secrets.DJPANEL_USER_PASSWORD }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x"

      - name: Add .NET Tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Display .NET Version
        run: dotnet --version

      - name: Update dotnet-ef Tool
        run: dotnet tool update --global dotnet-ef

      - name: Restore Dependencies
        run: dotnet restore "Services/${{ matrix.service }}"

      - name: Check for DbContext
        run: |
          if dotnet ef dbcontext info --no-build -p "Services/${{ matrix.service }}" >/dev/null 2>&1; then
            echo "DbContext found."
          else
            echo "No DbContext found (or no design-time factory)."
          fi

      - name: Build Project
        run: dotnet build "Services/${{ matrix.service }}" --no-restore -c Debug

      - name: Run Unit Tests (if present)
        run: dotnet test "Tests/${{ matrix.service }}.Tests" --no-build --collect:"XPlat Code Coverage"

      - name: Convert Service Name to Lowercase
        id: service_lower
        run: |
          echo "name=$(echo '${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/microservice.Dockerfile
          build-args: |
            MICROSERVICE_NAME=${{ matrix.service }}
            DATABASE_HOST_SQLSERVER=${{ env.DATABASE_HOST_SQLSERVER }}
            DATABASE_PORT_SQLSERVER=${{ env.DATABASE_PORT_SQLSERVER }}
            DATABASE_USER_SQLSERVER=${{ env.DATABASE_USER_SQLSERVER }}
            DATABASE_PASSWORD_SQLSERVER=${{ env.DATABASE_PASSWORD_SQLSERVER }}
            DATABASE_HOST_MONGODB=${{ env.DATABASE_HOST_MONGODB }}
            DATABASE_PORT_MONGODB=${{ env.DATABASE_PORT_MONGODB }}
            DATABASE_USER_MONGODB=${{ env.DATABASE_USER_MONGODB }}
            DATABASE_PASSWORD_MONGODB=${{ env.DATABASE_PASSWORD_MONGODB }}
            REDIS_HOST=${{ env.REDIS_HOST }}
            REDIS_PORT=${{ env.REDIS_PORT }}
            REDIS_PASSWORD=${{ env.REDIS_PASSWORD }}
            RABBITMQ_HOST=${{ env.RABBITMQ_HOST }}
            RABBITMQ_PORT=${{ env.RABBITMQ_PORT }}
            RABBITMQ_USER=${{ env.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ env.RABBITMQ_PASSWORD }}
            SECURE_KEY=${{ env.SECURE_KEY }}
            JWT_KEY=${{ env.JWT_KEY }}
            ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }}
            ASPNETCORE_IDENTITY_BE_ADDRESS=${{ env.ASPNETCORE_IDENTITY_BE_ADDRESS }}
            ASPNETCORE_MUSIC_BE_ADDRESS=${{ env.ASPNETCORE_MUSIC_BE_ADDRESS }}
            ASPNETCORE_GEAR_BE_ADDRESS=${{ env.ASPNETCORE_GEAR_BE_ADDRESS }}
            ASPNETCORE_DOCUMENTS_BE_ADDRESS=${{ env.ASPNETCORE_DOCUMENTS_BE_ADDRESS }}
            ASPNETCORE_BRAND_BE_ADDRESS=${{ env.ASPNETCORE_BRAND_BE_ADDRESS }}
            ASPNETCORE_PARTY_BE_ADDRESS=${{ env.ASPNETCORE_PARTY_BE_ADDRESS }}
            ASPNETCORE_MAILING_BE_ADDRESS=${{ env.ASPNETCORE_MAILING_BE_ADDRESS }}
            DATABASE_CATALOG=${{ env.DATABASE_CATALOG }}
            DJPANEL_USER_EMAIL=${{ env.DJPANEL_USER_EMAIL }}
            DJPANEL_USER_PASSWORD=${{ env.DJPANEL_USER_PASSWORD }}
          tags: ghcr.io/${{ needs.get_repo_owner.outputs.owner }}/micros/services/${{ steps.service_lower.outputs.name }}:${{ needs.determine_docker_tag.outputs.docker_tag }}-latest
          push: true

  build_react_frontends:
    environment: ${{ needs.determine_environment.outputs.environment }}
    name: Build & Push React Frontends
    needs:
      - validate_schedule
      - get_repo_owner
      - determine_environment
      - determine_target_branch
      - determine_docker_tag
    if: needs.validate_schedule.outputs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: ["dj-panel"]
    env:
      REACT_APP_API_GATEWAY: ${{ vars.REACT_APP_API_GATEWAY }}
      REACT_APP_API_SECURE_KEY: ${{ secrets.SECURE_KEY }}
      REACT_APP_API_JWT_TOKEN: ${{ secrets.JWT_KEY }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install NPM Dependencies
        working-directory: Frontends/${{ matrix.service }}
        run: npm install --retry 5 --fetch-retries 5 --fetch-retry-mintimeout 20000

      - name: Lint Source Code
        working-directory: Frontends/${{ matrix.service }}
        run: npm run lint

      - name: Check Code Formatting
        working-directory: Frontends/${{ matrix.service }}
        run: npm run format:check

      - name: Build React App
        working-directory: Frontends/${{ matrix.service }}
        run: npm run build

      - name: Run React Tests
        working-directory: Frontends/${{ matrix.service }}
        run: npm run test

      - name: Convert Frontend Name to Lowercase
        id: frontend_lower
        run: |
          echo "name=$(echo '${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/microfrontend.Dockerfile
          build-args: |
            MICROFRONTEND_NAME=${{ matrix.service }}
            REACT_APP_API_GATEWAY=${{ env.REACT_APP_API_GATEWAY }}
            REACT_APP_API_SECURE_KEY=${{ env.REACT_APP_API_SECURE_KEY }}
            REACT_APP_API_JWT_TOKEN=${{ env.REACT_APP_API_JWT_TOKEN }}
          tags: ghcr.io/${{ needs.get_repo_owner.outputs.owner }}/micros/frontends/${{ steps.frontend_lower.outputs.name }}:${{ needs.determine_docker_tag.outputs.docker_tag }}-latest
          push: true

  build_infrastructure_images:
    name: Build & Push Infrastructure Images
    needs:
      - validate_schedule
      - get_repo_owner
      - determine_environment
      - determine_target_branch
      - determine_docker_tag
    if: needs.validate_schedule.outputs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        image:
          - {
              name: "mongodb",
              dockerfile: "Docker/mongodb.Dockerfile",
              tag: "mongodb",
            }
          - {
              name: "postgres",
              dockerfile: "Docker/postgres.Dockerfile",
              tag: "postgres",
            }
          - {
              name: "redis",
              dockerfile: "Docker/redis.Dockerfile",
              tag: "redis",
            }
          - {
              name: "rabbitmq",
              dockerfile: "Docker/rabbitmq.Dockerfile",
              tag: "rabbitmq",
            }
          - {
              name: "sqlserver",
              dockerfile: "Docker/sqlserver.Dockerfile",
              tag: "sqlserver",
            }
          - {
              name: "strapi",
              dockerfile: "Docker/strapi.Dockerfile",
              tag: "strapi",
            }
    env:
      DATABASE_USER_MONGODB: ${{ vars.DATABASE_USER_MONGODB }}
      DATABASE_PASSWORD_MONGODB: ${{ secrets.DATABASE_PASSWORD_MONGODB }}
      CMS_DATABASE_NAME: ${{ vars.CMS_DATABASE_NAME }}
      CMS_DATABASE_USERNAME: ${{ vars.CMS_DATABASE_USERNAME }}
      CMS_DATABASE_PASSWORD: ${{ secrets.CMS_DATABASE_PASSWORD }}
      CMS_DATABASE_CLIENT: ${{ vars.CMS_DATABASE_CLIENT }}
      CMS_NODE_ENV: ${{ vars.CMS_NODE_ENV }}
      CMS_DATABASE_HOST: ${{ vars.CMS_DATABASE_HOST }}
      CMS_DATABASE_PORT: ${{ vars.CMS_DATABASE_PORT }}
      CMS_JWT_SECRET: ${{ secrets.CMS_JWT_SECRET }}
      CMS_ADMIN_JWT_SECRET: ${{ secrets.CMS_ADMIN_JWT_SECRET }}
      CMS_APP_KEYS: ${{ secrets.CMS_APP_KEYS }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      RABBITMQ_USER: ${{ vars.RABBITMQ_USER }}
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
      DATABASE_PASSWORD_SQLSERVER: ${{ secrets.DATABASE_PASSWORD_SQLSERVER }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Image Name to Lowercase
        id: infra_lower
        run: |
          echo "name=$(echo '${{ matrix.image.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build & Push Infrastructure Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: |
            DATABASE_USER_MONGODB=${{ env.DATABASE_USER_MONGODB }}
            DATABASE_PASSWORD_MONGODB=${{ env.DATABASE_PASSWORD_MONGODB }}
            CMS_DATABASE_NAME=${{ env.CMS_DATABASE_NAME }}
            CMS_DATABASE_USERNAME=${{ env.CMS_DATABASE_USERNAME }}
            CMS_DATABASE_PASSWORD=${{ env.CMS_DATABASE_PASSWORD }}
            CMS_DATABASE_CLIENT=${{ env.CMS_DATABASE_CLIENT }}
            CMS_NODE_ENV=${{ env.CMS_NODE_ENV }}
            CMS_DATABASE_HOST=${{ env.CMS_DATABASE_HOST }}
            CMS_DATABASE_PORT=${{ env.CMS_DATABASE_PORT }}
            CMS_JWT_SECRET=${{ env.CMS_JWT_SECRET }}
            CMS_ADMIN_JWT_SECRET=${{ env.CMS_ADMIN_JWT_SECRET }}
            CMS_APP_KEYS=${{ env.CMS_APP_KEYS }}
            REDIS_PASSWORD=${{ env.REDIS_PASSWORD }}
            RABBITMQ_USER=${{ env.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ env.RABBITMQ_PASSWORD }}
            DATABASE_PASSWORD_SQLSERVER=${{ env.DATABASE_PASSWORD_SQLSERVER }}
          tags: ghcr.io/${{ needs.get_repo_owner.outputs.owner }}/micros/infra/${{ steps.infra_lower.outputs.name }}:${{ needs.determine_docker_tag.outputs.docker_tag }}-latest
          push: true

  determine_catalog:
    name: Determine IX Apps Catalog
    runs-on: ubuntu-latest
    needs: [validate_schedule]
    if: needs.validate_schedule.outputs.result == 'success'
    outputs:
      catalog: ${{ steps.catalog_set.outputs.catalog }}
    steps:
      - name: Set default catalog to dev
        run: echo "CATALOG=dev" >> "$GITHUB_ENV"
      - name: Override to stable if on production branch
        if: endsWith(github.ref, '/production')
        run: echo "CATALOG=stable" >> "$GITHUB_ENV"
      - name: Override to dev if on releases/*
        if: startsWith(github.ref, 'refs/heads/releases/')
        run: echo "CATALOG=dev" >> "$GITHUB_ENV"
      - name: Output catalog name
        id: catalog_set
        run: echo "catalog=${{ env.CATALOG }}" >> "$GITHUB_OUTPUT"
