name: CI Pipeline

# This workflow validates code and creates a release tag on push to develop:
# 1. Builds all .NET microservices (compile + unit tests)
# 2. Builds React frontends (compile + tests)
# 3. Creates a CalVer version tag to trigger the CD pipeline
#    — format: vYYYY.MM.DD-{run_number} (pre-release → Development environment)
#    — to deploy to Production, manually push a stable tag, e.g. v1.0.0
#
# Triggers:
# - Push to develop branch when relevant source files change
# - Manual workflow_dispatch (skips tag creation to avoid unintended releases)

on:
  push:
    branches:
      - develop
    paths:
      - 'Services/**'
      - 'Tests/**'
      - 'Frontends/**'
      - 'CMS/**'
      - 'Docker/**'
      - 'Micros.sln'
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_dotnet_services:
    name: Build & Test .NET Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ["CompanyAPI", "DJHostGateway", "DocumentsAPI", "EquipmentAPI", "IdentityAPI", "MailingAPI", "MusicAPI", "PartyAPI"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Build .NET Service
        uses: ./.github/templates/build-dotnet-service
        with:
          service: ${{ matrix.service }}

  build_react_frontends:
    name: Build & Test React Frontends
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ["dj-panel"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Build React Service
        uses: ./.github/templates/build-react-service
        with:
          service: ${{ matrix.service }}

  create_release_tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only create the tag on a real branch push — not on manual dispatch
    if: github.event_name == 'push'
    needs:
      - build_dotnet_services
      - build_react_frontends
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Create and push version tag
        uses: ./.github/templates/create-version-tag
        with:
          github-token: ${{ secrets.PIPELINE_PAT }}
