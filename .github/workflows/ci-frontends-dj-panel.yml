name: CI - Frontends - DJ Panel

# Triggers on changes to the dj-panel frontend or its Docker configuration,
# giving developers fast feedback without waiting for all other components to build.

on:
  push:
    branches:
      - develop
    paths:
      - 'Frontends/dj-panel/**'
      - 'Docker/frontends/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test DJ Panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Build React Service
        uses: ./.github/templates/build-react-service
        with:
          service: dj-panel
