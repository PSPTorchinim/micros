name: CI - Infra RabbitMQ

# Triggers on changes to the RabbitMQ Dockerfile,
# linting it to catch issues before they reach the CD pipeline.

on:
  push:
    branches:
      - develop
    paths:
      - 'Docker/infra/rabbitmq.Dockerfile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint RabbitMQ Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Docker/infra/rabbitmq.Dockerfile
