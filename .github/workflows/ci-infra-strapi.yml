name: CI - Infra Strapi

# Triggers on changes to the Strapi Dockerfile or CMS source,
# linting the Dockerfile to catch issues before they reach the CD pipeline.

on:
  push:
    branches:
      - develop
    paths:
      - 'Docker/infra/strapi.Dockerfile'
      - 'CMS/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Strapi Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Docker/infra/strapi.Dockerfile
