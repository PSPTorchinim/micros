name: PR Validation

# This workflow validates pull requests before merging:
# 1. Builds all .NET microservices to check for compilation errors
# 2. Builds React frontends and runs tests (unit + E2E)
# 3. Lints all Dockerfiles for best practices
# 4. Validates Docker Compose configurations
# 5. Lints GitHub Actions workflow files
# All checks must pass before PR can be merged

on:
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Lint all Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "*.Dockerfile"
          recursive: true

  validate_dotnet:
    name: Build & Test .NET Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          [
            "CompanyAPI",
            "DJHostGateway",
            "DocumentsAPI",
            "EquipmentAPI",
            "IdentityAPI",
            "MailingAPI",
            "MusicAPI",
            "PartyAPI",
          ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Build .NET Service
        uses: ./.github/templates/build-dotnet-service
        with:
          service: ${{ matrix.service }}

  validate_react:
    name: Build & Test React Frontends
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ["dj-panel"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Build React Service
        uses: ./.github/templates/build-react-service
        with:
          service: ${{ matrix.service }}

  validate_composers:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Docker Compose YAML
        run: |
          docker compose -f Docker/dj-panel-composer.yml config

  validate_infrastructure:
    name: Validate Infrastructure Apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: "mongodb", dockerfile: "Docker/infra/mongodb.Dockerfile" }
          - { name: "postgres", dockerfile: "Docker/infra/postgres.Dockerfile" }
          - { name: "redis", dockerfile: "Docker/infra/redis.Dockerfile" }
          - { name: "rabbitmq", dockerfile: "Docker/infra/rabbitmq.Dockerfile" }
          - { name: "sqlserver", dockerfile: "Docker/infra/sqlserver.Dockerfile" }
          - { name: "strapi", dockerfile: "Docker/infra/strapi.Dockerfile" }
          - { name: "loki", dockerfile: "Docker/infra/loki.Dockerfile" }
          - { name: "promtail", dockerfile: "Docker/infra/promtail.Dockerfile" }
          - { name: "grafana", dockerfile: "Docker/infra/grafana.Dockerfile" }
          - { name: "prometheus", dockerfile: "Docker/infra/prometheus.Dockerfile" }
          - { name: "sqlserver-exporter", dockerfile: "Docker/infra/sqlserver-exporter.Dockerfile" }
          - { name: "mongodb-exporter", dockerfile: "Docker/infra/mongodb-exporter.Dockerfile" }
          - { name: "postgres-exporter", dockerfile: "Docker/infra/postgres-exporter.Dockerfile" }
          - { name: "redis-exporter", dockerfile: "Docker/infra/redis-exporter.Dockerfile" }
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Infrastructure Image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: test/${{ matrix.image.name }}:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate_github_workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@v1

  report_status:
    name: PR Validation
    runs-on: ubuntu-latest
    needs:
      - lint_dockerfiles
      - validate_dotnet
      - validate_react
      - validate_composers
      - validate_infrastructure
      - validate_github_workflows
    if: always()
    steps:
      - name: Report overall status
        run: |
          echo "=========================================="
          echo "PR Validation Status Report"
          echo "=========================================="
          echo "Dockerfile Lint:       ${{ needs.lint_dockerfiles.result }}"
          echo "DotNet Build:          ${{ needs.validate_dotnet.result }}"
          echo "React Build:           ${{ needs.validate_react.result }}"
          echo "Compose Validation:    ${{ needs.validate_composers.result }}"
          echo "Infrastructure Build:  ${{ needs.validate_infrastructure.result }}"
          echo "Workflow Lint:         ${{ needs.validate_github_workflows.result }}"
          echo "=========================================="

          if [ "${{ needs.lint_dockerfiles.result }}" = "success" ] && \
             [ "${{ needs.validate_dotnet.result }}" = "success" ] && \
             [ "${{ needs.validate_react.result }}" = "success" ] && \
             [ "${{ needs.validate_composers.result }}" = "success" ] && \
             [ "${{ needs.validate_infrastructure.result }}" = "success" ] && \
             [ "${{ needs.validate_github_workflows.result }}" = "success" ]; \
          then
            echo "✅ All validation jobs succeeded."
            exit 0
          else
            echo "❌ One or more validation jobs failed."
            exit 1
          fi
