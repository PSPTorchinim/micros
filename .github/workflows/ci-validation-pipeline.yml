name: PR Validation

# This workflow validates pull requests before merging:
# 1. Detects which parts of the system changed to skip unaffected jobs
# 2. Builds changed .NET microservices to check for compilation errors
# 3. Builds React frontends and runs tests (unit + E2E) when frontend changes
# 4. Lints Dockerfiles for best practices when Dockerfiles change
# 5. Validates Docker Compose configurations with YAML linting when they change
# 6. Validates .vscode/tasks.json and .vscode/launch.json as JSONC when they change
# 7. Lints GitHub Actions workflow files when workflows change
# 8. Performs CodeQL security analysis on changed code (C# and/or JavaScript/TypeScript)
# 9. Audits npm packages for security vulnerabilities when package files change
# 10. Audits .NET NuGet packages for security vulnerabilities when project files change
# All triggered checks must pass before PR can be merged

on:
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  detect_changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dotnet_services: ${{ steps.set-dotnet-matrix.outputs.services }}
      react_services: ${{ steps.filter.outputs.react }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      docker_compose: ${{ steps.filter.outputs.docker_compose }}
      vscode: ${{ steps.filter.outputs.vscode }}
      github_workflows: ${{ steps.filter.outputs.github_workflows }}
      codeql_languages: ${{ steps.set-codeql-matrix.outputs.languages }}
      npm_packages: ${{ steps.filter.outputs.npm_packages }}
      dotnet_packages: ${{ steps.filter.outputs.dotnet_packages }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared_dotnet:
              - 'Services/Shared/**'
              - 'Tests/Shared.Tests/**'
              - 'Micros.sln'
            CompanyAPI:
              - 'Services/CompanyAPI/**'
              - 'Tests/CompanyAPI.Tests/**'
            DJHostGateway:
              - 'Services/DJHostGateway/**'
              - 'Tests/DJHostGateway.Tests/**'
            DocumentsAPI:
              - 'Services/DocumentsAPI/**'
              - 'Tests/DocumentsAPI.Tests/**'
            EquipmentAPI:
              - 'Services/EquipmentAPI/**'
              - 'Tests/EquipmentAPI.Tests/**'
            IdentityAPI:
              - 'Services/IdentityAPI/**'
              - 'Tests/IdentityAPI.Tests/**'
            MailingAPI:
              - 'Services/MailingAPI/**'
              - 'Tests/MailingAPI.Tests/**'
            MusicAPI:
              - 'Services/MusicAPI/**'
              - 'Tests/MusicAPI.Tests/**'
            PartyAPI:
              - 'Services/PartyAPI/**'
              - 'Tests/PartyAPI.Tests/**'
            react:
              - 'Frontends/**'
            dockerfiles:
              - '**/*.Dockerfile'
            docker_compose:
              - 'Docker/dj-panel-composer.yml'
            vscode:
              - '.vscode/**'
            github_workflows:
              - '.github/**'
            csharp:
              - 'Services/**'
              - 'Tests/**'
            javascript:
              - 'Frontends/**'
              - 'CMS/**'
            npm_packages:
              - 'package.json'
              - 'package-lock.json'
              - 'Frontends/dj-panel/package.json'
              - 'Frontends/dj-panel/package-lock.json'
            dotnet_packages:
              - '**/*.csproj'
              - 'Micros.sln'

      - name: Set .NET services matrix
        id: set-dotnet-matrix
        run: |
          SERVICES=()
          if [ "${{ steps.filter.outputs.shared_dotnet }}" = "true" ]; then
            # Shared library changed — all services must be validated
            SERVICES=("CompanyAPI" "DJHostGateway" "DocumentsAPI" "EquipmentAPI" "IdentityAPI" "MailingAPI" "MusicAPI" "PartyAPI")
          else
            [ "${{ steps.filter.outputs.CompanyAPI }}"    = "true" ] && SERVICES+=("CompanyAPI")
            [ "${{ steps.filter.outputs.DJHostGateway }}" = "true" ] && SERVICES+=("DJHostGateway")
            [ "${{ steps.filter.outputs.DocumentsAPI }}"  = "true" ] && SERVICES+=("DocumentsAPI")
            [ "${{ steps.filter.outputs.EquipmentAPI }}"  = "true" ] && SERVICES+=("EquipmentAPI")
            [ "${{ steps.filter.outputs.IdentityAPI }}"   = "true" ] && SERVICES+=("IdentityAPI")
            [ "${{ steps.filter.outputs.MailingAPI }}"    = "true" ] && SERVICES+=("MailingAPI")
            [ "${{ steps.filter.outputs.MusicAPI }}"      = "true" ] && SERVICES+=("MusicAPI")
            [ "${{ steps.filter.outputs.PartyAPI }}"      = "true" ] && SERVICES+=("PartyAPI")
          fi

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo 'services=[]' >> "$GITHUB_OUTPUT"
          else
            JSON="["
            for i in "${!SERVICES[@]}"; do
              [ "$i" -gt 0 ] && JSON+=","
              JSON+="\"${SERVICES[$i]}\""
            done
            JSON+="]"
            echo "services=$JSON" >> "$GITHUB_OUTPUT"
          fi

      - name: Set CodeQL languages matrix
        id: set-codeql-matrix
        run: |
          LANGS=()
          [ "${{ steps.filter.outputs.csharp }}"      = "true" ] && LANGS+=("csharp")
          [ "${{ steps.filter.outputs.javascript }}"   = "true" ] && LANGS+=("javascript-typescript")

          if [ ${#LANGS[@]} -eq 0 ]; then
            echo 'languages=[]' >> "$GITHUB_OUTPUT"
          else
            JSON="["
            for i in "${!LANGS[@]}"; do
              [ "$i" -gt 0 ] && JSON+=","
              JSON+="\"${LANGS[$i]}\""
            done
            JSON+="]"
            echo "languages=$JSON" >> "$GITHUB_OUTPUT"
          fi

  lint_dockerfiles:
    name: Lint Dockerfiles
    needs: detect_changes
    if: needs.detect_changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Lint all Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "*.Dockerfile"
          recursive: true

  validate_dotnet:
    name: Build & Test .NET Services
    needs: detect_changes
    if: needs.detect_changes.outputs.dotnet_services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect_changes.outputs.dotnet_services) }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Build .NET Service
        uses: ./.github/templates/build-dotnet-service
        with:
          service: ${{ matrix.service }}

  validate_react:
    name: Build & Test React Frontends
    needs: detect_changes
    if: needs.detect_changes.outputs.react_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ["dj-panel"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Build React Service
        uses: ./.github/templates/build-react-service
        with:
          service: ${{ matrix.service }}

  validate_composers:
    name: Validate Docker Compose files
    needs: detect_changes
    if: needs.detect_changes.outputs.docker_compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Validate Docker Compose YAML
        # Using 'relaxed' config to focus on syntax errors rather than style
        # Docker Compose files don't require YAML document markers (---)
        run: |
          yamllint -d relaxed Docker/dj-panel-composer.yml

  validate_vscode:
    name: Validate VS Code configuration
    needs: detect_changes
    if: needs.detect_changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate .vscode JSON configs
        run: node scripts/validate-vscode.js

  validate_github_workflows:
    name: Validate GitHub Actions workflows
    needs: detect_changes
    if: needs.detect_changes.outputs.github_workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@v2
        with:
          # deployment_protection_rule is a valid GitHub event not yet in actionlint's schema
          flags: "-ignore deployment_protection_rule"

  security_codeql:
    name: CodeQL Security Analysis
    needs: detect_changes
    if: needs.detect_changes.outputs.codeql_languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect_changes.outputs.codeql_languages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build .NET solution
        if: matrix.language == 'csharp'
        run: dotnet build Micros.sln --configuration Release

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies for JavaScript/TypeScript projects
        if: matrix.language == 'javascript-typescript'
        run: |
          npm install
          cd ${{ github.workspace }}/Frontends/dj-panel && npm install
          cd ${{ github.workspace }}/CMS && npm install

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  security_npm_audit:
    name: npm Package Security Audit
    needs: detect_changes
    if: needs.detect_changes.outputs.npm_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Audit root npm packages
        run: |
          echo "=========================================="
          echo "Auditing root package.json dependencies"
          echo "=========================================="
          npm audit --audit-level=moderate || true
          npm audit --audit-level=moderate --json > /tmp/root-audit.json || true
          
          # Check for high or critical vulnerabilities
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/root-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' /tmp/root-audit.json)
          
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Found critical or high severity vulnerabilities in root dependencies"
            npm audit --audit-level=high
            exit 1
          fi
          
          echo "✅ No critical or high severity vulnerabilities found in root dependencies"

      - name: Audit dj-panel npm packages
        run: |
          cd ${{ github.workspace }}/Frontends/dj-panel
          echo "=========================================="
          echo "Auditing dj-panel package.json dependencies"
          echo "=========================================="
          npm audit --audit-level=moderate || true
          npm audit --audit-level=moderate --json > /tmp/dj-panel-audit.json || true
          
          # Check for high or critical vulnerabilities
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/dj-panel-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' /tmp/dj-panel-audit.json)
          
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Found critical or high severity vulnerabilities in dj-panel dependencies"
            npm audit --audit-level=high
            exit 1
          fi
          
          echo "✅ No critical or high severity vulnerabilities found in dj-panel dependencies"

  security_dotnet_audit:
    name: .NET Package Security Audit
    needs: detect_changes
    if: needs.detect_changes.outputs.dotnet_packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Audit .NET packages for vulnerabilities
        run: |
          echo "=========================================="
          echo ".NET Package Vulnerability Audit"
          echo "=========================================="
          
          # Check for vulnerable packages in the solution
          dotnet list Micros.sln package --vulnerable --include-transitive 2>&1 | tee /tmp/dotnet-audit.txt
          
          # Check if any vulnerabilities were found (excluding the header lines)
          if grep -q "has the following vulnerable packages" /tmp/dotnet-audit.txt; then
            echo "❌ Found vulnerable packages in .NET dependencies"
            exit 1
          fi
          
          echo "✅ No vulnerable packages found in .NET dependencies"

  report_status:
    name: PR Validation
    runs-on: ubuntu-latest
    needs:
      - detect_changes
      - lint_dockerfiles
      - validate_dotnet
      - validate_react
      - validate_composers
      - validate_vscode
      - validate_github_workflows
      - security_codeql
      - security_npm_audit
      - security_dotnet_audit
    if: always()
    steps:
      - name: Report overall status
        run: |
          echo "=========================================="
          echo "PR Validation Status Report"
          echo "=========================================="
          echo "Change Detection:       ${{ needs.detect_changes.result }}"
          echo "Dockerfile Lint:        ${{ needs.lint_dockerfiles.result }}"
          echo "DotNet Build:           ${{ needs.validate_dotnet.result }}"
          echo "React Build:            ${{ needs.validate_react.result }}"
          echo "Compose Validation:     ${{ needs.validate_composers.result }}"
          echo "VS Code Validation:     ${{ needs.validate_vscode.result }}"
          echo "Workflow Lint:          ${{ needs.validate_github_workflows.result }}"
          echo "CodeQL Security:        ${{ needs.security_codeql.result }}"
          echo "npm Package Security:   ${{ needs.security_npm_audit.result }}"
          echo ".NET Package Security:  ${{ needs.security_dotnet_audit.result }}"
          echo "=========================================="

          # A job result of 'skipped' means its files were not changed — treat as passing.
          # Only 'failure' or 'cancelled' results indicate a problem.
          result_ok() {
            [ "$1" = "success" ] || [ "$1" = "skipped" ]
          }

          if result_ok "${{ needs.detect_changes.result }}" && \
             result_ok "${{ needs.lint_dockerfiles.result }}" && \
             result_ok "${{ needs.validate_dotnet.result }}" && \
             result_ok "${{ needs.validate_react.result }}" && \
             result_ok "${{ needs.validate_composers.result }}" && \
             result_ok "${{ needs.validate_vscode.result }}" && \
             result_ok "${{ needs.validate_github_workflows.result }}" && \
             result_ok "${{ needs.security_codeql.result }}" && \
             result_ok "${{ needs.security_npm_audit.result }}" && \
             result_ok "${{ needs.security_dotnet_audit.result }}"; \
          then
            echo "✅ All validation jobs succeeded or were skipped (no relevant changes)."
            exit 0
          else
            echo "❌ One or more validation jobs failed."
            exit 1
          fi
