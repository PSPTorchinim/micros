name: PR Validation

# This workflow validates pull requests before merging:
# 1. Builds all .NET microservices to check for compilation errors
# 2. Builds React frontends and runs tests (unit + E2E)
# 3. Lints all Dockerfiles for best practices
# 4. Validates Docker Compose configurations with YAML linting
# 5. Lints GitHub Actions workflow files
# 6. Performs CodeQL security analysis on code (C# and JavaScript/TypeScript)
# 7. Audits npm packages for security vulnerabilities (root, dj-panel, CMS)
# 8. Audits .NET NuGet packages for security vulnerabilities
# 9. Lints PR commit messages against Conventional Commits specification
# All checks must pass before PR can be merged

on:
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint_dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Lint all Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "*.Dockerfile"
          recursive: true

  validate_dotnet:
    name: Build & Test .NET Services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          [
            "CompanyAPI",
            "DJHostGateway",
            "DocumentsAPI",
            "EquipmentAPI",
            "IdentityAPI",
            "MailingAPI",
            "MusicAPI",
            "PartyAPI",
          ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Build .NET Service
        uses: ./.github/templates/build-dotnet-service
        with:
          service: ${{ matrix.service }}

  validate_react:
    name: Build & Test React Frontends
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ["dj-panel"]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Build React Service
        uses: ./.github/templates/build-react-service
        with:
          service: ${{ matrix.service }}

  validate_composers:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install yamllint
        run: pip install yamllint==1.37.1

      - name: Validate Docker Compose YAML
        # Using 'relaxed' config to focus on syntax errors rather than style
        # Docker Compose files don't require YAML document markers (---)
        run: |
          yamllint -d relaxed Docker/dj-panel-composer.yml

  validate_github_workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@v2

  security_codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['csharp', 'javascript-typescript']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build .NET solution
        if: matrix.language == 'csharp'
        run: dotnet build Micros.sln --configuration Release

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies for JavaScript/TypeScript projects
        if: matrix.language == 'javascript-typescript'
        run: |
          npm install
          cd ${{ github.workspace }}/Frontends/dj-panel && npm install
          cd ${{ github.workspace }}/CMS && npm install

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  security_npm_audit:
    name: npm Package Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Audit root npm packages
        run: |
          echo "=========================================="
          echo "Auditing root package.json dependencies"
          echo "=========================================="
          npm audit --audit-level=moderate || true
          npm audit --audit-level=moderate --json > /tmp/root-audit.json || true
          
          # Check for high or critical vulnerabilities
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/root-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' /tmp/root-audit.json)
          
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Found critical or high severity vulnerabilities in root dependencies"
            npm audit --audit-level=high
            exit 1
          fi
          
          echo "✅ No critical or high severity vulnerabilities found in root dependencies"

      - name: Audit dj-panel npm packages
        run: |
          cd ${{ github.workspace }}/Frontends/dj-panel
          echo "=========================================="
          echo "Auditing dj-panel package.json dependencies"
          echo "=========================================="
          npm audit --audit-level=moderate || true
          npm audit --audit-level=moderate --json > /tmp/dj-panel-audit.json || true
          
          # Check for high or critical vulnerabilities
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/dj-panel-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' /tmp/dj-panel-audit.json)
          
          echo "Critical vulnerabilities: $CRITICAL"
          echo "High vulnerabilities: $HIGH"
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Found critical or high severity vulnerabilities in dj-panel dependencies"
            npm audit --audit-level=high
            exit 1
          fi
          
          echo "✅ No critical or high severity vulnerabilities found in dj-panel dependencies"

  security_dotnet_audit:
    name: .NET Package Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Audit .NET packages for vulnerabilities
        run: |
          echo "=========================================="
          echo ".NET Package Vulnerability Audit"
          echo "=========================================="
          
          # Check for vulnerable packages in the solution
          dotnet list Micros.sln package --vulnerable --include-transitive 2>&1 | tee /tmp/dotnet-audit.txt
          
          # Check if any vulnerabilities were found (excluding the header lines)
          if grep -q "has the following vulnerable packages" /tmp/dotnet-audit.txt; then
            echo "❌ Found vulnerable packages in .NET dependencies"
            exit 1
          fi
          
          echo "✅ No vulnerable packages found in .NET dependencies"

  validate_commit_messages:
    name: Lint PR Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!startsWith(github.head_ref, 'releases/')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install commitlint
        run: npm install

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  report_status:
    name: PR Validation
    runs-on: ubuntu-latest
    needs:
      - lint_dockerfiles
      - validate_dotnet
      - validate_react
      - validate_composers
      - validate_github_workflows
      - security_codeql
      - security_npm_audit
      - security_dotnet_audit
      - validate_commit_messages
    if: always()
    steps:
      - name: Report overall status
        run: |
          echo "=========================================="
          echo "PR Validation Status Report"
          echo "=========================================="
          echo "Dockerfile Lint:        ${{ needs.lint_dockerfiles.result }}"
          echo "DotNet Build:           ${{ needs.validate_dotnet.result }}"
          echo "React Build:            ${{ needs.validate_react.result }}"
          echo "Compose Validation:     ${{ needs.validate_composers.result }}"
          echo "Workflow Lint:          ${{ needs.validate_github_workflows.result }}"
          echo "CodeQL Security:        ${{ needs.security_codeql.result }}"
          echo "npm Package Security:   ${{ needs.security_npm_audit.result }}"
          echo ".NET Package Security:  ${{ needs.security_dotnet_audit.result }}"
          echo "Commit Messages Lint:   ${{ needs.validate_commit_messages.result }}"
          echo "=========================================="

          if [ "${{ needs.lint_dockerfiles.result }}" = "success" ] && \
             [ "${{ needs.validate_dotnet.result }}" = "success" ] && \
             [ "${{ needs.validate_react.result }}" = "success" ] && \
             [ "${{ needs.validate_composers.result }}" = "success" ] && \
             [ "${{ needs.validate_github_workflows.result }}" = "success" ] && \
             [ "${{ needs.security_codeql.result }}" = "success" ] && \
             [ "${{ needs.security_npm_audit.result }}" = "success" ] && \
             [ "${{ needs.security_dotnet_audit.result }}" = "success" ] && \
             ([ "${{ needs.validate_commit_messages.result }}" = "success" ] || [ "${{ needs.validate_commit_messages.result }}" = "skipped" ]); \
          then
            echo "✅ All validation jobs succeeded."
            exit 0
          else
            echo "❌ One or more validation jobs failed."
            exit 1
          fi
