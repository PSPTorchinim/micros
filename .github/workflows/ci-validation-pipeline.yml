name: PR Validation

on:
  pull_request:

jobs:
  validate_dotnet:
    name: Build - DotNet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            "CompanyAPI",
            "DJHostGateway",
            "DocumentsAPI",
            "EquipmentAPI",
            "IdentityAPI",
            "MailingAPI",
            "MusicAPI",
            "PartyAPI",
          ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x"

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Show dotnet version
        run: dotnet --version

      - name: Update dotnet-ef tool
        run: dotnet tool update --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore "Services/${{ matrix.service }}"

      - name: Check for DbContext
        run: |
          if dotnet ef dbcontext info --no-build -p "Services/${{ matrix.service }}" >/dev/null 2>&1; then
            echo "DbContext found."
          else
            echo "No DbContext found (or no design-time factory)."
          fi

      - name: Build project
        run: dotnet build "Services/${{ matrix.service }}" --no-restore -c Debug

      - name: Run tests (if present)
        run: |
          if [ -d "Tests/${{ matrix.service }}.Tests" ]; then
            dotnet test "Tests/${{ matrix.service }}.Tests" --no-build --collect:"XPlat Code Coverage"
          else
            echo "No Tests/${{ matrix.service }}.Tests directory; skipping tests."
          fi
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

  validate_react:
    name: Build - React
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ["dj-panel"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Use Node version
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: Frontends/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: Frontends/${{ matrix.service }}
        run: npm install --retry 5 --fetch-retries 5 --fetch-retry-mintimeout 20000

      - name: Lint
        working-directory: Frontends/${{ matrix.service }}
        run: npm run lint

      - name: Prettier check
        working-directory: Frontends/${{ matrix.service }}
        run: npm run format:check

      - name: Build
        working-directory: Frontends/${{ matrix.service }}
        run: npm run build

      - name: Test (skip if script missing)
        working-directory: Frontends/${{ matrix.service }}
        run: |
          npm run test

  validate_dockerfiles:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Hadolint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: |
            Docker/microservice.Dockerfile
            Docker/microfrontend.Dockerfile

  validate_composers:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Docker Compose YAML
        run: |
          docker compose -f Docker/dj-panel-composer.yml config

  validate_github_workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@v1
