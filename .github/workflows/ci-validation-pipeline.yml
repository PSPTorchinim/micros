name: PR Validation

on:
  pull_request:

jobs:
  determine_environment:
    runs-on: ubuntu-latest
    name: Determine Environment
    outputs:
      current_env: ${{ steps.set_env.outputs.current_env }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Set Environment
        id: set_env
        uses: ./.github/templates/determine-environment

  validate_dotnet:
    name: Build - DotNet
    runs-on: ubuntu-latest
    needs: determine_environment
    environment: ${{ needs.determine_environment.outputs.current_env }}
    timeout-minutes: 15
    strategy:
      matrix:
        service:
          [
            "CompanyAPI",
            "DJHostGateway",
            "DocumentsAPI",
            "EquipmentAPI",
            "IdentityAPI",
            "MailingAPI",
            "MusicAPI",
            "PartyAPI",
          ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build .NET Service
        uses: ./.github/templates/build-dotnet-service
        with:
          service: ${{ matrix.service }}

  validate_react:
    name: Build - React
    needs: determine_environment
    environment: ${{ needs.determine_environment.outputs.current_env }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: ["dj-panel"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build React Service
        uses: ./.github/templates/build-react-service
        with:
          service: ${{ matrix.service }}

  validate_dockerfiles:
    name: Validate Dockerfiles
    needs: determine_environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        file:
          [
            "services/dotnet",
            "frontends/react",
            "infra/mongodb",
            "infra/postgres",
            "infra/redis",
            "infra/rabbitmq",
            "infra/sqlserver",
            "infra/strapi",
          ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Hadolint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Docker/${{ matrix.file }}.Dockerfile

  validate_composers:
    name: Validate Docker Compose files
    needs: determine_environment
    environment: ${{ needs.determine_environment.outputs.current_env }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Docker Compose YAML
        run: |
          docker compose -f Docker/dj-panel-composer.yml config

  validate_github_workflows:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    needs: determine_environment
    environment: ${{ needs.determine_environment.outputs.current_env }}
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lint workflows with actionlint
        uses: raven-actions/actionlint@v1

  validate_kubernetes:
    name: Validate Kubernetes YAML (Helm templates)
    needs: determine_environment
    environment: ${{ needs.determine_environment.outputs.current_env }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Render Helm templates
        run: |
          helm template test ./k8s -f ./k8s/values.yaml > rendered.yaml

      - name: Validate rendered Kubernetes YAML
        run: |
          kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.27.2 rendered.yaml

  report_status:
    name: PR Validation
    runs-on: ubuntu-latest
    needs:
      - validate_dotnet
      - validate_react
      - validate_dockerfiles
      - validate_composers
      - validate_github_workflows
      - validate_kubernetes
    if: always()
    steps:
      - name: Report overall status
        run: |
          if [ "${{ needs.validate_dotnet.result }}" = "success" ] && \
             [ "${{ needs.validate_react.result }}" = "success" ] && \
             [ "${{ needs.validate_dockerfiles.result }}" = "success" ] && \
             [ "${{ needs.validate_composers.result }}" = "success" ] && \
             [ "${{ needs.validate_github_workflows.result }}" = "success" ] && \
             [ "${{ needs.validate_kubernetes.result }}" = "success" ]; then
            echo "All jobs succeeded."
            exit 0
          else
            echo "One or more jobs failed."
            exit 1
          fi
