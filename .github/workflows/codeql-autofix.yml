name: CodeQL Auto-Fix

# This workflow automatically fixes CodeQL security vulnerabilities found in PRs to release branches
# It triggers after CodeQL scans complete and applies suggested fixes automatically

on:
  workflow_run:
    workflows: ["PR Validation"]
    types:
      - completed
    branches:
      - 'releases/**'

# Required permissions for creating commits and accessing security data
permissions:
  contents: write
  security-events: read
  pull-requests: write

jobs:
  autofix:
    name: Apply CodeQL Auto-Fixes
    runs-on: ubuntu-latest
    # Only run if the triggering workflow completed successfully and on PRs
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    
    steps:
      - name: Get PR Information
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            // Get the PR associated with this workflow run
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`
            });
            
            if (pullRequests.length === 0) {
              core.setFailed('No open PR found for this branch');
              return;
            }
            
            const pr = pullRequests[0];
            const targetBranch = pr.base.ref;
            
            // Only process PRs targeting release branches
            if (!targetBranch.startsWith('releases/')) {
              core.info(`PR targets ${targetBranch}, not a release branch. Skipping auto-fix.`);
              core.setOutput('should_run', 'false');
              return;
            }
            
            core.setOutput('pr_number', pr.number.toString());
            core.setOutput('pr_head_ref', pr.head.ref);
            core.setOutput('pr_head_sha', pr.head.sha);
            core.setOutput('should_run', 'true');
            core.info(`Found PR #${pr.number} targeting ${targetBranch}`);

      - name: Checkout PR Branch
        if: steps.pr_info.outputs.should_run == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr_info.outputs.pr_head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch CodeQL Alerts
        if: steps.pr_info.outputs.should_run == 'true'
        id: fetch_alerts
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch CodeQL alerts for this repository
            const { data: alerts } = await github.rest.codeScanning.listAlertsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            // Filter alerts that affect files in the current PR
            const prFiles = new Set();
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.pr_info.outputs.pr_number }}
            });
            
            files.forEach(file => prFiles.add(file.filename));
            
            const relevantAlerts = alerts.filter(alert => 
              alert.most_recent_instance && 
              prFiles.has(alert.most_recent_instance.location.path)
            );
            
            core.info(`Found ${relevantAlerts.length} CodeQL alerts affecting PR files`);
            core.setOutput('alerts_count', relevantAlerts.length.toString());
            core.setOutput('has_alerts', relevantAlerts.length > 0 ? 'true' : 'false');
            
            // Store alert details for processing
            return relevantAlerts;

      - name: Setup Node.js for JavaScript/TypeScript fixes
        if: steps.pr_info.outputs.should_run == 'true' && steps.fetch_alerts.outputs.has_alerts == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup .NET for C# fixes
        if: steps.pr_info.outputs.should_run == 'true' && steps.fetch_alerts.outputs.has_alerts == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Run Auto-Fix Script
        if: steps.pr_info.outputs.should_run == 'true' && steps.fetch_alerts.outputs.has_alerts == 'true'
        id: apply_fixes
        env:
          CODEQL_ALERTS: ${{ steps.fetch_alerts.outputs.result }}
        run: |
          echo "Running CodeQL auto-fix analysis..."
          set +e  # Don't exit on error
          node .github/scripts/codeql-autofix.js
          EXIT_CODE=$?
          set -e
          
          if [ -f codeql-report.md ]; then
            echo "report_generated=true" >> $GITHUB_OUTPUT
            echo "Report generated successfully (exit code: $EXIT_CODE)"
          else
            echo "report_generated=false" >> $GITHUB_OUTPUT
            echo "No report generated (exit code: $EXIT_CODE)"
            if [ $EXIT_CODE -ne 0 ]; then
              echo "::warning::CodeQL auto-fix script exited with code $EXIT_CODE"
            fi
          fi

      - name: Post Report to PR
        if: steps.pr_info.outputs.should_run == 'true' && steps.apply_fixes.outputs.report_generated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = ${{ steps.pr_info.outputs.pr_number }};
            const alertsCount = ${{ steps.fetch_alerts.outputs.alerts_count }};
            
            // Read the generated report
            const report = fs.readFileSync('codeql-report.md', 'utf8');
            
            const comment = `## 🔍 CodeQL Security Analysis Results
            
            This PR has **${alertsCount}** CodeQL security alert(s) that require attention.
            
            ${report}
            
            ### Resources:
            - [CodeQL Documentation](https://codeql.github.com/docs/)
            - [Security Best Practices](https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/about-code-scanning)
            - [View All Alerts](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning)
            
            ---
            *This comment was automatically generated by the CodeQL Auto-Fix workflow*`;
            
            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('CodeQL Security Analysis Results')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
              core.info('Updated existing CodeQL alert comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
              core.info('Created new CodeQL alert comment');
            }

      - name: Check for Applied Fixes
        if: steps.pr_info.outputs.should_run == 'true' && steps.fetch_alerts.outputs.has_alerts == 'true'
        id: check_fixes
        run: |
          # Check if any files were modified by potential auto-fixes
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected that can be committed"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No automatic changes to commit"
          fi

      - name: Commit and Push Auto-Fixes
        if: steps.check_fixes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: apply CodeQL auto-fixes

          This commit contains automated security fixes generated by CodeQL analysis.
          Please review these changes before merging.
          
          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin ${{ steps.pr_info.outputs.pr_head_ref }}

      - name: Report Success
        if: steps.pr_info.outputs.should_run == 'true' && steps.fetch_alerts.outputs.has_alerts == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            core.info('✅ No CodeQL alerts found in PR files. Auto-fix not needed.');
