name: CodeQL Release Branch Scan

# This workflow runs CodeQL security analysis on the latest release branch and automatically
# creates a single GitHub issue summarising all findings:
# 1. Triggered on every push to a releases/** branch
# 2. Runs CodeQL analysis for C# and JavaScript/TypeScript
# 3. After analysis, queries the code scanning API for open alerts
# 4. Closes any previously created summary issue, then opens one new issue
#    listing every open alert in a consolidated table

on:
  push:
    branches:
      - "releases/**"

# Prevent duplicate scans when multiple commits are pushed in quick succession
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  codeql_scan:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['csharp', 'javascript-typescript']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build .NET solution
        if: matrix.language == 'csharp'
        run: dotnet build Micros.sln --configuration Release

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies for JavaScript/TypeScript projects
        if: matrix.language == 'javascript-typescript'
        run: |
          npm install
          cd ${{ github.workspace }}/Frontends/dj-panel && npm install
          cd ${{ github.workspace }}/CMS && npm install

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  create_issues_from_alerts:
    name: Create Issues for CodeQL Findings
    runs-on: ubuntu-latest
    needs: codeql_scan
    if: always() && needs.codeql_scan.result != 'cancelled'
    permissions:
      security-events: read
      issues: write
    steps:
      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'codeql-finding', color: 'e11d48', description: 'Automatically created from a CodeQL code scanning alert' },
              { name: 'security', color: 'd73a4a', description: 'Security-related issue' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                  console.log(`Created label: ${label.name}`);
                } else {
                  throw error;
                }
              }
            }

      - name: Create single summary issue for all CodeQL alerts
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref;
            const branch = ref.replace('refs/heads/', '');
            const summaryTitle = '[CodeQL] Security Scan Summary';

            // Fetch all open CodeQL alerts for this ref
            let alerts = [];
            try {
              alerts = await github.paginate(
                github.rest.codeScanning.listAlertsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  ref: ref,
                }
              );
            } catch (error) {
              console.log(`Failed to fetch CodeQL alerts: ${error.message}`);
              return;
            }

            console.log(`Found ${alerts.length} open CodeQL alert(s) on ${ref}`);

            if (alerts.length === 0) {
              console.log('No open CodeQL alerts found. No issue will be created.');
              return;
            }

            // Close any existing summary issues so the new one is always current
            const existingIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'codeql-finding',
              }
            );

            for (const issue of existingIssues) {
              if (issue.title === summaryTitle) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
                console.log(`Closed outdated summary issue #${issue.number}`);
              }
            }

            // Build a single consolidated issue body
            const rows = alerts.map(alert => {
              const location = alert.most_recent_instance?.location;
              const locationStr = location
                ? `${location.path}:${location.start_line}`
                : 'Unknown';
              const severity =
                alert.rule.security_severity_level ||
                alert.rule.severity ||
                'unknown';
              return `| #${alert.number} | \`${alert.rule.id}\` | ${severity} | \`${locationStr}\` | [View](${alert.html_url}) |`;
            });

            const body = [
              `## CodeQL Security Scan Results`,
              ``,
              `**Branch:** \`${branch}\`  `,
              `**Total findings:** ${alerts.length}`,
              ``,
              `| Alert # | Rule | Severity | Location | Link |`,
              `|---------|------|----------|----------|------|`,
              ...rows,
              ``,
              `---`,
              `_This issue was automatically created by the [CodeQL Release Branch Scan](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/codeql-production-scan.yml) workflow._`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: summaryTitle,
              body,
              labels: ['codeql-finding', 'security'],
            });

            console.log(`Created summary issue with ${alerts.length} alert(s).`);
