name: Delete Branch on PR Close

# This workflow automatically deletes the head branch of a pull request
# when the PR is closed (either merged or declined/abandoned).
#
# Protected branches are never deleted:
#   - main
#   - develop
#   - releases/** (any release branch)
#
# Trigger: pull_request → closed (any target branch)

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete_branch:
    name: Delete head branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete head branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner  = context.repo.owner;
            const repo   = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;

            // Never delete long-lived / protected branches
            const protected_patterns = [
              /^main$/,
              /^develop$/,
              /^releases\/.+/,
            ];

            if (protected_patterns.some(pattern => pattern.test(branch))) {
              core.info(`Branch "${branch}" is protected — skipping deletion.`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              core.info(`✅ Deleted branch: ${branch}`);
            } catch (err) {
              // 404 – reference not found; 422 – unprocessable (branch already gone)
              if (err.status === 404 || err.status === 422) {
                core.info(`Branch "${branch}" does not exist or was already deleted.`);
              } else {
                throw err;
              }
            }
