name: PR - Infra - Prometheus

# Validates pull requests that touch the Prometheus Dockerfile.
# Triggered automatically when the changed files belong to this component.

on:
  pull_request:
    paths:
      - 'Docker/infra/prometheus.Dockerfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Prometheus Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Docker/infra/prometheus.Dockerfile
