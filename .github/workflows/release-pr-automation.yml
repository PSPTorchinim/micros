name: Release PR Automation

# This workflow automates the lifecycle of release-to-production pull requests:
#
# 1. When a PR from a releases/** branch to production is marked "ready for review":
#    - Adds the GitHub Copilot bot as a reviewer.
#    - Resolves any open review threads so the PR is clean for final review.
#
# 2. When such a PR is successfully merged into production:
#    - Computes the name of the next release branch (increments the RYYMM month suffix).
#    - Creates that new release branch from the freshly updated production branch.
#    - Switches the repository default branch to the new release branch.
#    - Deletes the release branch that was just merged (keeping the branch list clean).
#
# 3. When a workflow run is waiting for environment approval (deployment_protection_rule):
#    - Automatically approves the pending deployment gate so pipelines are not blocked.
#
# Triggers:
#   - pull_request: ready_for_review, closed
#   (Only acted upon when the PR targets "production" from a "releases/**" head branch.)
#   - deployment_protection_rule (auto-approve environment gates)

on:
  pull_request:
    types:
      - ready_for_review
      - closed
    branches:
      - production
  deployment_protection_rule:

permissions:
  contents: write       # create / delete branches, update default branch
  pull-requests: write  # add reviewers, resolve review threads
  actions: write        # approve deployment protection rules

jobs:
  # ── Job 1: Add Copilot reviewer and resolve open review threads ──────────────
  add_reviewer_and_resolve_comments:
    name: Add Copilot Reviewer & Resolve Comments
    if: >
      github.event.action == 'ready_for_review' &&
      startsWith(github.event.pull_request.head.ref, 'releases/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add Copilot as reviewer and resolve open review threads
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PIPELINE_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            // ── 1. Request a review from GitHub Copilot ───────────────────────
            // GitHub Copilot code review is triggered by posting a comment that
            // mentions @copilot.  This is the supported API-compatible approach
            // when the "Copilot code review" feature is enabled on the repository.
            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: '@copilot review',
              });
              core.info('✅ Requested Copilot code review via comment.');
            } catch (err) {
              core.warning(`Could not request Copilot review: ${err.message}`);
            }

            // ── 2. For each open review thread: ask Copilot to fix it, then mark resolved ──
            // The REST API has no "resolve thread" endpoint; GraphQL is required.
            // Also fetch the first comment's databaseId so we can post a reply via REST.
            const query = `
              query($owner: String!, $repo: String!, $prNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $prNumber) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        comments(first: 1) {
                          nodes {
                            databaseId
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let threads;
            try {
              const result = await github.graphql(query, {
                owner,
                repo,
                prNumber,
              });
              threads = result.repository.pullRequest.reviewThreads.nodes;
            } catch (err) {
              core.warning(`Could not fetch review threads: ${err.message}`);
              return;
            }

            const openThreads = threads.filter(t => !t.isResolved);
            core.info(`Found ${openThreads.length} open review thread(s).`);

            const resolveMutation = `
              mutation($threadId: ID!) {
                resolveReviewThread(input: { threadId: $threadId }) {
                  thread {
                    id
                    isResolved
                  }
                }
              }
            `;

            for (const thread of openThreads) {
              const commentId = thread.comments.nodes[0]?.databaseId;

              // Step 1: Reply with @copilot fix so Copilot is assigned to address the comment
              if (commentId) {
                try {
                  await github.rest.pulls.createReplyForReviewComment({
                    owner,
                    repo,
                    pull_number: prNumber,
                    comment_id: commentId,
                    body: '@copilot fix',
                  });
                  core.info(`✅ Posted @copilot fix reply on comment ${commentId}.`);
                } catch (err) {
                  core.warning(`Could not reply to comment ${commentId}: ${err.message}`);
                }
              }

              // Step 2: Mark the thread as resolved
              try {
                await github.graphql(resolveMutation, { threadId: thread.id });
                core.info(`✅ Resolved thread ${thread.id}.`);
              } catch (err) {
                core.warning(`Could not resolve thread ${thread.id}: ${err.message}`);
              }
            }

  # ── Job 2: Post-merge cleanup and next release branch creation ───────────────
  post_merge:
    name: Post-Merge Branch Lifecycle
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'releases/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create next release branch, update default branch, delete merged branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PIPELINE_PAT }}
          script: |
            const owner       = context.repo.owner;
            const repo        = context.repo.repo;
            const mergedBranch = context.payload.pull_request.head.ref; // e.g. "releases/R2603"
            const base         = 'production';

            core.info(`Merged branch: ${mergedBranch}`);

            // ── 1. Compute the next release branch name ────────────────────────
            // Primary convention: releases/RYYMM or releases/RYYMM-N
            //   → strip any -N suffix, increment MM by 1 (with year rollover).
            //   e.g. "releases/R2603"   → "releases/R2604"
            //        "releases/R2603-2" → "releases/R2604"
            //        "releases/R2612"   → "releases/R2701"
            // Legacy convention: releases/YYYY-MM  →  increment month by 1.
            // Fallback: append / increment a numeric suffix for unrecognised patterns.
            function nextReleaseBranchName(current) {
              // Primary pattern: releases/RYYMM or releases/RYYMM-N
              const sprintPattern = /^releases\/R(\d{2})(\d{2})(?:-\d+)?$/;
              const sprintMatch = current.match(sprintPattern);

              if (sprintMatch) {
                let year  = parseInt(sprintMatch[1], 10);
                let month = parseInt(sprintMatch[2], 10);

                month += 1;
                if (month > 12) {
                  month = 1;
                  year += 1;
                }
                year = year % 100;
                return `releases/R${String(year).padStart(2, '0')}${String(month).padStart(2, '0')}`;
              }

              // Legacy pattern: releases/YYYY-MM  →  increment month by 1.
              const datePattern = /^releases\/(\d{4})-(\d{2})$/;
              const match = current.match(datePattern);

              if (match) {
                let year  = parseInt(match[1], 10);
                let month = parseInt(match[2], 10);

                month += 1;
                if (month > 12) {
                  month = 1;
                  year += 1;
                }
                return `releases/${year}-${String(month).padStart(2, '0')}`;
              }

              // Fallback: append / increment a numeric suffix
              const numericSuffix = /^(releases\/.+?)(?:-(\d+))?$/.exec(current);
              if (numericSuffix) {
                const branchBase = numericSuffix[1];
                const n          = numericSuffix[2] ? parseInt(numericSuffix[2], 10) + 1 : 2;
                return `${branchBase}-${n}`;
              }

              return `${current}-next`;
            }

            const nextBranch = nextReleaseBranchName(mergedBranch);
            core.info(`Next release branch: ${nextBranch}`);

            // ── 2. Resolve the current SHA of production ───────────────────────
            let productionSha;
            try {
              const { data: ref } = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${base}`,
              });
              productionSha = ref.object.sha;
              core.info(`Production SHA: ${productionSha}`);
            } catch (err) {
              core.setFailed(`Failed to resolve "${base}" branch SHA: ${err.message}`);
              return;
            }

            // ── 3. Create the next release branch from production ──────────────
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${nextBranch}`,
                sha: productionSha,
              });
              core.info(`✅ Created branch "${nextBranch}" from ${productionSha}.`);
            } catch (err) {
              if (err.status === 422) {
                core.warning(`Branch "${nextBranch}" already exists — skipping creation.`);
              } else {
                core.setFailed(`Failed to create branch "${nextBranch}": ${err.message}`);
                return;
              }
            }

            // ── 4. Set the new release branch as the default branch ────────────
            try {
              await github.rest.repos.update({
                owner,
                repo,
                default_branch: nextBranch,
              });
              core.info(`✅ Default branch updated to "${nextBranch}".`);
            } catch (err) {
              core.setFailed(`Failed to update default branch to "${nextBranch}": ${err.message}`);
              return;
            }

            // ── 5. Delete the merged release branch ───────────────────────────
            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${mergedBranch}`,
              });
              core.info(`✅ Deleted merged branch "${mergedBranch}".`);
            } catch (err) {
              // Non-fatal: log a warning but don't fail the entire job.
              core.warning(`Could not delete branch "${mergedBranch}": ${err.message}`);
            }

            // ── 6. Write a job summary ─────────────────────────────────────────
            core.summary.addRaw(
              `## ✅ Release Branch Lifecycle Complete\n\n` +
              `| Step | Detail |\n` +
              `|------|--------|\n` +
              `| Merged branch | \`${mergedBranch}\` → \`${base}\` |\n` +
              `| New release branch | \`${nextBranch}\` (created from \`${base}\` @ \`${productionSha.slice(0, 7)}\`) |\n` +
              `| Default branch | Updated to \`${nextBranch}\` |\n` +
              `| Deleted | \`${mergedBranch}\` |`
            );
            await core.summary.write();

  # ── Job 3: Auto-approve deployment protection rule gates ─────────────────────
  auto_approve_deployment:
    name: Auto-Approve Deployment Gate
    if: github.event_name == 'deployment_protection_rule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve pending deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const callbackUrl = context.payload.deployment_callback_url;
            const environment = context.payload.environment;

            // Validate required payload fields are present
            if (!callbackUrl) {
              core.setFailed('deployment_callback_url is missing from the event payload.');
              return;
            }
            if (!environment) {
              core.setFailed('environment is missing from the event payload.');
              return;
            }

            // Validate the callback URL belongs to the GitHub API domain to prevent SSRF,
            // and extract the run_id so we can use the explicit Octokit endpoint format.
            const urlPattern = /^https:\/\/api\.github\.com\/repos\/[^/]+\/[^/]+\/actions\/runs\/(\d+)\/deployment_protection_rule$/;
            const match = callbackUrl.match(urlPattern);
            if (!match) {
              core.setFailed(`Unexpected callback URL format: ${callbackUrl}`);
              return;
            }
            const runId = parseInt(match[1], 10);

            core.info(`Approving deployment to environment: ${environment} (run ${runId})`);

            try {
              await github.request(
                'POST /repos/{owner}/{repo}/actions/runs/{run_id}/deployment_protection_rule',
                {
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  run_id: runId,
                  environment_name: environment,
                  state: 'approved',
                  comment: 'Auto-approved by pipeline automation',
                }
              );
              core.info(`✅ Deployment to "${environment}" approved automatically.`);
            } catch (err) {
              core.setFailed(`Failed to approve deployment to "${environment}": ${err.message}`);
            }
