      - apigw_backends_net

  # ================================================
  # LOGGING & MONITORING SERVICES
  # ================================================

  loki:
    build:
      context: ../
      dockerfile: Docker/infra/loki.Dockerfile
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3100:3100"
    networks:
      - logging_net
      - public
    volumes:
      - loki_data:/loki

  promtail:
    build:
      context: ../
      dockerfile: Docker/infra/promtail.Dockerfile
    restart: unless-stopped
    pull_policy: always
    ports:
      - "9080:9080"
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logging_net
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/var/lib/promtail

  grafana:
    build:
      context: ../
      dockerfile: Docker/infra/grafana.Dockerfile
      args:
        GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER}
        GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
        PROJECT_NAME: ${PROJECT_NAME:-ix-dj-panel-development}
        REPLICA_INDEX: ${REPLICA_INDEX:-1}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3001:3001"
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - logging_net
      - public
    volumes:
      - grafana_data:/var/lib/grafana

networks:
  mongo_net:
    driver: bridge
    external: false
  redis_net:
    driver: bridge
    external: false
  rabbitmq_net:
    driver: bridge
    external: false
  sql_net:
    driver: bridge
    external: false
  apigw_backends_net:
