      - ASPNETCORE_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - ASPNETCORE_SECURE_KEY=${SECURE_KEY}
      - ASPNETCORE_JWT_KEY=${JWT_KEY}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_IDENTITY_BE_ADDRESS=${IDENTITY_BE_ADDRESS}
      - ASPNETCORE_MUSIC_BE_ADDRESS=${MUSIC_BE_ADDRESS}
      - ASPNETCORE_GEAR_BE_ADDRESS=${GEAR_BE_ADDRESS}
      - ASPNETCORE_DOCUMENTS_BE_ADDRESS=${DOCUMENTS_BE_ADDRESS}
      - ASPNETCORE_BRAND_BE_ADDRESS=${BRAND_BE_ADDRESS}
      - ASPNETCORE_PARTY_BE_ADDRESS=${PARTY_BE_ADDRESS}
      - ASPNETCORE_MAILING_BE_ADDRESS=${MAILING_BE_ADDRESS}
      - ASPNETCORE_DATABASE_CATALOG=${MAILING_DATABASE_CATALOG}
      - ASPNETCORE_DJPANEL_USER_EMAIL=${DJPANEL_USER_EMAIL}
      - ASPNETCORE_DJPANEL_USER_PASSWORD=${DJPANEL_USER_PASSWORD}
    restart: unless-stopped
    pull_policy: always
    expose:
      - "8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sql_net
      - redis_net
      - rabbitmq_net
      - apigw_backends_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  party_be:
    build:
      context: ../
      dockerfile: Docker/services/dotnet.Dockerfile
      args:
        MICROSERVICE_NAME: PartyAPI
    environment:
      - ASPNETCORE_DATABASE_HOST_SQLSERVER=${DATABASE_HOST_SQLSERVER}
      - ASPNETCORE_DATABASE_PORT_SQLSERVER=${DATABASE_PORT_SQLSERVER}
      - ASPNETCORE_DATABASE_USER_SQLSERVER=sa
      - ASPNETCORE_DATABASE_PASSWORD_SQLSERVER=${DATABASE_PASSWORD_SQLSERVER}
      - ASPNETCORE_DATABASE_HOST_MONGODB=${DATABASE_HOST_MONGODB}
      - ASPNETCORE_DATABASE_PORT_MONGODB=${DATABASE_PORT_MONGODB}
      - ASPNETCORE_DATABASE_USER_MONGODB=${DATABASE_USER_MONGODB}
      - ASPNETCORE_DATABASE_PASSWORD_MONGODB=${DATABASE_PASSWORD_MONGODB}
      - ASPNETCORE_REDIS_HOST=${REDIS_HOST}
      - ASPNETCORE_REDIS_PORT=${REDIS_PORT}
      - ASPNETCORE_REDIS_PASSWORD=${REDIS_PASSWORD}
      - ASPNETCORE_RABBITMQ_HOST=${RABBITMQ_HOST}
      - ASPNETCORE_RABBITMQ_PORT=${RABBITMQ_PORT}
      - ASPNETCORE_RABBITMQ_USER=${RABBITMQ_USER}
      - ASPNETCORE_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - ASPNETCORE_SECURE_KEY=${SECURE_KEY}
      - ASPNETCORE_JWT_KEY=${JWT_KEY}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_IDENTITY_BE_ADDRESS=${IDENTITY_BE_ADDRESS}
      - ASPNETCORE_MUSIC_BE_ADDRESS=${MUSIC_BE_ADDRESS}
      - ASPNETCORE_GEAR_BE_ADDRESS=${GEAR_BE_ADDRESS}
      - ASPNETCORE_DOCUMENTS_BE_ADDRESS=${DOCUMENTS_BE_ADDRESS}
      - ASPNETCORE_BRAND_BE_ADDRESS=${BRAND_BE_ADDRESS}
      - ASPNETCORE_PARTY_BE_ADDRESS=${PARTY_BE_ADDRESS}
      - ASPNETCORE_MAILING_BE_ADDRESS=${MAILING_BE_ADDRESS}
      - ASPNETCORE_DATABASE_CATALOG=${PARTY_DATABASE_CATALOG}
      - ASPNETCORE_DJPANEL_USER_EMAIL=${DJPANEL_USER_EMAIL}
      - ASPNETCORE_DJPANEL_USER_PASSWORD=${DJPANEL_USER_PASSWORD}
    restart: unless-stopped
    pull_policy: always
    expose:
      - "8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sql_net
      - redis_net
      - rabbitmq_net
      - apigw_backends_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ================================================
  # LOGGING & MONITORING SERVICES
  # ================================================

  loki:
    build:
      context: ../
      dockerfile: Docker/infra/loki.Dockerfile
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3100:3100"
    networks:
      - logging_net
      - public
    volumes:
      - loki_data:/loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  promtail:
    build:
      context: ../
      dockerfile: Docker/infra/promtail.Dockerfile
    restart: unless-stopped
    pull_policy: always
    ports:
      - "9080:9080"
    depends_on:
      loki:
        condition: service_started
    networks:
      - logging_net
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/var/lib/promtail
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  prometheus:
    build:
      context: ../
      dockerfile: Docker/infra/prometheus.Dockerfile
    restart: unless-stopped
    pull_policy: always
    ports:
      - "9090:9090"
    networks:
      - logging_net
      - sql_net
      - mongo_net
      - redis_net
      - public
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  sqlserver-exporter:
    image: awaragi/prometheus-mssql-exporter:latest
    environment:
      - SERVER=sqlserver
      - PORT=1433
      - USERNAME=sa
      - PASSWORD=${DATABASE_PASSWORD_SQLSERVER}
      - DEBUG=false
    restart: unless-stopped
    pull_policy: always
    ports:
      - "4000:4000"
    networks:
      - sql_net
      - logging_net
    depends_on:
      sqlserver:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    environment:
      - MONGODB_URI=mongodb://${DATABASE_USER_MONGODB}:${DATABASE_PASSWORD_MONGODB}@mongodb_container:27017
    command: ["--collect-all"]
    restart: unless-stopped
    pull_policy: always
    ports:
      - "9216:9216"
    networks:
      - mongo_net
      - logging_net
    depends_on:
      mongodb_container:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://${CMS_DATABASE_USERNAME}:${CMS_DATABASE_PASSWORD}@strapi_db:5432/${CMS_DATABASE_NAME}?sslmode=disable
    restart: unless-stopped
    pull_policy: always
    ports:
      - "9187:9187"
    networks:
      - strapi
      - logging_net
    depends_on:
      strapi_db:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "9121:9121"
    networks:
      - redis_net
      - logging_net
    depends_on:
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  grafana:
    build:
      context: ../
      dockerfile: Docker/infra/grafana.Dockerfile
      args:
        GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER}
        GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
        PROJECT_NAME: ${PROJECT_NAME:-ix-dj-panel-development}
        REPLICA_INDEX: ${REPLICA_INDEX:-1}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3001:3001"
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - logging_net
      - public
    volumes:
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  mongo_net:
    driver: bridge
    external: false
  redis_net:
    driver: bridge
    external: false
  rabbitmq_net:
    driver: bridge
    external: false
  sql_net:
    driver: bridge
    external: false
  apigw_backends_net:
    driver: bridge
    external: false
  apigw_fe_net:
    driver: bridge
    external: false
  strapi:
    driver: bridge
    external: false
  strapi_fe_net:
    driver: bridge
    external: false
  logging_net:
    driver: bridge
    external: false
  public:
    driver: bridge
    external: true

volumes:
  mongo_config:
    driver: local
  mongo_data:
    driver: local
  mssql_data:
    driver: local
  pg_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  strapi_app:
    driver: local
  loki_data:
    driver: local
  promtail_positions:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
