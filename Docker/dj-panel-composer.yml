name: djpanel

services:
  mongodb_container:
    build:
      context: ../
      dockerfile: Docker/infra/mongodb.Dockerfile
      args:
        DATABASE_USER_MONGODB: ${DATABASE_USER_MONGODB}
        DATABASE_PASSWORD_MONGODB: ${DATABASE_PASSWORD_MONGODB}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "27017:27017"
    networks:
      - mongo_net
      - public
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  strapi_db:
    image: postgres:18
    environment:
      - POSTGRES_DB=${CMS_DATABASE_NAME}
      - POSTGRES_USER=${CMS_DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${CMS_DATABASE_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    restart: unless-stopped
    pull_policy: always
    ports:
      - "5432:5432"
    networks:
      - strapi
      - public
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$POSTGRES_USER", "-d", "$POSTGRES_DB", "-h", "127.0.0.1", "-p", "5432"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  rabbitmq:
    build:
      context: ../
      dockerfile: Docker/infra/rabbitmq.Dockerfile
      args:
        RABBITMQ_USER: ${RABBITMQ_USER}
        RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "15672:15672"
    expose:
      - "5672"
      - "15672"
      - "15692"
    networks:
      - rabbitmq_net
      - public
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:8-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    user: root
    restart: unless-stopped
    pull_policy: always
    ports:
      - "6379:6379"
    networks:
      - redis_net
      - public
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DATABASE_PASSWORD_SQLSERVER}
      - DATABASE_PASSWORD_SQLSERVER=${DATABASE_PASSWORD_SQLSERVER}
    user: root
    restart: unless-stopped
    pull_policy: always
    ports:
      - "1433:1433"
    networks:
      - sql_net
      - public
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-U", "sa", "-P", "${DATABASE_PASSWORD_SQLSERVER}", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  apigateway:
    build:
      context: ../
      dockerfile: Docker/services/dotnet.Dockerfile
      args:
        MICROSERVICE_NAME: DJHostGateway
    environment:
      - ASPNETCORE_DATABASE_HOST_SQLSERVER=${DATABASE_HOST_SQLSERVER}
      - ASPNETCORE_DATABASE_PORT_SQLSERVER=${DATABASE_PORT_SQLSERVER}
      - ASPNETCORE_DATABASE_USER_SQLSERVER=sa
      - ASPNETCORE_DATABASE_PASSWORD_SQLSERVER=${DATABASE_PASSWORD_SQLSERVER}
      - ASPNETCORE_DATABASE_HOST_MONGODB=${DATABASE_HOST_MONGODB}
      - ASPNETCORE_DATABASE_PORT_MONGODB=${DATABASE_PORT_MONGODB}
      - ASPNETCORE_DATABASE_USER_MONGODB=${DATABASE_USER_MONGODB}
      - ASPNETCORE_DATABASE_PASSWORD_MONGODB=${DATABASE_PASSWORD_MONGODB}
      - ASPNETCORE_REDIS_HOST=${REDIS_HOST}
      - ASPNETCORE_REDIS_PORT=${REDIS_PORT}
      - ASPNETCORE_REDIS_PASSWORD=${REDIS_PASSWORD}
      - ASPNETCORE_RABBITMQ_HOST=${RABBITMQ_HOST}
      - ASPNETCORE_RABBITMQ_PORT=${RABBITMQ_PORT}
      - ASPNETCORE_RABBITMQ_USER=${RABBITMQ_USER}
      - ASPNETCORE_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - ASPNETCORE_SECURE_KEY=${SECURE_KEY}
      - ASPNETCORE_JWT_KEY=${JWT_KEY}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - ASPNETCORE_IDENTITY_BE_ADDRESS=${IDENTITY_BE_ADDRESS}
      - ASPNETCORE_MUSIC_BE_ADDRESS=${MUSIC_BE_ADDRESS}
      - ASPNETCORE_GEAR_BE_ADDRESS=${GEAR_BE_ADDRESS}
      - ASPNETCORE_DOCUMENTS_BE_ADDRESS=${DOCUMENTS_BE_ADDRESS}
      - ASPNETCORE_BRAND_BE_ADDRESS=${BRAND_BE_ADDRESS}
      - ASPNETCORE_PARTY_BE_ADDRESS=${PARTY_BE_ADDRESS}
      - ASPNETCORE_MAILING_BE_ADDRESS=${MAILING_BE_ADDRESS}
      - ASPNETCORE_DATABASE_CATALOG=${APIGATEWAY_DATABASE_CATALOG}
      - ASPNETCORE_DJPANEL_USER_EMAIL=${DJPANEL_USER_EMAIL}
      - ASPNETCORE_DJPANEL_USER_PASSWORD=${DJPANEL_USER_PASSWORD}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3000:8080"
    depends_on:
      brand_be:
        condition: service_healthy
      documents_be:
        condition: service_healthy
      gear_be:
        condition: service_healthy
      identity_be:
        condition: service_healthy
      mailing_be:
        condition: service_healthy
      music_be:
        condition: service_healthy
      party_be:
        condition: service_healthy
    networks:
      - apigw_backends_net
      - apigw_fe_net
      - public
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  dj-panel:
    build:
      context: ../
      dockerfile: Docker/frontends/react.Dockerfile
      args:
        MICROFRONTEND_NAME: dj-panel
        API_GATEWAY: ${API_GATEWAY}
        SECURE_KEY: ${SECURE_KEY}
        JWT_TOKEN: ${JWT_KEY}
        CMS_HOST: ${CMS_HOST}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3080:3000"
    networks:
      - rabbitmq_net
      - apigw_fe_net
      - public
      - strapi_fe_net
    depends_on:
      apigateway:
        condition: service_healthy
      strapi:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  storybook-dj-panel:
    build:
      context: ../
      dockerfile: Docker/frontends/storybook.Dockerfile
      args:
        MICROFRONTEND_NAME: dj-panel
    restart: unless-stopped
    pull_policy: always
    ports:
      - "6006:6006"
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  strapi:
    build:
      context: ../
      dockerfile: Docker/infra/strapi.Dockerfile
      args:
        CMS_DATABASE_CLIENT: ${CMS_DATABASE_CLIENT}
        CMS_NODE_ENV: ${ENVIRONMENT}
        CMS_DATABASE_HOST: ${CMS_DATABASE_HOST}
        CMS_DATABASE_PORT: ${CMS_DATABASE_PORT}
        DATABASE_NAME_POSTGRES: ${CMS_DATABASE_NAME}
        DATABASE_USERNAME_POSTGRES: ${CMS_DATABASE_USERNAME}
        DATABASE_PASSWORD_POSTGRES: ${CMS_DATABASE_PASSWORD}
        CMS_JWT_SECRET: ${CMS_JWT_SECRET}
        CMS_ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET}
        CMS_APP_KEYS: ${CMS_APP_KEYS}
        CMS_API_TOKEN_SALT: ${CMS_API_TOKEN_SALT}
        CMS_TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT}
        CMS_ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "1337:1337"
    networks:
      - strapi
      - public
      - strapi_fe_net
    depends_on:
      strapi_db:
        condition: service_healthy
    volumes:
      - strapi_app:/srv/app
    deploy:
