name: djpanel

services:
  mongodb_container:
    build:
      context: ../
      dockerfile: Docker/mongodb.Dockerfile
      args:
        DATABASE_USER_MONGODB: ${DATABASE_USER_MONGODB}
        DATABASE_PASSWORD_MONGODB: ${DATABASE_PASSWORD_MONGODB}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "27017:27017"
    networks:
      - mongo_net
      - public
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb

  strapi_db:
    build:
      context: ../
      dockerfile: Docker/postgres.Dockerfile
      args:
        DATABASE_NAME: ${CMS_DATABASE_NAME}
        DATABASE_USERNAME: ${CMS_DATABASE_USERNAME}
        DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD}
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - strapi
      - public
    volumes:
      - pg_data:/var/lib/postgresql/data

  rabbitmq:
    build:
      context: ../
      dockerfile: Docker/rabbitmq.Dockerfile
      args:
        RABBITMQ_USER: ${RABBITMQ_USER}
        RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    networks:
      - rabbitmq_net
      - public
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    build:
      context: ../
      dockerfile: Docker/redis.Dockerfile
      args:
        REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "6379:6379"
    networks:
      - redis_net
      - public
    volumes:
      - redis_data:/data

  sqlserver:
    build:
      context: ../
      dockerfile: Docker/sqlserver.Dockerfile
      args:
        DATABASE_PASSWORD_SQLSERVER: ${DATABASE_PASSWORD_SQLSERVER}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "1433:1433"
    networks:
      - sql_net
      - public
    volumes:
      - mssql_data:/var/opt/mssql

  strapi:
    build:
      context: ../
      dockerfile: Docker/strapi.Dockerfile
      args:
        CMS_DATABASE_CLIENT: ${CMS_DATABASE_CLIENT}
        CMS_NODE_ENV: ${CMS_NODE_ENV}
        CMS_DATABASE_NAME: ${CMS_DATABASE_NAME}
        CMS_DATABASE_HOST: ${CMS_DATABASE_HOST}
        CMS_DATABASE_PORT: ${CMS_DATABASE_PORT}
        CMS_DATABASE_USERNAME: ${CMS_DATABASE_USERNAME}
        CMS_DATABASE_PASSWORD: ${CMS_DATABASE_PASSWORD}
        CMS_JWT_SECRET: ${CMS_JWT_SECRET}
        CMS_ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET}
        CMS_APP_KEYS: ${CMS_APP_KEYS}
    restart: unless-stopped
    ports:
      - "1337:1337"
    networks:
      - strapi
      - public
      - strapi_fe_net
    depends_on:
      strapi_db:
        condition: service_healthy
    volumes:
      - strapi_app:/srv/app

  apigateway:
    build:
      context: ../
      dockerfile: Docker/microservice.Dockerfile
      args:
        MICROSERVICE_NAME: DJHostGateway
        DATABASE_HOST_SQLSERVER: ${DATABASE_HOST_SQLSERVER}
        DATABASE_PORT_SQLSERVER: ${DATABASE_PORT_SQLSERVER}
        DATABASE_USER_SQLSERVER: ${DATABASE_USER_SQLSERVER}
        DATABASE_PASSWORD_SQLSERVER: ${DATABASE_PASSWORD_SQLSERVER}
        DATABASE_HOST_MONGODB: ${DATABASE_HOST_MONGODB}
        DATABASE_PORT_MONGODB: ${DATABASE_PORT_MONGODB}
        DATABASE_USER_MONGODB: ${DATABASE_USER_MONGODB}
        DATABASE_PASSWORD_MONGODB: ${DATABASE_PASSWORD_MONGODB}
        REDIS_HOST: ${REDIS_HOST}
        REDIS_PORT: ${REDIS_PORT}
        REDIS_PASSWORD: ${REDIS_PASSWORD}
        RABBITMQ_HOST: ${RABBITMQ_HOST}
        RABBITMQ_PORT: ${RABBITMQ_PORT}
        RABBITMQ_USER: ${RABBITMQ_USER}
        RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
        SECURE_KEY: ${SECURE_KEY}
        JWT_KEY: ${JWT_KEY}
        ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
        ASPNETCORE_IDENTITY_BE_ADDRESS: ${ASPNETCORE_IDENTITY_BE_ADDRESS}
        ASPNETCORE_MUSIC_BE_ADDRESS: ${ASPNETCORE_MUSIC_BE_ADDRESS}
        ASPNETCORE_GEAR_BE_ADDRESS: ${ASPNETCORE_GEAR_BE_ADDRESS}
        ASPNETCORE_DOCUMENTS_BE_ADDRESS: ${ASPNETCORE_DOCUMENTS_BE_ADDRESS}
        ASPNETCORE_BRAND_BE_ADDRESS: ${ASPNETCORE_BRAND_BE_ADDRESS}
        ASPNETCORE_PARTY_BE_ADDRESS: ${ASPNETCORE_PARTY_BE_ADDRESS}
        ASPNETCORE_MAILING_BE_ADDRESS: ${ASPNETCORE_MAILING_BE_ADDRESS}
        DATABASE_CATALOG: ${DATABASE_CATALOG}
        DJPANEL_USER_EMAIL: ${DJPANEL_USER_EMAIL}
        DJPANEL_USER_PASSWORD: ${DJPANEL_USER_PASSWORD}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3000:8080"
    depends_on:
      brand_be:
        condition: service_healthy
      documents_be:
        condition: service_healthy
      gear_be:
        condition: service_healthy
      identity_be:
        condition: service_healthy
      mailing_be:
        condition: service_healthy
      music_be:
        condition: service_healthy
      party_be:
        condition: service_healthy
    networks:
      - apigw_backends_net
      - apigw_fe_net
      - public

  host_fe:
    build:
      context: ../
      dockerfile: Docker/microfrontend.Dockerfile
      args:
        MICROFRONTEND_NAME: dj-panel
        REACT_APP_API_GATEWAY: ${REACT_APP_API_GATEWAY}
        REACT_APP_API_SECURE_KEY: ${REACT_APP_API_SECURE_KEY}
        REACT_APP_API_JWT_TOKEN: ${REACT_APP_API_JWT_TOKEN}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "3080:3000"
    networks:
      - rabbitmq_net
      - apigw_fe_net
      - public
      - strapi_fe_net
    depends_on:
      apigateway:
        condition: service_healthy
      strapi:
        condition: service_healthy

