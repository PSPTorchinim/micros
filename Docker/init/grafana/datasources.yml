# Grafana Datasources Provisioning Configuration
# Auto-configures Loki and Prometheus as datasources on Grafana startup

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    version: 1
    editable: true
    isDefault: true
    jsonData:
      maxLines: 1000

  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    version: 1
    editable: true
    isDefault: false
    jsonData:
      timeInterval: '15s'

