# Promtail Configuration for DJ Beat Blaster Platform
# Collects logs from Docker containers and sends to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape logs from all Docker containers
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Set the container name as a label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Set the container ID as a label
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
      
      # Set the Docker image as a label
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      
      # Extract service name from container name (e.g., djpanel-identity_be-1 -> identity_be)
      - source_labels: ['__meta_docker_container_name']
        regex: '/djpanel-(.+?)-\d+'
        target_label: 'service'
        replacement: '$1'
      
      # Set Docker compose project
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      
      # Set Docker compose service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      
      # Add environment label if present
      - source_labels: ['__meta_docker_container_label_environment']
        target_label: 'environment'
        replacement: '$1'
      
      # Add microservice type label for .NET services
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(identity_be|music_be|gear_be|documents_be|brand_be|party_be|mailing_be|apigateway)'
        target_label: 'type'
        replacement: 'microservice'
      
      # Add frontend type label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(host_fe|strapi)'
        target_label: 'type'
        replacement: 'frontend'
      
      # Add infrastructure type label
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(mongodb_container|sqlserver|redis|rabbitmq|strapi_db)'
        target_label: 'type'
        replacement: 'infrastructure'
    
    pipeline_stages:
      # Parse JSON logs from .NET services
      - json:
          expressions:
            timestamp: Timestamp
            level: Level
            message: RenderedMessage
            exception: Exception
      
      # Set log level
      - labels:
          level:
      
      # Parse timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      
      # Output to Loki
      - output:
          source: message
