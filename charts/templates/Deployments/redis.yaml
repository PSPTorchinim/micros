{{- range .Values.redis }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: {{ .mountPath | default "/data" }}
      volumes:
        - name: redis-data
          hostPath:
            path: {{ .hostPath | default "/mnt/{{ .name }}-data" }}
            type: DirectoryOrCreate
---
{{- end }}