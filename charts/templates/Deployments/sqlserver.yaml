{{- range .Values.sqlserver }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          ports:
            - containerPort: 1433
          volumeMounts:
            - name: mssql-data
              mountPath: {{ .mountPath | default "/var/opt/mssql" }}
      volumes:
        - name: mssql-data
          hostPath:
            path: {{ .hostPath | default "/mnt/truenas/sqlserver-data" }}
            type: DirectoryOrCreate
---
{{- end }}