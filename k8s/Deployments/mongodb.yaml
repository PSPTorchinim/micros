apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          volumeMounts:
            - name: mongodb-pvc
              mountPath: /data/db
            - name: mongodb-config-pvc
              mountPath: /data/configdb
      volumes:
        - name: mongodb-pvc
          persistentVolumeClaim:
            claimName: mongodb-pvc
        - name: mongodb-config-pvc
          persistentVolumeClaim:
            claimName: mongodb-config-pvc
      restartPolicy: Always
