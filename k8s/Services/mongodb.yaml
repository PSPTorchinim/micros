{{- range .Values.mongodb.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  type: {{- if .nodePort }} NodePort {{- else }} ClusterIP {{- end }}
  ports:
    - port: 27017
      targetPort: 27017
      {{- if .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
  selector:
    app: {{ .name }}
{{- end }}
