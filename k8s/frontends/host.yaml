# ============================================================
# DJ Panel Host Frontend
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-fe
  namespace: djpanel
  labels:
    app.kubernetes.io/name: host-fe
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: djpanel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: host-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: host-fe
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: djpanel
    spec:
      initContainers:
        - name: wait-for-apigateway
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z apigateway 8080 && nc -z strapi 1337; do echo "Waiting for apigateway and strapi..."; sleep 5; done
      containers:
        - name: host-fe
          image: ghcr.io/psptorchinim/micros/frontends/dj-panel:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: REACT_APP_API_GATEWAY
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: API_GATEWAY
            - name: REACT_APP_API_SECURE_KEY
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: SECURE_KEY
            - name: REACT_APP_API_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: JWT_KEY
            - name: REACT_APP_CMS_HOST
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: CMS_HOST
            - name: REACT_APP_CMS_PORT
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: CMS_PORT
            - name: REACT_APP_CMS_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: CMS_PROTOCOL
            - name: REACT_APP_CMS_API_PATH
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: CMS_API_PATH
            - name: NODE_ENV
              value: production
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      securityContext:
        runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: host-fe
  namespace: djpanel
  labels:
    app.kubernetes.io/name: host-fe
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: djpanel
spec:
  selector:
    app.kubernetes.io/name: host-fe
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
  type: NodePort
