# ============================================================
# Storybook - Component Library Frontend
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storybook
  namespace: djpanel
  labels:
    app.kubernetes.io/name: storybook
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: djpanel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storybook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storybook
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: djpanel
    spec:
      containers:
        - name: storybook
          image: ghcr.io/psptorchinim/micros/frontends/storybook-dj-panel:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      securityContext:
        runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: storybook
  namespace: djpanel
  labels:
    app.kubernetes.io/name: storybook
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: djpanel
spec:
  selector:
    app.kubernetes.io/name: storybook
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30606
  type: NodePort
