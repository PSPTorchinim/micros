# ============================================================
# Observability ConfigMaps
# Loki, Tempo, Prometheus, and Promtail configurations
# ============================================================

# ── Loki ─────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: djpanel
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: djpanel
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
      filesystem:
        directory: /loki/chunks

    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      per_stream_rate_limit: 10MB
      per_stream_rate_limit_burst: 20MB
      max_query_series: 10000
      max_query_lookback: 168h

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

    query_range:
      align_queries_with_step: true
      max_retries: 5
      cache_results: true

    frontend:
      max_outstanding_per_tenant: 2048
      compress_responses: true

    querier:
      max_concurrent: 20
---
# ── Tempo ─────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: djpanel
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: djpanel
data:
  tempo-config.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 48h

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    query_frontend:
      search:
        max_duration: 0

    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
      traces_storage:
        path: /var/tempo/generator/traces

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
---
# ── Prometheus ────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: djpanel
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: djpanel
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'dj-panel'
        replica: '1'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'sqlserver'
        static_configs:
          - targets: ['sqlserver-exporter:4000']
            labels:
              service: 'sqlserver'
              database_type: 'mssql'
              instance_name: 'primary'

      - job_name: 'mongodb'
        static_configs:
          - targets: ['mongodb-exporter:9216']
            labels:
              service: 'mongodb'
              database_type: 'mongodb'
              instance_name: 'primary'

      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
            labels:
              service: 'postgres'
              database_type: 'postgres'
              instance_name: 'strapi'

      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
            labels:
              service: 'redis'
              database_type: 'redis'
              instance_name: 'cache'

      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq:15692']
            labels:
              service: 'rabbitmq'
              instance_name: 'primary'
---
# ── Promtail ──────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: djpanel
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: djpanel
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: info

    positions:
      filename: /var/lib/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - djpanel

        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: drop
            regex: "false"

          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app

          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component

          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__

        pipeline_stages:
          - cri: {}
          - match:
              selector: '{component=~"identity|music|gear|documents|brand|party|mailing|apigateway"}'
              stages:
                - json:
                    expressions:
                      timestamp: Timestamp
                      level: Level
                      message: RenderedMessage
                      exception: Exception
                - labels:
                    level:
                - timestamp:
                    source: timestamp
                    format: RFC3339Nano
                - output:
                    source: message
