# ============================================================
# Grafana - Metrics & Logs Dashboard
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: djpanel
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: djpanel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: djpanel
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: djpanel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: djpanel
    spec:
      containers:
        - name: grafana
          image: ghcr.io/psptorchinim/micros/infra/grafana:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: PIPELINE_PAT
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: PIPELINE_PAT
            - name: GITHUB_REPO_OWNER
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: GITHUB_REPO_OWNER
            - name: GITHUB_REPO_NAME
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: GITHUB_REPO_NAME
            - name: PROJECT_NAME
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: PROJECT_NAME
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      securityContext:
        runAsUser: 0
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: djpanel
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: djpanel
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30001
  type: NodePort
