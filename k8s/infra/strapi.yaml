# ============================================================
# Strapi CMS - Infrastructure Service
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: strapi-app
  namespace: djpanel
  labels:
    app.kubernetes.io/name: strapi
    app.kubernetes.io/part-of: djpanel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strapi
  namespace: djpanel
  labels:
    app.kubernetes.io/name: strapi
    app.kubernetes.io/component: cms
    app.kubernetes.io/part-of: djpanel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: strapi
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strapi
        app.kubernetes.io/component: cms
        app.kubernetes.io/part-of: djpanel
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "Waiting for postgres..."; sleep 3; done
      containers:
        - name: strapi
          image: ghcr.io/psptorchinim/micros/infra/strapi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 1337
              name: strapi
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: CMS_NODE_ENV
            - name: DATABASE_CLIENT
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: CMS_DATABASE_CLIENT
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: CMS_DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: djpanel-config
                  key: CMS_DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: CMS_DATABASE_NAME
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: CMS_DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: CMS_DATABASE_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: CMS_JWT_SECRET
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: CMS_ADMIN_JWT_SECRET
            - name: APP_KEYS
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: CMS_APP_KEYS
            - name: API_TOKEN_SALT
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: CMS_API_TOKEN_SALT
            - name: TRANSFER_TOKEN_SALT
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: CMS_TRANSFER_TOKEN_SALT
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: djpanel-secrets
                  key: CMS_ENCRYPTION_KEY
          volumeMounts:
            - name: strapi-app
              mountPath: /srv/app
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 1337
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 1337
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 5
      securityContext:
        runAsUser: 0
      volumes:
        - name: strapi-app
          persistentVolumeClaim:
            claimName: strapi-app
---
apiVersion: v1
kind: Service
metadata:
  name: strapi
  namespace: djpanel
  labels:
    app.kubernetes.io/name: strapi
    app.kubernetes.io/component: cms
    app.kubernetes.io/part-of: djpanel
spec:
  selector:
    app.kubernetes.io/name: strapi
  ports:
    - name: strapi
      port: 1337
      targetPort: 1337
  type: ClusterIP
