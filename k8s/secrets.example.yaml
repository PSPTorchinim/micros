# ============================================================
# DJ Panel - Kubernetes Secrets Template
# ============================================================
# This file is a TEMPLATE. Replace all <placeholder> values
# with your actual secrets before applying.
#
# Apply with:
#   kubectl apply -f secrets.yaml -n djpanel
#
# All values must be base64 encoded:
#   echo -n 'your-value' | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: djpanel-secrets
  namespace: djpanel
  labels:
    app.kubernetes.io/part-of: djpanel
type: Opaque
stringData:
  # ── Databases ──────────────────────────────────────────────
  DATABASE_PASSWORD_SQLSERVER: "<your-mssql-sa-password>"
  DATABASE_USER_MONGODB: "<your-mongodb-root-user>"
  DATABASE_PASSWORD_MONGODB: "<your-mongodb-root-password>"
  CMS_DATABASE_NAME: "<your-postgres-db-name>"
  CMS_DATABASE_USERNAME: "<your-postgres-user>"
  CMS_DATABASE_PASSWORD: "<your-postgres-password>"

  # ── Message Broker ─────────────────────────────────────────
  RABBITMQ_USER: "<your-rabbitmq-user>"
  RABBITMQ_PASSWORD: "<your-rabbitmq-password>"

  # ── Cache ──────────────────────────────────────────────────
  REDIS_PASSWORD: "<your-redis-password>"

  # ── Application Security ───────────────────────────────────
  SECURE_KEY: "<your-app-secure-key>"
  JWT_KEY: "<your-jwt-signing-key>"

  # ── CMS (Strapi) ───────────────────────────────────────────
  CMS_JWT_SECRET: "<your-strapi-jwt-secret>"
  CMS_ADMIN_JWT_SECRET: "<your-strapi-admin-jwt-secret>"
  CMS_APP_KEYS: "<key1>,<key2>,<key3>,<key4>"
  CMS_API_TOKEN_SALT: "<your-strapi-api-token-salt>"
  CMS_TRANSFER_TOKEN_SALT: "<your-strapi-transfer-token-salt>"
  CMS_ENCRYPTION_KEY: "<your-strapi-encryption-key>"

  # ── Monitoring ─────────────────────────────────────────────
  GRAFANA_ADMIN_USER: "<your-grafana-admin-user>"
  GRAFANA_ADMIN_PASSWORD: "<your-grafana-admin-password>"

  # ── Default Application User ───────────────────────────────
  DJPANEL_USER_EMAIL: "<your-default-user-email>"
  DJPANEL_USER_PASSWORD: "<your-default-user-password>"

  # ── GitHub (for Grafana issue integration) ─────────────────
  PIPELINE_PAT: "<your-github-personal-access-token>"
  GITHUB_REPO_OWNER: "<your-github-org-or-user>"
  GITHUB_REPO_NAME: "micros"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: djpanel-config
  namespace: djpanel
  labels:
    app.kubernetes.io/part-of: djpanel
data:
  # ── Environment ────────────────────────────────────────────
  ENVIRONMENT: "Production"
  CMS_DATABASE_CLIENT: "postgres"
  CMS_NODE_ENV: "production"
  PROJECT_NAME: "djpanel"

  # ── Database Hosts (Kubernetes service names) ──────────────
  DATABASE_HOST_SQLSERVER: "sqlserver"
  DATABASE_PORT_SQLSERVER: "1433"
  DATABASE_HOST_MONGODB: "mongodb"
  DATABASE_PORT_MONGODB: "27017"
  CMS_DATABASE_HOST: "postgres"
  CMS_DATABASE_PORT: "5432"

  # ── Message Broker ─────────────────────────────────────────
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"

  # ── Cache ──────────────────────────────────────────────────
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # ── Database Catalog Names ─────────────────────────────────
  APIGATEWAY_DATABASE_CATALOG: "DJHostGateway"
  IDENTITY_DATABASE_CATALOG: "IdentityAPI"
  MUSIC_DATABASE_CATALOG: "MusicAPI"
  GEAR_DATABASE_CATALOG: "EquipmentAPI"
  DOCUMENTS_DATABASE_CATALOG: "DocumentsAPI"
  BRAND_DATABASE_CATALOG: "CompanyAPI"
  MAILING_DATABASE_CATALOG: "MailingAPI"
  PARTY_DATABASE_CATALOG: "PartyAPI"

  # ── Internal Service Addresses (Kubernetes ClusterIP DNS) ──
  IDENTITY_BE_ADDRESS: "http://identity:8080"
  MUSIC_BE_ADDRESS: "http://music:8080"
  GEAR_BE_ADDRESS: "http://gear:8080"
  DOCUMENTS_BE_ADDRESS: "http://documents:8080"
  BRAND_BE_ADDRESS: "http://brand:8080"
  PARTY_BE_ADDRESS: "http://party:8080"
  MAILING_BE_ADDRESS: "http://mailing:8080"
  CMS_HOST: "http://strapi:1337"

  # ── Frontend API Gateway Address ───────────────────────────
  # Update this to match your Ingress or NodePort URL
  API_GATEWAY: "http://<truenas-host>:3000"
  CMS_PORT: "1337"
  CMS_PROTOCOL: "http"
  CMS_API_PATH: "/api"

  # ── Observability Addresses ────────────────────────────────
  ASPNETCORE_TEMPO_ENDPOINT: "http://tempo:4317"
  ASPNETCORE_LOKI_URL: "http://loki:3100"
