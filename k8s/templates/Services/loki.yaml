{{- range .Values.loki.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  type: {{- if .nodePort }} NodePort {{- else }} ClusterIP {{- end }}
  ports:
    - port: 3100
      targetPort: 3100
      {{- if .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
  selector:
    app: {{ .name }}
{{- end }}