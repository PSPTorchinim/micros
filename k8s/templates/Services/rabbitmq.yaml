{{- range .Values.rabbitmq.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  type: {{- if .nodePort }} NodePort {{- else }} ClusterIP {{- end }}
  ports:
    - port: 5672
      targetPort: 5672
      {{- if .nodePort }}
      nodePort: {{ .nodePort }}
      {{- end }}
    - port: 15672
      targetPort: 15672
      {{- if .nodePort15672 }}
      nodePort: {{ .nodePort15672 }}
      {{- end }}
  selector:
    app: {{ .name }}
{{- end }}
